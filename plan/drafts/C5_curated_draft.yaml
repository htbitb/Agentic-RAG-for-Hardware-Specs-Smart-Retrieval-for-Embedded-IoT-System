    reference_solution:
      answer: |
        Here is the plan.

        1. **Pin allocation.** STM32 USART1: PA9 = TX and PA10 = RX (AF7) to the nRF52840 UARTE (its pins are freely assignable); PB0 (push-pull output) drives an nRF52840 GPIO configured as the wake-up (DETECT) source for leaving System OFF; PB1 (push-pull output) drives the enable input of the probe's load switch; PC14/PC15 = OSC32_IN/OSC32_OUT for the LSE crystal.
        2. **Logic levels.** Both chips share the 3.0 V rail. STM32 VOH >= VDD - 0.4 = 2.6 V is above the nRF52840 VIH of 0.7 x 3.0 = 2.1 V, and the nRF52840 VOH >= VDD - 0.4 = 2.6 V is above the STM32 VIH of 0.7 x 3.0 = 2.1 V; both VOL limits (0.4 V) are below the VIL limits (0.3 x 3.0 = 0.9 V). The levels are compatible, so the UART and wake-up lines are wired directly.
        3. **STM32 low-power mode.** Standby with the RTC on the LSE crystal draws 0.655 µA typical at 3 V (DS12288 Table 32) and keeps the brown-out reset active (the BOR is not available in Shutdown). Stop 1 (80.5 µA typical, Table 30) would dominate the whole budget.
        4. **Sleep-current table (3.0 V, 25 °C, typical).**
           - STM32G474, Standby + RTC (LSE): 0.655 µA
           - nRF52840, System OFF without RAM retention: 0.40 µA (nRF52840 PS, IOFF_RAMOFF_RESET)
           - LDO quiescent current: 2 µA
           - Probe behind its load switch: 0 µA

           Total sleep current = 0.655 + 0.40 + 2 = 3.06 µA.
        5. **Average current over one 10-minute cycle.** Active charge per cycle = 10 mA x 1.5 s = 15 mC; sleep charge = 3.06 µA x 598.5 s = 1.83 mC. Average current = (15 mC + 1.83 mC) / 600 s = 28.0 µA.
        6. **Battery life.** 2600 mAh / 0.0280 mA = 92700 h, i.e. about 10.6 years (127 months). The 12-year target is not met: 12 years need about 28.0 µA x 105120 h = 2948 mAh, or an average current of at most 2600 mAh / 105120 h = 24.7 µA.
        7. **Options to reach 12 years** (one of them is enough, or combine them):
           - a larger battery: at least 2948 mAh, e.g. a 3600 mAh cell of the same chemistry for margin;
           - a longer wake-up interval: at least 692 s (about 12 minutes) instead of 10 minutes, with the same 1.5 s / 10 mA active phase;
           - a shorter active phase: at most about 1.3 s at 10 mA per 10-minute cycle (lower BLE TX power, shorter connection, faster probe read).

           The 12-minute interval is the cheapest change if the application accepts it.
