  turns:
  - user: 'Help me design a data-acquisition node end to end. An STM32G474 on our own PCB (VDD = 3.3 V) reads a digital pressure-sensor module (3.3 V I/O, 4.7 kΩ pull-ups on the module) over I2C1 in standard mode (100 kHz, controller, open-drain pins) and forwards every sample to an ESP32-WROOM module (3.3 V I/O) over USART2 (8 data bits, no parity, 1 stop bit, oversampling by 16, transmitter and receiver enabled). The ESP32 runs a fixed UART-to-Wi-Fi bridge firmware written by a colleague, so the STM32 side has to match its UART settings; the baud rate must be within ±2 %. Choose the I2C1 and USART2 pins yourself. The STM32 has a crystal on its HSE pins and must run SYSCLK = HCLK = PCLK1 = PCLK2 = 170 MHz from the main PLL fed by HSE (within 0.1 %). The node is powered from a USB port through a 3.3 V LDO rated 250 mA that supplies the STM32, the sensor module (1 mA) and the ESP32: check whether that regulator is adequate. The plan must cover the clock tree with the PLL M/N/R values, the pin allocation, the logic-level compatibility of both links, the UART baud-rate register value and the 3.3 V current budget. Write bare-metal C for the STM32G474 that accesses registers the CMSIS way (e.g. `TIM1->PSC = ...;`, `RCC->APB2ENR |= RCC_APB2ENR_TIM1EN;`) using the register and bit names of ST''s `stm32g4xx.h` device header. Do not use HAL or LL drivers, `SystemCoreClock` or any other library function; write clock frequencies as numeric constants. Do not use interrupts; busy-wait loops on status flags are fine. Initial state: the chip has just come out of reset: SYSCLK = HCLK = PCLK1 = PCLK2 = 16 MHz (HSI16), all prescalers are 1, no peripheral clock beyond the reset defaults is enabled, and all GPIO pins are in their reset state. Answer with a design plan of at least 5 numbered steps, then one complete C code block (`#include "stm32g4xx.h"`, then a `main()` that configures everything and finally loops forever with `while (1)`). The code only has to bring up the clock tree, USART2 and I2C1.'
