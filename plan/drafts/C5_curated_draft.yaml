    reference_solution:
      answer: |
        Here is the plan.

        1. **Clock tree (8 MHz HSE -> 160 MHz).** PLLSRC = HSE; PLLM = 2 gives 8 MHz / 2 = 4 MHz (PLL input 2.66-16 MHz), PLLN = 80 gives a 320 MHz VCO (96-344 MHz) and PLLR = 2 gives SYSCLK = 160 MHz (DS12288 Table 46). 160 MHz needs Range 1 boost mode (clear PWR_CR5.R1MODE, AHB /2 during the switch) and LATENCY = 4 wait states (RM0440 Table 9).
        2. **Pin allocation.** USART1 with flow control: PA9 = TX, PA10 = RX, PA12 = RTS, PA11 = CTS (all AF7, DS12288 Table 13); PA0 = WKUP1 for the wake-up line from the nRF52840; PF0/PF1 = OSC_IN/OSC_OUT for the 8 MHz crystal.
        3. **nRF52840 I/O level.** The nRF52840 is supplied on VDDH, i.e. High Voltage mode, where the GPIO high level equals the REG0 output set by UICR.REGOUT0 (nRF52840 PS); an erased REGOUT0 (VOUT = 7) selects the 1.8 V default. So the nRF52840 GPIOs swing 0-1.8 V while the STM32 GPIOs swing 0-3.3 V.
        4. **Logic-level check.** STM32 -> nRF52840 (TX, RTS): a 3.3 V high exceeds the nRF52840 absolute maximum of VDD + 0.3 = 2.1 V. nRF52840 -> STM32 (RX, CTS, wake-up): a 1.8 V high is below the STM32 VIH minimum of 0.7 x 3.3 = 2.31 V. All five signals therefore go through a level shifter: a dual-supply translator with VCCA = 1.8 V from the nRF52840 VDD pin and VCCB = 3.3 V, 1 Mbit/s capable, with TX/RTS translated 3.3 V -> 1.8 V and RX/CTS/wake-up translated 1.8 V -> 3.3 V.
        5. **Why REGOUT0 = 3.3 V is not the fix.** REG0 needs VDDH at least 0.3 V above its output, so a 3.3 V setting needs VDDH >= 3.6 V; the Li-ion cell goes down to 3.0 V, so the nRF52840 supply would drop below 3.3 V late in the discharge while the STM32 keeps driving 3.3 V.
        6. **STM32 idle mode and current.** Standby keeps SRAM2 when PWR_CR3.RRS = 1 and wakes on WKUP1 (PA0) without the RTC; Shutdown would lose SRAM2 and Stop 1 draws 80.5 µA. At 3 V and 25 °C: Standby without RTC 0.13 µA + SRAM2 retention 0.305 µA (DS12288 Table 32). Total STM32 idle current = 0.13 + 0.305 = 0.44 µA, within the 2 µA allowance (the translator's VCCB leakage must fit in the remaining 1.5 µA).
