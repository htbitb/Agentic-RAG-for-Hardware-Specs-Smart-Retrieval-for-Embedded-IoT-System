  turns:
  - user: 'Help me design the main board of a BLE-connected alarm unit. An STM32G474 on our own PCB (VDD = 3.3 V) with a 25 MHz crystal on its HSE pins must run SYSCLK = HCLK = PCLK1 = PCLK2 = 150 MHz from the main PLL fed by HSE in voltage Range 1 normal mode (within 0.1 %). It drives the input of a piezo-buzzer driver with a 4 kHz, 50 % PWM from TIM3 channel 1 on PA6 (within ±1 %; edge-aligned PWM mode 1, active-high) and exchanges data with an nRF52840 (aQFN73 package) over USART3 with TX on PB10 and RX on PB11 at 460800 baud (within ±2 %), 8 data bits, no parity, 1 stop bit, oversampling by 16, transmitter and receiver enabled. The nRF52840 is supplied on its VDDH pin from a regulated 4.0 V rail, and our production script programs UICR.REGOUT0 to 3.3 V (VOUT = 5). The plan must cover the clock tree with the PLL M/N/R values and the Flash wait states, the pin allocation, and the logic-level compatibility of the UART link (with the datasheet thresholds and the regulator headroom). Write bare-metal C for the STM32G474 that accesses registers the CMSIS way (e.g. `TIM1->PSC = ...;`, `RCC->APB2ENR |= RCC_APB2ENR_TIM1EN;`) using the register and bit names of ST''s `stm32g4xx.h` device header. Do not use HAL or LL drivers, `SystemCoreClock` or any other library function; write clock frequencies as numeric constants. Do not use interrupts; busy-wait loops on status flags are fine. Initial state: the chip has just come out of reset: SYSCLK = HCLK = PCLK1 = PCLK2 = 16 MHz (HSI16), all prescalers are 1, no peripheral clock beyond the reset defaults is enabled, and all GPIO pins are in their reset state. Answer with a design plan of at least 5 numbered steps, then one complete C code block (`#include "stm32g4xx.h"`, then a `main()` that configures everything and finally loops forever with `while (1)`). The code only has to bring up the clock tree, the buzzer PWM and USART3.'
