    reference_solution:
      answer: |
        Here is the plan.

        1. **Clock tree (12 MHz HSE -> 160 MHz).** PLLSRC = HSE; PLLM = 3 gives 12 MHz / 3 = 4 MHz (PLL input 2.66-16 MHz), PLLN = 80 gives a 320 MHz VCO (96-344 MHz) and PLLR = 2 gives SYSCLK = 160 MHz (DS12288 Table 46). 160 MHz is above the 150 MHz limit of Range 1 normal mode, so Range 1 boost mode is needed (clear PWR_CR5.R1MODE, with the AHB /2 step during the switch), and the Flash needs LATENCY = 4 wait states (RM0440 Table 9: 136 < 160 <= 170 MHz in boost mode).
        2. **Pin allocation.** I2C1: PA15 = I2C1_SCL (AF4) and PB7 = I2C1_SDA (AF4), open-drain; USART1: PA9 = TX and PA10 = RX (AF7) to the ESP32; PB0 = push-pull output to the ESP32 CHIP_PU (enable) pin, with a 10 kΩ pull-down; PF0/PF1 = OSC_IN/OSC_OUT for the 12 MHz crystal; PC14/PC15 = OSC32_IN/OSC32_OUT for the LSE crystal; PA13/PA14 stay free for SWD.
        3. **Gas-sensor interface (1.8 V).** The gas sensor's high level is at most 1.8 V, below the STM32 VIH minimum of 0.7 x 3.3 = 2.31 V (DS12288 Table 54), and the 3.3 V MCU side would exceed the sensor's 1.8 V I/O rating, so a bidirectional I2C level shifter (e.g. PCA9306 or LSF0102, pull-ups to 1.8 V on the sensor side and to 3.3 V on the MCU side, sized for 400 kHz) sits between PA15/PB7 and the gas sensor.
        4. **ESP32 interface (3.3 V).** STM32 VOH >= VDD - 0.4 = 2.9 V > ESP32 VIH = 0.75 x 3.3 = 2.48 V; ESP32 VOH >= 0.8 x 3.3 = 2.64 V > STM32 VIH = 2.31 V; VOL 0.4 V / 0.33 V are below VIL 0.83 V / 0.99 V. The UART levels are compatible, so TX/RX are wired directly with a common ground. The CHIP_PU input is held low by the pull-down (the ESP32 shuts down below 0.6 V on CHIP_PU) and driven high by PB0 to boot the ESP32.
        5. **Low-power states.** ESP32 Deep-sleep (10 µA) would exceed the 8 µA budget on its own, and Hibernation (5 µA) leaves too little room for the other loads (8.2 µA with them), so the ESP32 is switched fully off with CHIP_PU low (Power off: 1 µA, ESP32 datasheet Table 4-2) and re-booted for each report. The STM32 uses Standby with the RTC on the LSE (0.655 µA typical at 3 V, DS12288 Table 32) and an 1800 s RTC wake-up; Stop 1 (80.5 µA) is far above the budget.
        6. **Sleep-current table (typical, 3 V, 25 °C).**
           - STM32G474, Standby + RTC (LSE): 0.655 µA
           - ESP32, power off (CHIP_PU low): 1 µA
           - Gas sensor, sleep: 1.5 µA
           - LDO quiescent current: 1 µA

           Total sleep current = 0.655 + 1 + 1.5 + 1 = 4.16 µA, inside the 8 µA budget (about 3.8 µA of margin, which also covers the leakage of the level shifter).
