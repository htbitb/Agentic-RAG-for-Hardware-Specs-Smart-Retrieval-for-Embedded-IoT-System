    reference_solution:
      answer: |
        Thanks: the breakout runs the sensor I/O at 1.8 V with no translator on board, so the interface needs care.

        1. **Clock tree (16 MHz HSE -> 150 MHz, Range 1 normal mode).** PLLSRC = HSE; PLLM = 4 gives 16 MHz / 4 = 4 MHz (PLL input 2.66-16 MHz), PLLN = 75 gives a 300 MHz VCO (96-344 MHz) and PLLR = 2 gives SYSCLK = 150 MHz (DS12288 Table 46). 150 MHz is the Range 1 normal-mode limit, so R1MODE stays at its reset value 1, and the Flash needs LATENCY = 4 wait states (RM0440 Table 9: 4 WS up to 150 MHz in normal mode).
        2. **Pin allocation.** I2C1: PA15 = I2C1_SCL (AF4) and PB7 = I2C1_SDA (AF4), open-drain. Sensor interrupt -> PA0 (WKUP1, also an EXTI line), so the sensor can wake the STM32 from Standby as well as from Stop. LED -> PB0 (push-pull output). USART1 debug port on PA9/PA10 (AF7) as given; PF0/PF1 = OSC_IN/OSC_OUT for the 16 MHz crystal; PA13/PA14 stay free for SWD.
        3. **Logic-level check.** The sensor's high level is at most 1.8 V, below the STM32 VIH minimum of 0.7 x VDD = 2.31 V at VDD = 3.3 V (DS12288 Table 54; even the design value 0.49 x VDD + 0.26 = 1.88 V is above 1.8 V), so the STM32 cannot read a guaranteed high. In the other direction a 3.3 V level on SCL/SDA/INT would exceed the sensor's 1.8 V I/O rating. The breakout therefore cannot be wired to the STM32 pins as it is.
        4. **Interface fix.** Put a level shifter between the two domains: a bidirectional I2C translator for SCL/SDA (e.g. PCA9306 or LSF0102, with pull-ups to 1.8 V on the sensor side and to 3.3 V on the MCU side, about 2.2 kΩ for 400 kHz) and a unidirectional channel for the interrupt line. Alternatives: power the whole STM32 from 1.8 V (its VDD range starts at 1.71 V) if nothing else on the board needs 3.3 V, or buy a 3.3 V version of the breakout.
        5. **I2C bus wiring.** Fast mode at 400 kHz: keep the bus short, use one pull-up pair per voltage side and configure PA15/PB7 as open-drain AF4 without the internal pull-ups.
        6. **Firmware plan.** Clock tree first (step 1), then GPIO/AF setup, I2C1 TIMINGR for 400 kHz written while PE = 0, the WKUP1/EXTI configuration for the sensor interrupt, and finally the LED and the debug UART.
