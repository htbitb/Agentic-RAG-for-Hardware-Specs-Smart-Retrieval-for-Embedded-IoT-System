    reference_calc: 'Thông tin ẩn: dung lượng pin = 400 mAh (pin ''vừa vỏ hộp'' của người dùng, không tra được; đề không nêu loại pin). Ngủ (3 V, 25 °C, typ): STM32 Standby + RTC LSE low drive 0,655 µA (DS12288 Table 32 p.104; Standby giữ BOR, Shutdown không có BOR — DS p.25), nRF52840 System OFF không giữ RAM 0,40 µA (PS p.76), LDO 1 µA ⇒ 2,055 µA. Trung bình: 8 mA × 2 s / 900 s = 17,78 µA + 2,055 × 898/900 = 2,05 µA ⇒ 19,83 µA. Tuổi thọ: 400 mAh / 0,01983 mA = 20173 h = 2,30 năm < 3 năm; cần 521 mAh, hoặc I_avg ≤ 400/26280 h = 15,22 µA ⇒ chu kỳ ≥ 16 mC/13,16 µA = 1215 s, hoặc pha hoạt động ≤ 1,48 s ở 8 mA. Đoán 2000 mAh ⇒ 11,5 năm, 1000 mAh ⇒ 5,8 năm (đều ''đạt'' sai và nằm ngoài [2,0; 2,6] năm); đoán 225 mAh ⇒ 1,3 năm (ngoài khoảng). Mức logic 3,0 V hai phía: STM32 VOH ≥ VDD−0,4 = 2,6 V (DS Table 55 p.130, VDD ≥ 2,7 V) > nRF VIH 0,7×3,0 = 2,1 V (PS p.370); nRF VOH ≥ 2,6 V > STM32 VIH 2,1 V (DS p.128) ⇒ nối thẳng.'
