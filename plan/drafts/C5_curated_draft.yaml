  turns:
  - user: Help me plan a battery-powered soil-moisture logger. An STM32G474 (VDD = 3.0 V from a low-dropout regulator whose quiescent current is 1 µA) wakes up every 15 minutes, switches on the moisture probe through a GPIO-controlled load switch, takes a reading and sends it over Bluetooth LE through an nRF52840 that shares the same 3.0 V rail (Normal Voltage mode) and talks to the STM32 over a UART at 115200 baud. One wake-up cycle lasts 2 s and the whole node then draws 8 mA on average (measured on our prototype). Between cycles the probe is switched off (0 µA), the nRF52840 sits in System OFF without RAM retention and is woken by a GPIO from the STM32, and the STM32 waits in its lowest-power mode that still keeps the RTC running from a 32.768 kHz LSE crystal and a brown-out reset active. The node runs from the battery that fits our enclosure and must last at least 3 years without a battery change. The plan must cover the pin allocation (UART, wake-up and load-switch control lines), the logic-level compatibility between the two chips, the STM32 low-power mode, a sleep-current table with the total, the average current over one cycle, the expected battery life, and what to change if the 3-year target is not met. Answer with a design plan of at least 5 numbered steps (no code is needed for this part of the project).
