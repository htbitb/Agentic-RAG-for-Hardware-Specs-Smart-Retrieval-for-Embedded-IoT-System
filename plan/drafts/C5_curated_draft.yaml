  - user: 'Help me design a sensor node end to end. An STM32G474 on our own PCB (VDD = 3.3 V) with a 16 MHz crystal on its HSE pins must run SYSCLK = HCLK = PCLK1 = PCLK2 = 170 MHz from the main PLL fed by HSE (within 0.1 %). It reads a humidity sensor whose I/O supply is 1.8 V over I2C3 in standard mode (100 kHz, controller, open-drain pins; choose the I2C3 pins yourself), and it exchanges data with an nRF52840 (QFN48 package, supplied from the same 3.3 V rail) over USART2 with TX on PA2 and RX on PA3 at 1 Mbaud (within ±2 %), 8 data bits, no parity, 1 stop bit, oversampling by 16, transmitter and receiver enabled. Sleep phase: the STM32 waits in a low-power mode with its RTC running from a 32.768 kHz LSE crystal (wake-up every 10 minutes), the nRF52840 is in System OFF without RAM retention, and the sensor sleeps at 1 µA; the sleep-current budget of the whole node is 10 µA. The plan must cover the clock tree with the PLL M/N/R values, the pin allocation, the logic-level compatibility of both links (with the datasheet thresholds), the STM32 low-power mode and a sleep-current table with the total. Write bare-metal C for the STM32G474 that accesses registers the CMSIS way (e.g. `TIM1->PSC = ...;`, `RCC->APB2ENR |= RCC_APB2ENR_TIM1EN;`) using the register and bit names of ST''s `stm32g4xx.h` device header. Do not use HAL or LL drivers, `SystemCoreClock` or any other library function; write clock frequencies as numeric constants. Do not use interrupts; busy-wait loops on status flags are fine. Initial state: the chip has just come out of reset: SYSCLK = HCLK = PCLK1 = PCLK2 = 16 MHz (HSI16), all prescalers are 1, no peripheral clock beyond the reset defaults is enabled, and all GPIO pins are in their reset state. Answer with a design plan of at least 5 numbered steps, then one complete C code block (`#include "stm32g4xx.h"`, then a `main()` that configures everything and finally loops forever with `while (1)`). The code only has to bring up the clock tree, I2C3 and USA