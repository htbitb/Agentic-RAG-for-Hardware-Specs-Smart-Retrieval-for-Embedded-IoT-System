    reference_solution:
      answer: |
        Thanks: the nRF52840 runs from the Li-ion cell on VDDH with REGOUT0 unprogrammed, which changes the interface design.

        1. **Clock tree (12 MHz HSE -> 170 MHz).** PLLSRC = HSE; PLLM = 3 gives 12 MHz / 3 = 4 MHz (PLL input 2.66-16 MHz), PLLN = 85 gives a 340 MHz VCO (96-344 MHz) and PLLR = 2 gives SYSCLK = 170 MHz (DS12288 Table 46, RM0440 7.4.4). Range 1 boost mode (clear PWR_CR5.R1MODE), LATENCY = 4 wait states (RM0440 Table 9) and the AHB /2 step during the switch; PCLK1 = PCLK2 = 170 MHz.
        2. **Pin allocation.** PB10 = USART3_TX (AF7) and PB11 = USART3_RX (AF7) (DS12288 Table 13); on the nRF52840 side the UARTE pins are freely assignable GPIOs; PF0/PF1 = OSC_IN/OSC_OUT for the 12 MHz crystal.
        3. **USART3 at 1 Mbaud.** The USART3 kernel clock is PCLK1 = 170 MHz with OVER8 = 0: BRR = 170000000 / 1000000 = 170 (exact, 0 % error).
        4. **I/O voltage of the nRF52840.** In High Voltage mode (supply on VDDH) the nRF52840 GPIO high level equals the REG0 output set by UICR.REGOUT0 (nRF52840 PS, GPIO levels), and an erased REGOUT0 (0xFFFFFFFF, VOUT = 7) selects the default 1.8 V. So the nRF52840 I/O runs at 1.8 V while the STM32 I/O runs at 3.3 V.
        5. **Logic-level check.** STM32 -> nRF52840: the STM32 drives up to 3.3 V, above the nRF52840 absolute maximum of VDD + 0.3 = 2.1 V on an I/O pin, which would damage it. nRF52840 -> STM32: the nRF52840 output high is at most 1.8 V, below the STM32 VIH of 0.7 x 3.3 = 2.31 V, so the STM32 would not read a reliable high. The link therefore needs a level shifter: a dual-supply translator (VCCA = 1.8 V from the nRF52840 VDD pin, VCCB = 3.3 V) rated for at least 1 Mbit/s on TX and RX.
        6. **Why not reprogram REGOUT0?** Setting REGOUT0 to 3.3 V (VOUT = 5) requires VDDH at least 0.3 V above VDD, i.e. VDDH >= 3.6 V (PS, REG0 stage), but the Li-ion cell falls to 3.0 V, so the nRF52840 rail would sag below 3.3 V late in the discharge while the STM32 still drives 3.3 V. Lower settings (e.g. 2.7 V) keep the headroom but still leave the 3.3 V STM32 output above VDD + 0.3 V. The translator is the robust choice.
        7. **Firmware.** The STM32 code below sets up the clock tree and USART3; the translator needs no firmware:

        ```c
        #include "stm32g4xx.h"

        int main(void)
        {
            /* Range 1 boost mode (SYSCLK > 150 MHz) and 4 Flash wait states before raising the clock */
            RCC->APB1ENR1 |= RCC_APB1ENR1_PWREN;
            (void)RCC->APB1ENR1;
            PWR->CR5 &= ~PWR_CR5_R1MODE;
            FLASH->ACR = (FLASH->ACR & ~FLASH_ACR_LATENCY) | FLASH_ACR_LATENCY_4WS;

            /* HSE crystal */
            RCC->CR |= RCC_CR_HSEON;
            while (!(RCC->CR & RCC_CR_HSERDY)) { }

            /* 12 MHz / 3 = 4 MHz, x 85 = 340 MHz VCO, / 2 = 170 MHz */
            RCC->PLLCFGR = RCC_PLLCFGR_PLLSRC_HSE | (2U << RCC_PLLCFGR_PLLM_Pos) | (85U << RCC_PLLCFGR_PLLN_Pos) | RCC_PLLCFGR_PLLREN;
            RCC->CR |= RCC_CR_PLLON;
            while (!(RCC->CR & RCC_CR_PLLRDY)) { }

            /* switch through AHB / 2, back to / 1 after at least 1 us */
            RCC->CFGR = (RCC->CFGR & ~RCC_CFGR_HPRE) | RCC_CFGR_HPRE_DIV2;
            RCC->CFGR = (RCC->CFGR & ~RCC_CFGR_SW) | RCC_CFGR_SW_PLL;
            while ((RCC->CFGR & RCC_CFGR_SWS) != RCC_CFGR_SWS_PLL) { }
            for (volatile int i = 0; i < 200; i++) { }
            RCC->CFGR = (RCC->CFGR & ~RCC_CFGR_HPRE) | RCC_CFGR_HPRE_DIV1;

            /* peripheral clocks */
            RCC->AHB2ENR |= RCC_AHB2ENR_GPIOBEN;
            RCC->APB1ENR1 |= RCC_APB1ENR1_USART3EN;

            /* PB10 = USART3_TX, PB11 = USART3_RX (AF7) */
            GPIOB->MODER = (GPIOB->MODER & ~(GPIO_MODER_MODE10 | GPIO_MODER_MODE11)) | GPIO_MODER_MODE10_1 | GPIO_MODER_MODE11_1;
            GPIOB->AFR[1] = (GPIOB->AFR[1] & ~(GPIO_AFRH_AFSEL10 | GPIO_AFRH_AFSEL11)) | (7U << GPIO_AFRH_AFSEL10_Pos) | (7U << GPIO_AFRH_AFSEL11_Pos);

            /* USART3: 1 Mbaud 8N1 from PCLK1 = 170 MHz (written while UE = 0) */
            USART3->BRR = 170;
            USART3->CR1 = USART_CR1_UE | USART_CR1_TE | USART_CR1_RE;

            while (1) { }
        }
        ```
