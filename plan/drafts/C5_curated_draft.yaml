    reference_solution:
      answer: |
        Here is the design.

        1. **Clock tree (25 MHz HSE -> 150 MHz, Range 1 normal mode).** PLLSRC = HSE; PLLM = 5 gives 25 MHz / 5 = 5 MHz (PLL input 2.66-16 MHz), PLLN = 60 gives a 300 MHz VCO (96-344 MHz) and PLLR = 2 gives SYSCLK = 150 MHz (DS12288 Table 46). 150 MHz is allowed in Range 1 normal mode, so R1MODE keeps its reset value 1, and the Flash needs LATENCY = 4 wait states (RM0440 Table 9). Because HCLK ends up above 80 MHz, the switch to the PLL still goes through the AHB /2 transition state for at least 1 µs before HPRE returns to /1 (RM0440 7.2.7). PCLK1 = PCLK2 = 150 MHz.
        2. **Pin allocation.** PA6 = TIM3_CH1 (AF2) to the buzzer driver; PB10 = USART3_TX (AF7) and PB11 = USART3_RX (AF7) to the nRF52840; PF0/PF1 = OSC_IN/OSC_OUT for the 25 MHz crystal.
        3. **Buzzer PWM at 4 kHz, 50 %.** TIM3 is on APB1 (prescaler 1), so TIM3CLK = 150 MHz and 150 MHz / 4 kHz = 37500 ticks, which fits the 16-bit counter: PSC = 0, ARR = 37499, CCR1 = 18750.
        4. **USART3 at 460800 baud.** PCLK1 = 150 MHz, OVER8 = 0: BRR = 150000000 / 460800 = 325.5, rounded to 326, i.e. 460123 baud (-0.15 %).
        5. **nRF52840 I/O level.** In High Voltage mode the nRF52840 GPIO level equals the REG0 output set by UICR.REGOUT0 (nRF52840 PS); REGOUT0 = 3.3 V (VOUT = 5) is valid here because REG0 needs VDDH at least 0.3 V above VDD and the 4.0 V rail leaves 0.7 V of headroom. The nRF52840 I/O therefore runs at 3.3 V, the same as the STM32.
        6. **Logic-level check.** STM32 VOH >= 2.9 V > nRF52840 VIH = 0.7 x 3.3 = 2.31 V; nRF52840 VOH >= VDD - 0.4 = 2.9 V > STM32 VIH = 2.31 V; VOL 0.4 V < VIL 0.99 V on both sides; and the 3.3 V STM32 output stays below the nRF52840 limit of VDD + 0.3 = 3.6 V. The levels are compatible, so the UART is wired directly with no level shifter. The production script must program REGOUT0 before the STM32 starts driving the UART, otherwise a blank nRF52840 runs at the 1.8 V default. Corner case: REG0 has a -10/+5 % output tolerance (nRF52840 PS), so in the worst case the nRF52840 VDD is 2.97 V and its pin limit 3.27 V, about 30 mV below a full 3.3 V STM32 high; a 100-330 Ω series resistor on the STM32 TX line covers that corner.
        7. **Firmware.** The program below configures the clock tree, the buzzer PWM and USART3 from reset:

        ```c
        #include "stm32g4xx.h"

        int main(void)
        {
            /* Range 1 normal mode is the reset state (R1MODE = 1); 150 MHz needs 4 Flash wait states */
            FLASH->ACR = (FLASH->ACR & ~FLASH_ACR_LATENCY) | FLASH_ACR_LATENCY_4WS;

            /* HSE crystal */
            RCC->CR |= RCC_CR_HSEON;
            while (!(RCC->CR & RCC_CR_HSERDY)) { }

            /* 25 MHz / 5 = 5 MHz, x 60 = 300 MHz VCO, / 2 = 150 MHz */
            RCC->PLLCFGR = RCC_PLLCFGR_PLLSRC_HSE | (4U << RCC_PLLCFGR_PLLM_Pos) | (60U << RCC_PLLCFGR_PLLN_Pos) | RCC_PLLCFGR_PLLREN;
            RCC->CR |= RCC_CR_PLLON;
            while (!(RCC->CR & RCC_CR_PLLRDY)) { }

            /* HCLK > 80 MHz: switch through the AHB / 2 transition state, back to / 1 after at least 1 us */
            RCC->CFGR = (RCC->CFGR & ~RCC_CFGR_HPRE) | RCC_CFGR_HPRE_DIV2;
            RCC->CFGR = (RCC->CFGR & ~RCC_CFGR_SW) | RCC_CFGR_SW_PLL;
            while ((RCC->CFGR & RCC_CFGR_SWS) != RCC_CFGR_SWS_PLL) { }
            for (volatile int i = 0; i < 200; i++) { }
            RCC->CFGR = (RCC->CFGR & ~RCC_CFGR_HPRE) | RCC_CFGR_HPRE_DIV1;

            /* peripheral clocks */
            RCC->AHB2ENR |= RCC_AHB2ENR_GPIOAEN | RCC_AHB2ENR_GPIOBEN;
            RCC->APB1ENR1 |= RCC_APB1ENR1_TIM3EN | RCC_APB1ENR1_USART3EN;

            /* PA6 = TIM3_CH1 (AF2) */
            GPIOA->MODER = (GPIOA->MODER & ~GPIO_MODER_MODE6) | GPIO_MODER_MODE6_1;
            GPIOA->AFR[0] = (GPIOA->AFR[0] & ~GPIO_AFRL_AFSEL6) | (2U << GPIO_AFRL_AFSEL6_Pos);

            /* PB10 = USART3_TX, PB11 = USART3_RX (AF7) */
            GPIOB->MODER = (GPIOB->MODER & ~(GPIO_MODER_MODE10 | GPIO_MODER_MODE11)) | GPIO_MODER_MODE10_1 | GPIO_MODER_MODE11_1;
            GPIOB->AFR[1] = (GPIOB->AFR[1] & ~(GPIO_AFRH_AFSEL10 | GPIO_AFRH_AFSEL11)) | (7U << GPIO_AFRH_AFSEL10_Pos) | (7U << GPIO_AFRH_AFSEL11_Pos);

            /* TIM3 CH1: 150 MHz / 37500 = 4 kHz, 50 % duty */
            TIM3->PSC = 0;
            TIM3->ARR = 37499;
            TIM3->CCR1 = 18750;
            TIM3->CCMR1 = (TIM3->CCMR1 & ~TIM_CCMR1_OC1M) | (6U << TIM_CCMR1_OC1M_Pos) | TIM_CCMR1_OC1PE;
            TIM3->CCER |= TIM_CCER_CC1E;
            TIM3->CR1 |= TIM_CR1_ARPE;
            TIM3->EGR = TIM_EGR_UG;
            TIM3->CR1 |= TIM_CR1_CEN;

            /* USART3: 460800 baud 8N1 from PCLK1 = 150 MHz (written while UE = 0) */
            USART3->BRR = 326;
            USART3->CR1 = USART_CR1_UE | USART_CR1_TE | USART_CR1_RE;

            while (1) { }
        }
        ```
