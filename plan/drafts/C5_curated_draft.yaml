        1. **Clock tree (16 MHz HSE -> 170 MHz).** PLLSRC = HSE; PLLM = 4 gives 16 MHz / 4 = 4 MHz (PLL input 2.66-16 MHz), PLLN = 85 gives a 340 MHz VCO (96-344 MHz) and PLLR = 2 gives SYSCLK = 170 MHz (DS12288 Table 46). Range 1 boost mode (clear PWR_CR5.R1MODE), LATENCY = 4 wait states (RM0440 Table 9) and the AHB /2 step during the switch; PCLK1 = PCLK2 = 170 MHz.
        2. **Pin allocation.** USART2: PA2 = TX and PA3 = RX (AF7) as specified. I2C3: PC8 = I2C3_SCL (AF8) and PC9 = I2C3_SDA (AF8), open-drain (PA8 also carries I2C3_SCL but stays free). PF0/PF1 = OSC_IN/OSC_OUT for the 16 MHz crystal, PC14/PC15 = OSC32_IN/OSC32_OUT for the LSE crystal.
        3. **Peripheral timing.** USART2 at 1 Mbaud from PCLK1 = 170 MHz with OVER8 = 0: BRR = 170 (exact). I2C3 at 100 kHz from fI2CCLK = 170 MHz: PRESC = 15, SCLL = 59, SCLH = 45, SCLDEL = 13, SDADEL = 3 (tLOW about 5.6 µs and tHIGH about 4.3 µs, above the standard-mode minimums).
        4. **Humidity-sensor interface (1.8 V).** The humidity sensor's high level is at most 1.8 V, below the STM32 VIH minimum of 0.7 x 3.3 = 2.31 V (DS12288 Table 54), and a 3.3 V level from the STM32 side would exceed its 1.8 V I/O rating, so I fit a bidirectional I2C level shifter (e.g. PCA9306) between PC8/PC9 and the sensor, with pull-ups to 1.8 V on the sensor side and to 3.3 V on the MCU side.
        5. **nRF52840 interface (3.3 V).** The QFN48 nRF52840 has VDD and VDDH shorted inside the package, so it runs in Normal Voltage mode and its GPIO high level equals its 3.3 V VDD. nRF52840 VIH = 0.7 x 3.3 = 2.31 V is below the STM32 VOH (>= 2.9 V); the STM32 VIH of 2.31 V is below the nRF52840 VOH (>= VDD - 0.4 = 2.9 V); VOL 0.4 V is below both VIL limits (0.99 V); and the 3.3 V STM32 high level stays below the nRF52840 limit of VDD + 0.3 = 3.6 V. The UART levels are compatible, so TX/RX are wired directly with a common ground.
        6. **Sleep mode and budget (10 µA).** Stop 1 alone draws 80.5 µA typical (DS12288 Table 30), so the STM32 uses Standby with the RTC on the LSE and a 600 s wake-up timer.
           - STM32G474, Standby + RTC (LSE): 0.655 µA
           - nRF52840, System OFF without RAM retention: 0.40 µA (nRF52840 PS)
           - Humidity sensor, sleep: 1 µA

