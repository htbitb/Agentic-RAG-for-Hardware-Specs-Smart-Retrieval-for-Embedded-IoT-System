  - user: Help me plan an environmental-monitoring node. An STM32G474 on our own PCB (VDD = 3.3 V from an LDO with 1 µA quiescent current, a 12 MHz crystal on its HSE pins and a 32.768 kHz LSE crystal) must run SYSCLK at 160 MHz from the main PLL fed by HSE. It reads a gas sensor whose I/O supply is 1.8 V over I2C1 (400 kHz) and reports every 30 minutes over Wi-Fi through an ESP32 module (3.3 V I/O) on USART1 at 115200 baud. Between reports the sensor sleeps at 1.5 µA, the STM32 waits for its RTC wake-up, and the sleep-current budget of the whole node is 8 µA. The plan must cover the clock tree with the PLL M/N/R values, the voltage-scaling mode and the Flash wait states, the pin allocation (I2C1, USART1 and any control lines you need), the logic-level compatibility of both links (with the datasheet thresholds), the low-power state of the STM32 and of the ESP32, and a sleep-current table with the total compared to the budget. Answer with a design plan of at least 5 numbered steps (no code is needed for this part of the project).
