    reference_solution:
      answer: |
        Thanks: the HSE crystal is 25 MHz and the night budget is 5 µA for the whole node.

        1. **Clock tree (25 MHz HSE -> 150 MHz, Range 1 normal mode).** PLLSRC = HSE; PLLM = 5 gives 25 MHz / 5 = 5 MHz (PLL input 2.66-16 MHz), PLLN = 60 gives a 300 MHz VCO (96-344 MHz) and PLLR = 2 gives SYSCLK = 150 MHz (DS12288 Table 46). R1MODE stays 1 (Range 1 normal mode is enough up to 150 MHz) and the Flash needs LATENCY = 4 wait states (RM0440 Table 9).
        2. **Pin allocation.** PA2 = USART2_TX (AF7) to the ESP32 RX and PA3 = USART2_RX (AF7) from the ESP32 TX; PB0 (push-pull output) drives the ESP32 CHIP_PU (enable) pin, with a 10 kΩ pull-down that keeps the ESP32 off while the STM32 sleeps; PB1/PB2 drive the latching-valve driver (open/close pulses); PF0/PF1 = OSC_IN/OSC_OUT for the 25 MHz crystal; PC14/PC15 = OSC32_IN/OSC32_OUT for the LSE.
        3. **Logic levels of the ESP32 link.** Both sides run at 3.3 V: STM32 VOH >= VDD - 0.4 = 2.9 V > ESP32 VIH = 0.75 x 3.3 = 2.48 V, ESP32 VOH >= 0.8 x 3.3 = 2.64 V > STM32 VIH = 0.7 x 3.3 = 2.31 V, and both VOL limits (0.4 V, 0.33 V) are below the VIL limits (0.83 V, 0.99 V). The levels are compatible: TX/RX are wired directly with a common ground.
        4. **Low-power states.** ESP32 Deep-sleep (10 µA with RTC timer + RTC memory) or even Hibernation (5 µA) alone would use up the whole 5 µA budget, so the ESP32 is switched fully off between reports by holding CHIP_PU low (Power off: 1 µA, ESP32 datasheet Table 4-2) and re-booted every hour. The STM32 uses Standby mode with the RTC on the LSE and the RTC wake-up timer set to 3600 s: 0.655 µA typical at 3 V (DS12288 Table 32); Stop 1 (80.5 µA) is far above the budget.
        5. **Sleep-current table (typical, 3 V, 25 °C).**
           - STM32G474, Standby + RTC (LSE): 0.655 µA
           - ESP32, power off (CHIP_PU low): 1 µA
           - Soil sensor, idle: 0.6 µA
           - Buck regulator quiescent current: 1 µA
           - Latching valve, idle: 0 µA

           Total sleep current = 0.655 + 1 + 0.6 + 1 = 3.26 µA, inside the 5 µA budget with about 1.7 µA of margin.
        6. **Wake-up sequence.** RTC wake-up -> run the clock setup again (Standby loses it) -> read the sensor -> pulse the valve -> raise CHIP_PU, let the ESP32 boot and report over USART2 -> drop CHIP_PU -> back to Standby.
    wrong_variants:
    - name: guessed_50ua_budget
      answer: |
        Thanks: the HSE crystal is 25 MHz; I assume the usual 50 µA night budget.

        1. **Clock tree (25 MHz HSE -> 150 MHz, Range 1 normal mode).** PLLSRC = HSE; PLLM = 5 gives 25 MHz / 5 = 5 MHz (PLL input 2.66-16 MHz), PLLN = 60 gives a 300 MHz VCO (96-344 MHz) and PLLR = 2 gives SYSCLK = 150 MHz (DS12288 Table 46). R1MODE stays 1 (Range 1 normal mode is enough up to 150 MHz) and the Flash needs LATENCY = 4 wait states (RM0440 Table 9).
        2. **Pin allocation.** PA2 = USART2_TX (AF7) to the ESP32 RX and PA3 = USART2_RX (AF7) from the ESP32 TX; PB1/PB2 drive the latching-valve driver (open/close pulses); PF0/PF1 = OSC_IN/OSC_OUT for the 25 MHz crystal; PC14/PC15 = OSC32_IN/OSC32_OUT for the LSE.
        3. **Logic levels of the ESP32 link.** Both sides run at 3.3 V: STM32 VOH >= VDD - 0.4 = 2.9 V > ESP32 VIH = 0.75 x 3.3 = 2.48 V, ESP32 VOH >= 0.8 x 3.3 = 2.64 V > STM32 VIH = 0.7 x 3.3 = 2.31 V, and both VOL limits (0.4 V, 0.33 V) are below the VIL limits (0.83 V, 0.99 V). The levels are compatible: TX/RX are wired directly with a common ground.
        4. **Low-power states.** The ESP32 waits in Deep-sleep with the RTC timer and RTC memory on (10 µA, ESP32 datasheet Table 4-2) and keeps its Wi-Fi credentials, and the STM32 uses Standby mode with the RTC on the LSE and the RTC wake-up timer set to 3600 s: 0.655 µA typical at 3 V (DS12288 Table 32).
        5. **Sleep-current table (typical, 3 V, 25 °C).**
           - STM32G474, Standby + RTC (LSE): 0.655 µA
           - ESP32, Deep-sleep (RTC timer + RTC memory): 10 µA
           - Soil sensor, idle: 0.6 µA
           - Buck regulator quiescent current: 1 µA
           - Latching valve, idle: 0 µA

           Total sleep current = 0.655 + 10 + 0.6 + 1 = 12.26 µA, inside the 50 µA budget.
        6. **Wake-up sequence.** RTC wake-up -> run the clock setup again (Standby loses it) -> read the sensor -> pulse the valve -> wake the ESP32 and report over USART2 -> send the ESP32 back to Deep-sleep -> back to Standby.
