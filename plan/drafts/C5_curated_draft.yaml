  turns:
  - user: Help me plan an irrigation-valve controller. An STM32G474 on our own PCB (VDD = 3.3 V from a buck regulator with 1 µA quiescent current) keeps the schedule; it has a crystal on its HSE pins for accurate timing and must run SYSCLK at 150 MHz from the main PLL fed by HSE in voltage Range 1 normal mode, plus a 32.768 kHz LSE crystal for the RTC. Once per hour it wakes up, reads a soil sensor (0.6 µA when idle), opens or closes a latching valve (0 µA when idle) and reports over Wi-Fi through an ESP32 module (3.3 V I/O) connected to USART2 at 115200 baud. At night everything sleeps between the hourly wake-ups, and the whole node must stay within the sleep-current budget that our system designer fixed for the night phase. The plan must cover the clock tree with the PLL M/N/R values and the Flash wait states, the pin allocation (USART2 to the ESP32 and any control lines you need), the logic-level compatibility of the ESP32 link, the low-power state of the STM32 and of the ESP32, and a sleep-current table with the total compared to the budget. Answer with a design plan of at least 5 numbered steps (no code is needed for this part of the project).
