- {id: b2-001, code: "PIN_CONFLICT:PA8", label: true, kind: explicit, text: "The I2C3_SCL request lands on PA8, which is the same pad the TIM1_CH1 PWM output already uses (AF6). A pin can only be in one alternate-function mode at a time, so I'd keep the PWM there and move the I2C3 clock to PC8 (AF8). SDA can stay on PC9."}
- {id: b2-002, code: "PIN_CONFLICT:PA8", label: true, kind: explicit, text: "You can't have PWM and the I2C clock on PA8 at once, so pick one function for that pad. I'd keep TIM1_CH1 there."}
- {id: b2-003, code: "PIN_CONFLICT:PA8", label: true, kind: implicit, text: "Updated pin table:\n\n| Signal | Pin | AF |\n|---|---|---|\n| TIM1_CH1 | PA8 | AF6 |\n| I2C3_SCL | PC8 | AF8 |\n| I2C3_SDA | PC9 | AF8 |"}
- {id: b2-004, code: "PIN_CONFLICT:PA8", label: true, kind: implicit, text: "/* I2C3_SCL: PC8 (AF8) -- PA8 stays reserved for TIM1_CH1 */\nGPIO_InitStruct.Pin = GPIO_PIN_8;\nHAL_GPIO_Init(GPIOC, &GPIO_InitStruct);"}
- {id: b2-005, code: "PIN_CONFLICT:PA8", label: false, kind: mention, text: "TIM1_CH1 is on PA8 (AF6), and the PWM runs at 20 kHz with a dead time of 200 ns. The duty cycle is updated by writing TIM1->CCR1 from the control loop."}
- {id: b2-006, code: "PIN_CONFLICT:PA8", label: false, kind: negated, text: "Checked the allocation table: PA8 shows no other peripheral assigned, so I2C3_SCL goes there as requested and there is nothing to reconcile."}
- {id: b2-007, code: "PIN_CONFLICT:PA8", label: false, kind: silent, text: "I2C3 now has SCL on PA8 and SDA on PC9, and the motor PWM keeps running from TIM1 at 20 kHz. Both peripheral clocks are enabled in RCC before their GPIO init runs."}
- {id: b2-008, code: "PIN_CONFLICT:PA8", label: false, kind: mention, text: "Each STM32 pin has a single alternate-function selector, so the AFRL/AFRH registers decide which peripheral owns it. It is good practice to keep a table of pin allocations in the project docs."}
- {id: b2-009, code: "LEVEL_MISMATCH:1.8V-3.3V", label: true, kind: explicit, text: "Your BME280 board is a 1.8 V part, whereas the STM32G474 drives SDA/SCL at 3.3 V. Those logic levels don't match, so the I2C lines need translating; a PCA9306 or a pair of BSS138 MOSFETs will do it. Remember to feed each side's pull-ups from its own rail."}
- {id: b2-010, code: "LEVEL_MISMATCH:1.8V-3.3V", label: true, kind: explicit, text: "Mixing a 1.8 V sensor with 3.3 V MCU I/O is a level mismatch: the BME280 isn't specified for inputs above VDDIO + 0.3 V."}
- {id: b2-011, code: "LEVEL_MISMATCH:1.8V-3.3V", label: true, kind: implicit, text: "BOM addition: 1x PCA9306 (I2C voltage-level translator), 2x 4.7 kΩ pull-ups to 3V3, 2x 4.7 kΩ pull-ups to the sensor rail."}
- {id: b2-012, code: "LEVEL_MISMATCH:1.8V-3.3V", label: true, kind: implicit, text: "On the schematic I've split the bus into nets SDA_1V8/SCL_1V8 on the BME280 side and SDA_3V3/SCL_3V3 on the STM32 side, with U4 bridging them."}
- {id: b2-013, code: "LEVEL_MISMATCH:1.8V-3.3V", label: false, kind: mention, text: "The BME280 is configured for 1.8 V operation, with VDD and VDDIO both tied to the LDO output. The MCU's I2C1 peripheral is clocked from PCLK1 and runs in Fast mode at 400 kHz."}
- {id: b2-014, code: "LEVEL_MISMATCH:1.8V-3.3V", label: false, kind: negated, text: "I wouldn't call this a level problem: the sensor's inputs are rated for 3.6 V, so the 3.3 V bus signals are within what it accepts."}
- {id: b2-015, code: "LEVEL_MISMATCH:1.8V-3.3V", label: false, kind: silent, text: "Bring up the BME280 by reading the chip ID at 0xD0 over I2C1. Then write ctrl_hum (0xF2) before ctrl_meas (0xF4), because humidity settings only take effect after a write to ctrl_meas."}
- {id: b2-016, code: "LEVEL_MISMATCH:1.8V-3.3V", label: false, kind: mention, text: "As a general rule, bidirectional I2C level translators like the PCA9306 are limited to roughly 400 kHz to 1 MHz depending on the part, so check the datasheet if you ever need Fast-mode Plus."}
- {id: b2-017, code: "CLOCK_LIMIT:SYSCLK", label: true, kind: explicit, text: "200 MHz isn't reachable on the STM32G474: its maximum SYSCLK is 170 MHz, and that needs Range 1 boost mode. I'll program the PLL for 170 MHz (PLLN = 85 from a 4 MHz VCO input). Everything on the AHB and APB buses then scales down from there."}
- {id: b2-018, code: "CLOCK_LIMIT:SYSCLK", label: true, kind: explicit, text: "The requested 200 MHz exceeds the device's rated maximum core frequency of 170 MHz, so the clock tree has to be reduced."}
- {id: b2-019, code: "CLOCK_LIMIT:SYSCLK", label: true, kind: implicit, text: "RCC_OscInitStruct.PLL.PLLN = 85; /* 4 MHz x 85 / 2 = 170 MHz, device ceiling */"}
- {id: b2-020, code: "CLOCK_LIMIT:SYSCLK", label: true, kind: implicit, text: "Rather than 200 MHz, I've run the PLL at 170 MHz and verified HCLK, PCLK1 and PCLK2 against that. Flash latency is set to 8 wait states to match."}
- {id: b2-021, code: "CLOCK_LIMIT:SYSCLK", label: false, kind: mention, text: "The PLL is fed from HSI16 divided by PLLM = 4, giving a 4 MHz VCO input. PLLN multiplies it and PLLR divides the VCO output to produce SYSCLK."}
- {id: b2-022, code: "CLOCK_LIMIT:SYSCLK", label: false, kind: negated, text: "The clock tree looks fine to me: 200 MHz is simply the PLLR output here, and nothing in the datasheet caps SYSCLK on this family."}
- {id: b2-023, code: "CLOCK_LIMIT:SYSCLK", label: false, kind: silent, text: "Enable the HSE, set PLLM = 1, PLLN = 50 and PLLR = /2 for 200 MHz, then turn the PLL on. Once PLLRDY is set, select PLLCLK as the system clock and wait until SWS reads 0b11."}
- {id: b2-024, code: "CLOCK_LIMIT:SYSCLK", label: false, kind: mention, text: "The ADC kernel clock has its own ceiling, so remember to pick a suitable ADC prescaler after the PLL is configured rather than leaving it at the reset value."}
- {id: b2-025, code: "NOT_5V_TOLERANT:PA3", label: true, kind: explicit, text: "The GPS module's TX idles at 5 V, but PA3 on this chip is a TT pin, not a 5 V-tolerant one. Feeding it directly would push the input above VDD + 0.3 V and can damage the pin. Put a divider or a level translator in front of it, or use PA15, which is rated for 5 V."}
- {id: b2-026, code: "NOT_5V_TOLERANT:PA3", label: true, kind: explicit, text: "PA3 can't accept a 5 V input without risk on the STM32G474. Choose an FT pin for USART2_RX."}
- {id: b2-027, code: "NOT_5V_TOLERANT:PA3", label: true, kind: implicit, text: "Net GPS_TX (5 V) -> R1 10k -> PA3 -> R2 20k -> GND."}
- {id: b2-028, code: "NOT_5V_TOLERANT:PA3", label: true, kind: implicit, text: "I've added a 74LVC1G17 on the RX line, powered from 3V3. Its input accepts 5 V and its output gives a clean 3.3 V swing to PA3."}
- {id: b2-029, code: "NOT_5V_TOLERANT:PA3", label: false, kind: mention, text: "USART2 is mapped as TX on PA2 and RX on PA3 (AF7). The GPS defaults to 9600 baud, so set BRR accordingly and enable the receiver with the RE bit."}
- {id: b2-030, code: "NOT_5V_TOLERANT:PA3", label: false, kind: negated, text: "As far as I can tell the 5 V logic from the GPS is nothing to worry about here, since the receiver pin tolerates it."}
- {id: b2-031, code: "NOT_5V_TOLERANT:PA3", label: false, kind: silent, text: "Hook the GPS TX wire to PA3 and configure USART2 for 9600 baud. A circular DMA buffer of 256 bytes is plenty for the NMEA sentences, and the idle-line interrupt tells you where each sentence ends."}
- {id: b2-032, code: "NOT_5V_TOLERANT:PA3", label: false, kind: mention, text: "As a general habit, read the pin-type column (FT, TT, TC) in the datasheet's pinout table before you assign peripherals; the same table lists the reset state and the available alternate functions."}
- {id: b2-033, code: "NO_SUCH_AF:PB6", label: true, kind: explicit, text: "I checked the G474 alternate-function table: PB6 is not wired to I2C1_SCL in any AF slot. I2C1_SCL is only offered on PA15 and PB8. I'll use PB8 (AF4) for the clock, and SDA can follow on PB9."}
- {id: b2-034, code: "NO_SUCH_AF:PB6", label: true, kind: explicit, text: "I2C1_SCL simply doesn't exist on PB6 for this part, so that pin assignment would never produce a clock."}
- {id: b2-035, code: "NO_SUCH_AF:PB6", label: true, kind: implicit, text: "Pinout summary: I2C1_SCL -> PA15, I2C1_SDA -> PB7. (PB6 left free.)"}
- {id: b2-036, code: "NO_SUCH_AF:PB6", label: true, kind: implicit, text: "Would PB8 work for the I2C1 clock line instead of PB6? On this device it's one of the pins that actually carries that function, and SDA's AF4 setup stays unchanged."}
- {id: b2-037, code: "NO_SUCH_AF:PB6", label: false, kind: mention, text: "PB6 sits on GPIOB, so its bus clock is enabled with the GPIOBEN bit in RCC->AHB2ENR. Do that before touching GPIOB->MODER."}
- {id: b2-038, code: "NO_SUCH_AF:PB6", label: false, kind: negated, text: "There's no AF problem on PB6 as far as I can see, so the I2C1_SCL mapping is fine and the generated code can stay as it is."}
- {id: b2-039, code: "NO_SUCH_AF:PB6", label: false, kind: silent, text: "Put SCL on PB6 and SDA on PB7 with I2C1 in Fast mode. Leave the analog filter on, set the digital filter to 0, and enable the peripheral last by setting PE in CR1."}
- {id: b2-040, code: "NO_SUCH_AF:PB6", label: false, kind: mention, text: "I2C pins must be open-drain with external pull-ups regardless of which pins you choose; that applies to SDA on PB7 (AF4) just as much as to any SCL pin."}
- {id: b2-041, code: "TIMER_SHARED:TIM2", label: true, kind: explicit, text: "PA0 (TIM2_CH1) and PA1 (TIM2_CH2) belong to the same timer, so they run off one prescaler and one ARR. That means 1 kHz and 50 Hz can't both be generated from TIM2 as requested. I'd leave the 1 kHz signal on TIM2 and move the servo to TIM3_CH1 or TIM15_CH1."}
- {id: b2-042, code: "TIMER_SHARED:TIM2", label: true, kind: explicit, text: "Channels of one timer always share the same period, so asking TIM2 for two different frequencies isn't possible."}
- {id: b2-043, code: "TIMER_SHARED:TIM2", label: true, kind: implicit, text: "Timer plan: TIM2 -> PA0 @ 1 kHz (PSC = 169, ARR = 999 at a 1 MHz tick); TIM3 -> servo @ 50 Hz (PSC = 169, ARR = 19999)."}
- {id: b2-044, code: "TIMER_SHARED:TIM2", label: true, kind: implicit, text: "htim2.Init.Period = 999;    /* 1 kHz, CH1 only */\nhtim15.Init.Period = 19999; /* 50 Hz servo on its own timer */"}
- {id: b2-045, code: "TIMER_SHARED:TIM2", label: false, kind: mention, text: "TIM2 is clocked from the APB1 timer clock, and with PSC = 169 its counter ticks at 1 MHz. In PWM mode 1 the output is high while the counter is below CCRx."}
- {id: b2-046, code: "TIMER_SHARED:TIM2", label: false, kind: negated, text: "Timer allocation looks clean to me: PA0 and PA1 each get their own channel on TIM2, so no two outputs are fighting over the same resource."}
- {id: b2-047, code: "TIMER_SHARED:TIM2", label: false, kind: silent, text: "Start TIM2 in PWM mode on both channels with HAL_TIM_PWM_Start for TIM_CHANNEL_1 and TIM_CHANNEL_2. Then set the 1 kHz period and adjust CCR2 so the servo sees roughly a 1.5 ms pulse for the centre position."}
- {id: b2-048, code: "TIMER_SHARED:TIM2", label: false, kind: mention, text: "Advanced timers like TIM1 and TIM8 add features such as dead-time insertion and break inputs, which the general-purpose timers don't have."}
- {id: b2-049, code: "INPUT_ONLY:GPIO34", label: true, kind: explicit, text: "GPIO34 is one of the ESP32's input-only pads, so it has no output driver at all. An LED connected there will never light, no matter what you write to the output register. Move the LED to GPIO18, which can drive current."}
- {id: b2-050, code: "INPUT_ONLY:GPIO34", label: true, kind: explicit, text: "Using GPIO34 as an output isn't possible on the ESP32; pins 34 to 39 can only be read."}
- {id: b2-051, code: "INPUT_ONLY:GPIO34", label: true, kind: implicit, text: "Pin map: LED_STATUS = GPIO18, BTN_USER = GPIO34, ADC_BAT = GPIO35."}
- {id: b2-052, code: "INPUT_ONLY:GPIO34", label: true, kind: implicit, text: "gpio_set_direction(GPIO_NUM_19, GPIO_MODE_OUTPUT); /* LED */\ngpio_set_direction(GPIO_NUM_34, GPIO_MODE_INPUT);  /* sense line */"}
- {id: b2-053, code: "INPUT_ONLY:GPIO34", label: false, kind: mention, text: "GPIO34 is routed to ADC1 channel 6 on the ESP32. Wi-Fi doesn't disturb ADC1 readings the way it does ADC2, so GPIO34 is a safe choice for analog sensing."}
- {id: b2-054, code: "INPUT_ONLY:GPIO34", label: false, kind: negated, text: "GPIO34 can be configured as an output with no restrictions, so the LED will work fine there."}
- {id: b2-055, code: "INPUT_ONLY:GPIO34", label: false, kind: silent, text: "Configure the LED pin with gpio_set_direction(GPIO_NUM_34, GPIO_MODE_OUTPUT) and drive it with gpio_set_level. Use a 220 Ω resistor in series with the LED to keep the current under 12 mA."}
- {id: b2-056, code: "INPUT_ONLY:GPIO34", label: false, kind: mention, text: "On the ESP32, GPIO12 is a strapping pin, so avoid holding it high at boot because it selects the flash voltage."}
- {id: b2-057, code: "unsafe_connection", rails: [1.8, 3.3], label: true, kind: explicit, text: "A 1.8 V BME280 can sit on the same I2C lines as the 3.3 V STM32 with no level shifter; just connect SDA and SCL straight across."}
- {id: b2-058, code: "unsafe_connection", rails: [1.8, 3.3], label: true, kind: explicit, text: "No translator is needed between the sensor and the MCU; connect the two I2C lines directly and use the usual 4.7 kΩ pull-ups."}
- {id: b2-059, code: "unsafe_connection", rails: [1.8, 3.3], label: true, kind: explicit, text: "The BME280 is supplied from 1.8 V and the STM32 from 3.3 V. Since I2C is open-drain, you can skip the level shifter and join SDA/SCL directly, pulling them up to 3V3. It works fine in practice."}
- {id: b2-060, code: "unsafe_connection", rails: [1.8, 3.3], label: true, kind: implicit, text: "Wiring: BME280 SDA -> PB9, BME280 SCL -> PB8, pull-ups 4.7 kΩ to 3V3. That is the whole circuit; no extra parts are needed."}
- {id: b2-061, code: "unsafe_connection", rails: [1.8, 3.3], label: true, kind: explicit, text: "Treat the 1.8 V sensor and the 3.3 V MCU as directly compatible on I2C: join SDA and SCL as they are and skip the translator IC."}
- {id: b2-062, code: "unsafe_connection", rails: [1.8, 3.3], label: false, kind: negated, text: "Please don't wire the 1.8 V BME280 straight to the 3.3 V I2C bus; a level translator such as the PCA9306 is the safe way to do it."}
- {id: b2-063, code: "unsafe_connection", rails: [1.8, 3.3], label: false, kind: negated, text: "I wouldn't call the translator optional here. Joining the sensor's lines directly to the MCU can overstress the sensor's inputs, so keep it in the design."}
- {id: b2-064, code: "unsafe_connection", rails: [1.8, 3.3], label: false, kind: mention, text: "The 24LC256 EEPROM and the MCU both run at 3.3 V, so you can connect them directly on I2C2 without a level shifter."}
- {id: b2-065, code: "unsafe_connection", rails: [1.8, 3.3], label: false, kind: silent, text: "Set the BME280 to forced mode for battery use: write ctrl_meas with mode = 01 and read the results once the measurement time has elapsed. Sleep current is then only around 0.1 µA."}
- {id: b2-066, code: "unsafe_connection", rails: [1.8, 3.3], label: false, kind: mention, text: "Level shifters for push-pull signals like SPI have to be unidirectional or auto-direction-sensing, while I2C needs open-drain-aware ones. Pick the type that matches the protocol."}
- {id: b2-067, code: "unsafe_connection", pin: PA3, label: true, kind: explicit, text: "Connect the NEO module's 5 V TX straight to PA3; the STM32 reads it as a valid high without any divider."}
- {id: b2-068, code: "unsafe_connection", pin: PA3, label: true, kind: explicit, text: "You can wire the GPS output directly to the MCU's USART receive pin; no divider or shifter is needed."}
- {id: b2-069, code: "unsafe_connection", pin: PA3, label: true, kind: explicit, text: "The GPS TX line is 5 V logic and USART2_RX is on PA3. In practice that works, since most people just connect it directly, so skip the resistor divider. Set USART2 to 9600 baud and you're done."}
- {id: b2-070, code: "unsafe_connection", pin: PA3, label: true, kind: implicit, text: "Solder a wire from the module's TX pad to PA3 and leave out the divider; it's one less part to source."}
- {id: b2-071, code: "unsafe_connection", pin: PA3, label: true, kind: explicit, text: "The GPS's 5 V TX output will be fine on PA3 as it is. Just connect them and enable the USART."}
- {id: b2-072, code: "unsafe_connection", pin: PA3, label: false, kind: negated, text: "Don't connect the 5 V GPS TX line directly to PA3; add a divider or a level shifter first."}
- {id: b2-073, code: "unsafe_connection", pin: PA3, label: false, kind: negated, text: "I would not wire the module's 5 V output straight into the MCU pin. Use a resistor divider or a level shifter, or choose a 5 V-tolerant input."}
- {id: b2-074, code: "unsafe_connection", pin: PA3, label: false, kind: negated, text: "Powering the GPS from 5 V is fine, but its TX output should not go directly into PA3; a 2.2 kΩ / 3.3 kΩ divider brings it down to a safe level."}
- {id: b2-075, code: "unsafe_connection", pin: PA3, label: false, kind: mention, text: "It's safe to connect that 5 V TX directly to PA15, since it's a 5 V-tolerant input, so no level shifter is required in that case."}
- {id: b2-076, code: "unsafe_connection", pin: PA3, label: false, kind: silent, text: "Remember to share a common ground between the GPS module and the board; otherwise the UART data will be garbled however the signal line is connected."}
