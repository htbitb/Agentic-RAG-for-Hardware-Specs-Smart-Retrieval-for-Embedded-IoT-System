- {id: bl-001, code: "PIN_CONFLICT:PA8", label: true, kind: explicit, text: "PA8 is already taken: it carries the TIM1_CH1 PWM output (AF6), so it can't also be I2C3_SCL (AF2). I'd put SCL on PC8 instead and keep the PWM where it is."}
- {id: bl-002, code: "PIN_CONFLICT:PA8", label: false, kind: negated, text: "I looked at PA8 for both functions and found no clash. The TIM1_CH1 PWM and I2C3_SCL can share that pin without any remapping, so nothing needs to change."}
- {id: bl-003, code: "PIN_CONFLICT:PA8", label: true, kind: implicit, text: "I2C3_SCL ends up on PC8 (AF8) in the generated pinout, and PA8 keeps driving the TIM1_CH1 PWM.\n\n```c\n/* PC8 = I2C3_SCL (AF8); PA8 stays TIM1_CH1 */\n```"}
- {id: bl-004, code: "PIN_CONFLICT:PA8", label: false, kind: mention, text: "PA8 can be configured as MCO, TIM1_CH1 or I2C3_SCL depending on the alternate function you select in GPIOA->AFR[1]. Out of reset the pin is in analog mode."}
- {id: bl-005, code: "PIN_CONFLICT:PA8", label: false, kind: silent, text: "Done. I2C3 is set up with SCL on PA8 and SDA on PC9 at 400 kHz with 4.7 kΩ pull-ups to 3V3, while TIM1 continues to run the 20 kHz PWM for the motor driver."}
- {id: bl-006, code: "PIN_CONFLICT:PA8", label: true, kind: explicit, text: "**Pin clash on PA8**\n- TIM1_CH1 (AF6) already owns the pin for the PWM output\n- I2C3_SCL would need the same pad as AF2\n\nOne pin can't carry both, so choose a different pin for the clock line."}
- {id: bl-007, code: "PIN_CONFLICT:PA8", label: true, kind: implicit, text: "Since the TIM1_CH1 PWM already occupies PA8, the I2C3 clock line has been placed on PC8 in this configuration."}
- {id: bl-008, code: "PIN_CONFLICT:PA8", label: false, kind: negated, text: "There isn't any pin claimed by two peripherals in this configuration, so I haven't changed any assignments. PA8 is TIM1_CH1 and that's it."}
- {id: bl-009, code: "LEVEL_MISMATCH:1.8V-3.3V", label: true, kind: explicit, text: "The BME280 runs at 1.8 V while the STM32 I/O is 3.3 V, so the two sides of the I2C bus sit at different logic levels. Put a bidirectional level shifter (for example a TXS0102 or a BSS138-based one) between SDA/SCL and the MCU."}
- {id: bl-010, code: "LEVEL_MISMATCH:1.8V-3.3V", label: true, kind: explicit, text: "**Voltage mismatch:** a 3.3 V pull-up on SDA/SCL exceeds the 1.8 V BME280's input rating (VDDIO + 0.3 V), so don't connect them directly. Either translate the levels or pull the bus up to 1.8 V."}
- {id: bl-011, code: "LEVEL_MISMATCH:1.8V-3.3V", label: true, kind: implicit, text: "I've placed a TXS0102 translator between the I2C1 pins and the BME280, with VCCA at 1.8 V and VCCB at 3V3, and each side gets its own 4.7 kΩ pull-ups."}
- {id: bl-012, code: "LEVEL_MISMATCH:1.8V-3.3V", label: true, kind: implicit, text: "Because the sensor and the microcontroller don't share the same logic supply, add an I2C-compatible level translator in line and pull SDA/SCL up to the respective rail on each side."}
- {id: bl-013, code: "LEVEL_MISMATCH:1.8V-3.3V", label: false, kind: mention, text: "The BME280 is supplied at 1.8 V and the STM32G474 at 3.3 V. The sensor answers at address 0x76 when SDO is tied to GND, or 0x77 when SDO is tied to VDDIO."}
- {id: bl-014, code: "LEVEL_MISMATCH:1.8V-3.3V", label: false, kind: negated, text: "There's no voltage-level problem on this bus: both the BME280 and the MCU are on 3V3, so SDA and SCL can simply be wired up."}
- {id: bl-015, code: "LEVEL_MISMATCH:1.8V-3.3V", label: false, kind: negated, text: "I don't see any level-compatibility issue between the 1.8 V BME280 and the 3.3 V STM32, so a translator isn't something you need to add."}
- {id: bl-016, code: "LEVEL_MISMATCH:1.8V-3.3V", label: false, kind: silent, text: "Wire the BME280's SDA to PB9 and SCL to PB8 on I2C1 (AF4), add 4.7 kΩ pull-ups to 3V3, and read the chip ID register 0xD0, which should return 0x60."}
- {id: bl-017, code: "CLOCK_LIMIT:SYSCLK", label: true, kind: explicit, text: "SYSCLK can't be 200 MHz on the STM32G474; the maximum is 170 MHz (Range 1 with boost mode). I'd configure the PLL for 170 MHz."}
- {id: bl-018, code: "CLOCK_LIMIT:SYSCLK", label: true, kind: explicit, text: "200 MHz is over the limit for this part. With an 8 MHz HSE you can reach the ceiling of 170 MHz using PLLM = 1, PLLN = 85, PLLR = /2.\n\n```c\n/* SYSCLK = 8 / 1 * 85 / 2 = 170 MHz (max) */\n```"}
- {id: bl-019, code: "CLOCK_LIMIT:SYSCLK", label: true, kind: implicit, text: "I've configured the PLL for 170 MHz (HSI16, PLLM = 4, PLLN = 85, PLLR = 2), which is the highest SYSCLK the G474 allows, and set the flash latency to 8 wait states."}
- {id: bl-020, code: "CLOCK_LIMIT:SYSCLK", label: true, kind: implicit, text: "I capped the core clock at 170 MHz in the clock tree, so the APB2 timers also run at 170 MHz."}
- {id: bl-021, code: "CLOCK_LIMIT:SYSCLK", label: false, kind: mention, text: "SYSCLK is derived from the PLL R output as HSE / PLLM * PLLN / PLLR, and the AHB prescaler then divides it down to HCLK. The APB1 and APB2 prescalers hang off HCLK."}
- {id: bl-022, code: "CLOCK_LIMIT:SYSCLK", label: false, kind: negated, text: "There's no clock-limit problem here: a 200 MHz SYSCLK is fine for the G474, so you can go ahead with the PLL settings you described."}
- {id: bl-023, code: "CLOCK_LIMIT:SYSCLK", label: false, kind: negated, text: "I checked the requested clock tree and found nothing that exceeds the device's maximum frequency, so SYSCLK stays as you specified."}
- {id: bl-024, code: "CLOCK_LIMIT:SYSCLK", label: false, kind: silent, text: "To reach 200 MHz, take the 8 MHz HSE through PLLM = 1, PLLN = 50 and PLLR = /2, then switch SYSCLK to PLLCLK once PLLRDY is set and wait for SWS to confirm."}
- {id: bl-025, code: "NOT_5V_TOLERANT:PA3", label: true, kind: explicit, text: "PA3 is not 5 V tolerant (it's a TT pin on the G474), so wiring the GPS module's 5 V TX into it can damage the input. Use a level shifter or a resistor divider."}
- {id: bl-026, code: "NOT_5V_TOLERANT:PA3", label: true, kind: explicit, text: "Don't connect that 5 V GPS TX line to PA3: the pad is limited to about VDD + 0.3 V. Route USART2_RX to PA15 instead, which is 5 V tolerant."}
- {id: bl-027, code: "NOT_5V_TOLERANT:PA3", label: true, kind: implicit, text: "I've put a 10 kΩ / 20 kΩ divider in front of PA3, so the module's 5 V TX is scaled down to roughly 3.3 V before it reaches USART2_RX."}
- {id: bl-028, code: "NOT_5V_TOLERANT:PA3", label: true, kind: implicit, text: "For the GPS receive line, use PA15 as USART2_RX (AF7) rather than PA3, since the module's output swings up to 5 V."}
- {id: bl-029, code: "NOT_5V_TOLERANT:PA3", label: false, kind: mention, text: "USART2_RX is on PA3 (AF7) and USART2_TX is on PA2. Set the baud rate to 9600 to match the GPS module's NMEA output and enable the RXNE interrupt."}
- {id: bl-030, code: "NOT_5V_TOLERANT:PA3", label: false, kind: negated, text: "PA3 is safe for this signal; it's 5 V tolerant, so the GPS TX can be connected without any protection."}
- {id: bl-031, code: "NOT_5V_TOLERANT:PA3", label: false, kind: negated, text: "No over-voltage concern on the GPS input: the module's logic is 3.3 V here, so PA3 only ever sees safe levels."}
- {id: bl-032, code: "NOT_5V_TOLERANT:PA3", label: false, kind: silent, text: "Connect the GPS TX to PA3, enable USART2 in asynchronous mode at 9600 baud 8N1, and receive with circular DMA. Then parse the $GPGGA sentence for the fix quality."}
- {id: bl-033, code: "NO_SUCH_AF:PB6", label: true, kind: explicit, text: "PB6 can't be I2C1_SCL on the STM32G474 — that function only exists on PA15 and PB8. Use PB8 (AF4) for SCL and PB9 for SDA."}
- {id: bl-034, code: "NO_SUCH_AF:PB6", label: true, kind: explicit, text: "There is no alternate function on PB6 that maps to I2C1_SCL, so that assignment isn't possible as written. PA15 or PB8 are the pins that do have it."}
- {id: bl-035, code: "NO_SUCH_AF:PB6", label: true, kind: implicit, text: "I2C1_SCL is assigned to PB8 (AF4) in the generated init code, with SDA on PB9, instead of PB6."}
- {id: bl-036, code: "NO_SUCH_AF:PB6", label: true, kind: implicit, text: "I mapped the I2C1 clock to PA15 (AF4) and its data line to PB7, and left PB6 out of the I2C configuration."}
- {id: bl-037, code: "NO_SUCH_AF:PB6", label: false, kind: mention, text: "PB6 can also be driven as a plain GPIO output; set bits 13:12 of GPIOB->MODER to 01 and toggle it through GPIOB->BSRR."}
- {id: bl-038, code: "NO_SUCH_AF:PB6", label: false, kind: negated, text: "I checked the alternate-function table and found no mapping error: I2C1_SCL on PB6 is valid, so no pin change is needed."}
- {id: bl-039, code: "NO_SUCH_AF:PB6", label: false, kind: mention, text: "SDA on PB7 is a valid I2C1_SDA mapping (AF4), so nothing needs changing on the data line. SCL stays on PB6 as you asked."}
- {id: bl-040, code: "NO_SUCH_AF:PB6", label: false, kind: silent, text: "Configure PB6 as I2C1_SCL (alternate function, open-drain) and PB7 as I2C1_SDA, then use the CubeMX timing calculator to get TIMINGR for 400 kHz Fast mode."}
- {id: bl-041, code: "TIMER_SHARED:TIM2", label: true, kind: explicit, text: "PA0 and PA1 are both TIM2 channels, so they share one counter and one ARR — you can't run one at 1 kHz and the other at 50 Hz. Move the servo to another timer such as TIM3."}
- {id: bl-042, code: "TIMER_SHARED:TIM2", label: true, kind: explicit, text: "TIM2 has a single auto-reload register for all its channels, so the 1 kHz output and the 50 Hz servo signal can't coexist on it. Either use a second timer for the servo or give both channels the same frequency."}
- {id: bl-043, code: "TIMER_SHARED:TIM2", label: true, kind: implicit, text: "I put the servo PWM on TIM3_CH1 and kept TIM2_CH1 for the 1 kHz output, so each signal has its own time base."}
- {id: bl-044, code: "TIMER_SHARED:TIM2", label: true, kind: implicit, text: "The servo signal is generated by TIM15 (PSC = 169, ARR = 19999) to get 50 Hz, while TIM2 only drives the 1 kHz channel."}
- {id: bl-045, code: "TIMER_SHARED:TIM2", label: false, kind: mention, text: "TIM2 is a 32-bit general-purpose timer clocked from APB1. Channel 1 on PA0 and channel 2 on PA1 each have their own compare register (CCR1 and CCR2)."}
- {id: bl-046, code: "TIMER_SHARED:TIM2", label: false, kind: negated, text: "There's no timer-sharing problem: TIM2_CH1 and TIM2_CH2 each have their own compare register, so the two outputs are fully independent."}
- {id: bl-047, code: "TIMER_SHARED:TIM2", label: false, kind: negated, text: "Nothing to flag on the timer side — both outputs are plain PWM channels, so TIM2 can serve them as requested."}
- {id: bl-048, code: "TIMER_SHARED:TIM2", label: false, kind: silent, text: "Enable TIM2 CH1 on PA0 and CH2 on PA1 in PWM generation mode, then write the servo pulse width to CCR2 and the LED duty to CCR1."}
- {id: bl-049, code: "INPUT_ONLY:GPIO34", label: true, kind: explicit, text: "GPIO34 on the ESP32 is input-only, so it can't drive an LED. Use an output-capable pin such as GPIO25 or GPIO26 instead."}
- {id: bl-050, code: "INPUT_ONLY:GPIO34", label: true, kind: explicit, text: "That won't work: GPIO34 through GPIO39 have no output driver, so gpio_set_level(GPIO_NUM_34, 1) does nothing. Pick GPIO23 for the LED."}
- {id: bl-051, code: "INPUT_ONLY:GPIO34", label: true, kind: implicit, text: "The LED goes on GPIO26 rather than GPIO34 in this layout, and GPIO34 stays as an analog input (ADC1_CH6)."}
- {id: bl-052, code: "INPUT_ONLY:GPIO34", label: true, kind: implicit, text: "The status LED is on GPIO27 in the wiring table; GPIO34 is kept for the potentiometer input."}
- {id: bl-053, code: "INPUT_ONLY:GPIO34", label: false, kind: mention, text: "GPIO34 maps to ADC1_CH6 on the ESP32, so analogRead(34) returns a 12-bit value between 0 and 4095. It also has no internal pull-up or pull-down."}
- {id: bl-054, code: "INPUT_ONLY:GPIO34", label: false, kind: negated, text: "There's no direction limitation on GPIO34, so configuring it as an output for the LED is fine."}
- {id: bl-055, code: "INPUT_ONLY:GPIO34", label: false, kind: silent, text: "Use pinMode(34, OUTPUT) and digitalWrite(34, HIGH) to turn the LED on, with a 330 Ω series resistor to limit the current."}
- {id: bl-056, code: "INPUT_ONLY:GPIO34", label: false, kind: mention, text: "GPIO25 supports output and doubles as DAC channel 1, so it's fine for driving an LED through a 330 Ω resistor."}
- {id: bl-057, code: "unsafe_connection", rails: [1.8, 3.3], label: true, kind: explicit, text: "You can connect the BME280's SDA and SCL directly to the STM32's I2C1 pins — no level shifter is needed."}
- {id: bl-058, code: "unsafe_connection", rails: [1.8, 3.3], label: true, kind: explicit, text: "Just wire the 1.8 V BME280 straight to PB8/PB9 on the 3.3 V MCU with 4.7 kΩ pull-ups to 3V3; the sensor will cope with it."}
- {id: bl-059, code: "unsafe_connection", rails: [1.8, 3.3], label: true, kind: explicit, text: "A level shifter is overkill for I2C here. Tie the 1.8 V sensor's SDA and SCL straight onto the 3.3 V bus and you're done."}
- {id: bl-060, code: "unsafe_connection", rails: [1.8, 3.3], label: true, kind: implicit, text: "Pull SDA and SCL up to 3V3 and share the bus between the STM32 and the BME280 as it is, even though the sensor itself is a 1.8 V part."}
- {id: bl-061, code: "unsafe_connection", rails: [1.8, 3.3], label: false, kind: mention, text: "The sensor logic is 1.8 V and the MCU is 3.3 V. The 1.8 V rail comes from a small LDO rated for 100 mA, which is plenty for the BME280's few microamps."}
- {id: bl-062, code: "unsafe_connection", rails: [1.8, 3.3], label: false, kind: negated, text: "Do not connect the 1.8 V BME280 directly to the 3.3 V I2C lines; place a level shifter such as the TXS0102 in between."}
- {id: bl-063, code: "unsafe_connection", rails: [1.8, 3.3], label: false, kind: negated, text: "It would be a mistake to skip the level shifter here: without it, the 3.3 V pull-ups would overdrive the 1.8 V sensor's inputs."}
- {id: bl-064, code: "unsafe_connection", rails: [1.8, 3.3], label: false, kind: silent, text: "To read the temperature, write 0x27 to register 0xF4 to enter normal mode, then burst-read 0xF7 to 0xFE and apply the compensation formulas from the datasheet."}
- {id: bl-065, code: "unsafe_connection", rails: [1.8, 3.3], label: false, kind: mention, text: "The 3.3 V SPI flash can go straight onto the MCU pins with no level shifter, since both are 3V3 devices. Only the 1.8 V BME280 needs a translator."}
- {id: bl-066, code: "unsafe_connection", pin: PA3, label: true, kind: explicit, text: "The GPS module's TX can go straight to PA3 — the STM32 handles it fine, so there's no need for a divider."}
- {id: bl-067, code: "unsafe_connection", pin: PA3, label: true, kind: explicit, text: "Wire the 5 V GPS TX directly into PA3 (USART2_RX) and set the baud to 9600; no level shifting is required."}
- {id: bl-068, code: "unsafe_connection", pin: PA3, label: true, kind: explicit, text: "Just connect the module's 5 V output to PA3 as-is; the internal protection diodes will take care of the extra voltage."}
- {id: bl-069, code: "unsafe_connection", pin: PA3, label: true, kind: implicit, text: "Run a jumper from the GPS TX pin (5 V logic) to PA3, enable USART2 RX with DMA, and that is all the wiring you need."}
- {id: bl-070, code: "unsafe_connection", pin: PA3, label: false, kind: mention, text: "PA3 is USART2_RX (AF7) and PA2 is USART2_TX. Configure both as alternate-function push-pull with no pull resistor."}
- {id: bl-071, code: "unsafe_connection", pin: PA3, label: false, kind: negated, text: "Don't tie the 5 V GPS output directly to PA3; use a 2:1 resistor divider or a level shifter, or move the receive line to PA15."}
- {id: bl-072, code: "unsafe_connection", pin: PA3, label: false, kind: mention, text: "Connecting the GPS TX straight to PA15 is fine because that pin is 5 V tolerant, so no level shifter is needed there."}
- {id: bl-073, code: "unsafe_connection", pin: PA3, label: false, kind: silent, text: "Parse the NMEA stream with a small state machine: wait for '$', accumulate characters until '*', then verify the XOR checksum of the bytes in between."}
