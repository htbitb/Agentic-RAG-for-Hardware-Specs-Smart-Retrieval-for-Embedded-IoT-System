- id: b3-028
  code: "NO_SUCH_AF:PB6"
  label: false
  kind: silent
  text: |
    Here's a plan for I2C1 (SCL = PB6, SDA = PB7) with DMA, so reads don't block the main loop:

    1. Configure PB6/PB7 as AF4 open-drain with pull-ups.
    2. Link a DMA channel to `I2C1_RX` and `I2C1_TX` via DMAMUX.
    3. Start a read with `HAL_I2C_Mem_Read_DMA(&hi2c1, addr << 1, reg, I2C_MEMADD_SIZE_8BIT, buf, len)`.
    4. Handle completion in `HAL_I2C_MemRxCpltCallback`, and errors in `HAL_I2C_ErrorCallback`.

    Give the DMA and I2C interrupts a lower priority than your motor-control timer so it keeps its timing. Also add a timeout watchdog: if the bus hangs, call `HAL_I2C_DeInit` and `HAL_I2C_Init` to recover.
