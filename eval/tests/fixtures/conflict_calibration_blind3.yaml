    ```c
    #define BME280_ADDR (0x76 << 1)

    static HAL_StatusTypeDef bme280_read(uint8_t reg, uint8_t *buf, uint16_t n)
    {
        return HAL_I2C_Mem_Read(&hi2c1, BME280_ADDR, reg,
                                I2C_MEMADD_SIZE_8BIT, buf, n, 100);
