- id: b3-001
  code: "PIN_CONFLICT:PA8"
  label: true
  kind: explicit
  text: |
    **PA8 can't carry I2C3_SCL here.** In the first step we gave PA8 to `TIM1_CH1` (AF6) for the 20 kHz PWM, and a GPIO can only be in one alternate-function mode at a time. I2C3_SCL is AF2 on that same pad, so selecting it would silently disable your PWM output.

    Move the clock line to PC8 (I2C3_SCL, AF8) and keep SDA on PC9:

    ```c
    /* I2C3: SCL = PC8, SDA = PC9, both AF8, open-drain */
    GPIO_InitTypeDef gpio = {0};
    gpio.Pin       = GPIO_PIN_8 | GPIO_PIN_9;
    gpio.Mode      = GPIO_MODE_AF_OD;
    gpio.Pull      = GPIO_NOPULL;      /* external 4.7k pull-ups */
    gpio.Speed     = GPIO_SPEED_FREQ_HIGH;
    gpio.Alternate = GPIO_AF8_I2C3;
    HAL_GPIO_Init(GPIOC, &gpio);
    ```

    PA8 and the TIM1 setup stay exactly as they were.
- id: b3-002
  code: "PIN_CONFLICT:PA8"
  label: true
  kind: explicit
  text: |
    Before adding the BME280, there is a pin clash to resolve:

    - `TIM1_CH1` (PWM, AF6) already owns **PA8**
    - you asked for `I2C3_SCL` on PA8 (AF2)

    Both can't be active on one pad, so one of them has to move. The cheapest change is the I2C side: use PC8 for SCL (AF8) and PC9 for SDA. If you would rather keep I2C3 on PA8, you would have to relocate the PWM to another TIM1_CH1 pin such as PC0 (AF2) and re-route the board.

    ```c
    hi2c3.Instance            = I2C3;
    hi2c3.Init.Timing         = 0x30A0A7FB;  /* 100 kHz @ 170 MHz (CubeMX) */
    hi2c3.Init.AddressingMode = I2C_ADDRESSINGMODE_7BIT;
    HAL_I2C_Init(&hi2c3);
    ```

    The BME280 then answers at 0x76 (SDO to GND) or 0x77 (SDO to VDDIO).
