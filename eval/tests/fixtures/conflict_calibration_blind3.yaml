- id: b3-015
  code: "LEVEL_MISMATCH:1.8V-3.3V"
  label: true
  kind: implicit
  text: |
    Wiring for the BME280 on I2C1 (PB8 = SCL, PB9 = SDA):

    ```
     STM32G474 (3V3)        PCA9306          BME280 (1V8)
     PB8 / SCL  ----------- SCL2 | SCL1 ----- SCL
     PB9 / SDA  ----------- SDA2 | SDA1 ----- SDA
     3V3 --[4.7k]-- SCL/SDA     VREF2 = 3V3, VREF1 = 1V8, EN = 3V3 (via 200k)
                                  1V8 --[4.7k]-- SCL/SDA
    ```

    Fit 4.7 kΩ pull-ups on each side and share a common ground. Firmware needs nothing special: `HAL_I2C_Init(&hi2c1)` at 100 kHz, then read 0xD0 to confirm the 0x60 chip ID.
