  kind: explicit
  text: |
    I'd hold off on wiring this up until the logic levels are sorted out. The BME280 in your design is a 1.8 V device and your STM32 talks at 3.3 V, which means the I2C lines need level translation in between; connecting them directly risks damaging the sensor and, at best, gives unreliable reads because a 1.8 V high barely registers on the MCU.

    A tiny PCA9306 breakout solves it: sensor side to the 1.8 V rail, MCU side to 3V3, pull-ups on both sides. Software is unaffected:

    ```c
