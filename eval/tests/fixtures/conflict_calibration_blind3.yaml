- id: b3-010
  code: "PIN_CONFLICT:PA8"
  label: false
  kind: mention
  text: |
    Each STM32 pin has up to 16 alternate-function slots (AF0 to AF15), and the slot is chosen per pin in the `GPIOx_AFRL` / `GPIOx_AFRH` registers; HAL hides this behind the `Alternate` field. To find the right number, look up the pin in the "Alternate function" table of the datasheet. For example, PA8 lists MCO, I2C3_SCL and TIM1_CH1 on different AF numbers.

    ```c
    /* Generic helper: put a pin of a GPIO port into alternate-function mode */
    static void pin_af(GPIO_TypeDef *port, uint32_t pin, uint32_t af, uint32_t mode)
    {
        GPIO_InitTypeDef g = {0};
        g.Pin = pin;
        g.Mode = mode;          /* GPIO_MODE_AF_PP or GPIO_MODE_AF_OD */
        g.Alternate = af;
        HAL_GPIO_Init(port, &g);
    }
    ```

    Use `GPIO_MODE_AF_OD` for I2C and `GPIO_MODE_AF_PP` for PWM, UART TX and SPI.
- id: b3-011
  code: "LEVEL_MISMATCH:1.8V-3.3V"
  label: true
  kind: explicit
  text: |
    One important hardware issue before the code: your BME280 module runs at **1.8 V**, while the STM32G474's I/O is at **3.3 V**. SDA/SCL pulled up to 3.3 V would exceed the sensor's absolute maximum input level (VDDIO + 0.3 V), so the two sides must not share a bus directly. Use a bidirectional I2C level translator such as a PCA9306 or TXS0102, with 4.7 kΩ pull-ups on each side to its own rail (1.8 V on the sensor side, 3V3 on the MCU side).

    ```c
    /* I2C1: SCL = PB8, SDA = PB9 (AF4, open-drain) on the 3V3 side of the translator */
    hi2c1.Instance = I2C1;
    hi2c1.Init.Timing = 0x30A0A7FB; /* 100 kHz @ 170 MHz */
    HAL_I2C_Init(&hi2c1);
    ```
- id: b3-012
  code: "LEVEL_MISMATCH:1.8V-3.3V"
  label: true
  kind: explicit
  text: |
    **Voltage mismatch on the I2C bus.**

    - BME280 board supply / logic: 1.8 V
    - STM32G474 GPIO: 3.3 V

    The sensor's SDA/SCL inputs are only rated up to VDDIO + 0.3 V, so a 3.3 V bus can over-stress them (and a 1.8 V "high" is marginal for the MCU, whose VIH is about 0.7 x VDD, roughly 2.3 V). You have two safe options:

    1. Add a level shifter (a PCA9306, or two BSS138 MOSFETs with pull-ups on both sides).
    2. Power the sensor from 3V3 instead; the BME280 accepts 1.71 V to 3.6 V.

    Once the levels agree, the driver is the same as for any I2C part: read the chip ID at 0xD0 (expect 0x60), then configure `ctrl_hum` before `ctrl_meas`.
- id: b3-013
  code: "LEVEL_MISMATCH:1.8V-3.3V"
