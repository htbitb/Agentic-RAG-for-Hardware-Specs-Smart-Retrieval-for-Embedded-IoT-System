    Here's a BME280 reader over I2C1 (PB8 = SCL, PB9 = SDA). The sensor is supplied at 1.8 V from the LDO, and its address is 0x76 with SDO grounded.

    ```c
    uint8_t hum = 0x01, meas = 0x27;
    HAL_I2C_Mem_Write(&hi2c1, 0x76 << 1, 0xF2, I2C_MEMADD_SIZE_8BIT, &hum, 1, 100);  /* ctrl_hum: x1 */
    HAL_I2C_Mem_Write(&hi2c1, 0x76 << 1, 0xF4, I2C_MEMADD_SIZE_8BIT, &meas, 1, 100); /* ctrl_meas: x1/x1, normal */
    HAL_Delay(10);
    uint8_t raw[8];
    HAL_I2C_Mem_Read(&hi2c1, 0x76 << 1, 0xF7, I2C_MEMADD_SIZE_8BIT, raw, 8, 100);
    ```

    Use the compensation formulas from the datasheet (section 4.2.3) to convert `raw` to °C, hPa and %RH. Add 4.7 kΩ pull-ups on SDA and SCL.
- id: b3-018
  code: "LEVEL_MISMATCH:1.8V-3.3V"
  label: false
  kind: silent
  text: |
    Steps to read the BME280 over I2C1:

    1. Configure PB8 (SCL) and PB9 (SDA) as AF4 open-drain and enable the I2C1 clock.
    2. Initialise `hi2c1` at 100 kHz and enable the analog filter.
    3. Verify the chip ID (register 0xD0 should read 0x60).
    4. Read the 26 calibration bytes at 0x88 and the 7 bytes at 0xE1.
    5. Put the sensor in forced mode by writing 0x25 to register 0xF4, wait about 10 ms, then burst-read 8 bytes from 0xF7.

    Store the calibration values (`dig_T1`, `dig_P1`, `dig_H1`, ...) in a struct once at startup, because they never change. Fixed-point compensation code is provided in Bosch's reference driver.
- id: b3-019
  code: "LEVEL_MISMATCH:1.8V-3.3V"
  label: false
  kind: negated
  text: |
    No voltage translation is needed on this bus. Most BME280 breakout boards carry their own regulator and level shifting on SDA/SCL, so the module's lines are compatible with the STM32's 3.3 V logic and there is no voltage mismatch to worry about. Just wire VCC, GND, SDA and SCL.

    ```c
    HAL_I2C_Init(&hi2c1);
    if (HAL_I2C_IsDeviceReady(&hi2c1, 0x76 << 1, 3, 50) == HAL_OK) {
        /* sensor found at 0x76 */
    }
    ```

    If it doesn't respond, try address 0x77, which is used when SDO is tied high.
- id: b3-020
  code: "LEVEL_MISMATCH:1.8V-3.3V"
  label: false
  kind: mention
  text: |
    For a 400 kHz I2C bus with roughly 100 pF of total bus capacitance, pull-up resistors between 1 kΩ and 2.2 kΩ are a good starting point. The Fast-mode rise-time limit is 300 ns and the rise time is about 0.85 x R x C, so 4.7 kΩ would be too weak at that speed (it is fine for 100 kHz).

    Two more practical rules:

    - Level shifters are only needed where devices run at different logic voltages; on a single-supply bus (everything on 3V3) leave them out, because they add capacitance and delay.
    - Keep traces short and put the pull-ups near the master.

    ```c
    hi2c1.Init.Timing = 0x10802D9B;   /* 400 kHz @ 170 MHz, from CubeMX */
    ```
- id: b3-021
  code: "NO_SUCH_AF:PB6"
  label: true
  kind: explicit
  text: |
    PB6 can't be I2C1_SCL on the STM32G474. That signal is only routed to **PA15** and **PB8** (both AF4), so the request can't be implemented as written. SDA is fine on PB7 (AF4), but the clock needs to move. PB8 is the usual choice:

    ```c
    GPIO_InitTypeDef g = {0};
    g.Pin       = GPIO_PIN_8;        /* I2C1_SCL */
    g.Mode      = GPIO_MODE_AF_OD;
    g.Pull      = GPIO_NOPULL;
    g.Speed     = GPIO_SPEED_FREQ_HIGH;
    g.Alternate = GPIO_AF4_I2C1;
    HAL_GPIO_Init(GPIOB, &g);

    g.Pin = GPIO_PIN_7;              /* I2C1_SDA */
    HAL_GPIO_Init(GPIOB, &g);
    ```

    Use 4.7 kΩ external pull-ups to 3V3 on both lines.
