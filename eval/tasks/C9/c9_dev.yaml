- id: C9-C3-012-abbrev
  category: C9
  split: dev
  turns:
  - user: 'Write bare-metal C for the STM32G474 that accesses regs the CMSIS way (e.g. `TIM1->PSC = ...;`, `RCC->APB2ENR |= RCC_APB2ENR_TIM1EN;`) using the reg and bit names of ST''s `stm32g4xx.h` device
      header. Do not use HAL or LL drivers, `SystemCoreClock` or any other library function; write clock frequencies as numeric constants. Do not use interrupts; busy-wait loops on status flags are fine.
      Initial state: the chip has just come out of reset: SYSCLK = HCLK = PCLK1 = PCLK2 = 16 MHz (HSI16), all prescalers are 1, no periph clock beyond the reset defaults is enabled, and all GPIO pins are
      in their reset state. Task: configure USART2 for 9600 baud, with TX on pin PA2 and RX on pin PA3. Use 8 data bits, no parity, 1 stop bit and oversampling by 16, enable both the transmitter and the
      receiver (write the baud-rate reg before enabling the USART), and make the baud rate accurate to within ±2 %; no interrupts or DMA. Answer with one complete C code block (`#include "stm32g4xx.h"`,
      then a `main()` that configures everything and finally loops forever with `while (1)`), followed by a short explanation.'
  graders:
  - functional_sim
  - compile
  expected:
    initial: reset
    spec:
    - type: uart
      instance: USART2
      baud: 9600
      tol_pct: 2
      tx_pin: PA2
      rx_pin: PA3
      frame: 8N1
      te: true
      re: true
      over8: 0
  difficulty: medium
