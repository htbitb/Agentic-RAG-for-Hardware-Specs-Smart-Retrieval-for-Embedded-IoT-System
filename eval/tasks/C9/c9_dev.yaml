- id: C9-C3-001-reorder
  category: C9
  split: dev
  turns:
  - user: 'Answer with one complete C code block (`#include "stm32g4xx.h"`, then a `main()` that configures everything and finally loops forever with `while (1)`), followed by a short explanation. Write
      bare-metal C for the STM32G474 that accesses registers the CMSIS way (e.g. `TIM1->PSC = ...;`, `RCC->APB2ENR |= RCC_APB2ENR_TIM1EN;`) using the register and bit names of ST''s `stm32g4xx.h` device
      header. Do not use HAL or LL drivers, `SystemCoreClock` or any other library function; write clock frequencies as numeric constants. Do not use interrupts; busy-wait loops on status flags are fine.
      Initial state: SYSCLK = HCLK = PCLK1 = PCLK2 = 170 MHz (PLL fed by HSI16, AHB/APB1/APB2 prescalers = 1, voltage Range 1 boost mode, Flash wait states already set). Every peripheral clock that is off
      at reset is still off, and all GPIO pins are in their reset state. Task: on the STM32G474, generate a 20 kHz PWM signal with a 25 % duty cycle on pin PA8 using TIM1 channel 1. The PWM frequency must
      be within ±1 % and the duty cycle (high time / period) within ±1 percentage point; edge-aligned PWM mode 1, active-high output, no dead time, no interrupts.'
  graders:
  - functional_sim
  - compile
  expected:
    initial: sysclk_170mhz_pll_hsi16_apb_div1
    spec:
    - type: pwm
      pin: PA8
      freq_hz: 20000
      duty_pct: 25
      tol_pct: 1
  difficulty: medium
  chips:
  - stm32g474
  tags:
  - pwm
  - advanced_timer
  - moe
  - robustness
  - reorder
  review_status: verified
  provenance:
    kind: derived
    from: C3-001
    transform: reorder
  suites: []
  version: 1
  human_policy: {}
  hidden_info: []
