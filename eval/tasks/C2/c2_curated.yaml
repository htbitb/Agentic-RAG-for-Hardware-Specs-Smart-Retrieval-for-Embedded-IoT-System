    cite_values: ["Number of wait states according to CPU clock", "2 WS (3 CPU cycles)"]
    numeric_support: [{value: 24, unit: MHz}, {value: 26, unit: MHz}]
  graders: [keyfacts, numeric_claims, citation]
  review_status: verified
  provenance:
    evidence:
      - {doc_id: STM32G474_RM0440, page: 98, contains: ["1 WS (2 CPU cycles) ≤ 68 ≤ 60 ≤ 24", "2 WS (3 CPU cycles) ≤ 102 ≤ 90 ≤ 26", "3 WS (4 CPU cycles) ≤ 136 ≤ 120 -"]}
    note: "Giá trị 26 MHz là ô cuối của hàng '2 WS' (Range 2) trong Table 9; trang không ghi đơn vị MHz trong ô."
    review: {by: "independent model review (Claude Opus 5.5)", date: "2026-10-22", change: "thêm alias 'one WS', 'LATENCY[3:0] = 1' (optional)"}

