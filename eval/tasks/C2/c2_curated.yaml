  tags: [pll, formula, procedure]
  turns:
    - user: "On the STM32G474, what formulas give the PLL VCO frequency and the PLL_R output frequency from PLLN, PLLM and PLLR, what is the allowed range of PLLM, and what must be done to the PLL before its configuration can be changed?"
  expected:
    keyfacts:
      - {attribute: vco_formula, value: "PLLN / PLLM", aliases: ["divided by PLLM and multiplied by PLLN", "divided by PLLM then multiplied by PLLN", "divided by PLLM multiplied by PLLN", "PLLN/PLLM", "PLLN divided by PLLM", "multiplied by PLLN and divided by PLLM", "× (PLLN / PLLM)", "x PLLN / PLLM", "PLLN over PLLM"]}
      - {attribute: pllr_formula, value: "VCO clock / PLLR", aliases: ["VCO / PLLR", "divided by PLLR", "VCO frequency divided by PLLR", "f(VCO clock) / PLLR"]}
      - {attribute: pllm_range, value: "1 to 16", aliases: ["1 and 16", "1-16", "1..16", "from 1 to 16", "1 16", "1 ≤ PLLM ≤ 16", "1 to 8", "1 and 8", "1-8", "1..8", "from 1 to 8", "1 8"]}
      - {attribute: disable_pll, value: "disable the PLL", aliases: ["disabling the PLL", "PLLON to 0", "PLLON = 0", "clear PLLON", "PLLON cleared", "PLL must be disabled", "PLL is disabled", "wait until PLLRDY is cleared", "disable PLL", "turn off the PLL", "switch off the PLL", "stop the PLL", "clear the PLLON", "PLLON bit to 0", "set PLLON to 0", "disabled the PLL", "PLLRDY"]}
