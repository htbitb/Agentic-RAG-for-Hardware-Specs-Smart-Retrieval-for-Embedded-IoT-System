# C2 — Multi-hop / cross-document (tuyển chọn thủ công). Mọi bằng chứng (provenance.evidence) được
# `python -m eval.tools.verify_tasks` kiểm trên text trang PDF của corpus (trang = chỉ số PDF 1-based).
# review_status: verified = đã qua công cụ xác minh; CHƯA có người duyệt độc lập (xem eval/tasks/INDEX.md).
- id: C2-001
  category: C2
  split: test
  difficulty: medium
  chips: [stm32g474]
  tags: [pin_af, multi_hop]
  turns:
    - user: "On the STM32G474, which alternate function number connects TIM4_CH1 to pin PB6, and which alternate function number on the same pin provides USART1_TX?"
  expected:
    keyfacts:
      - {attribute: af_tim4_ch1, value: AF2, aliases: ["AF 2", "alternate function 2"]}
      - {attribute: af_usart1_tx, value: AF7, aliases: ["AF 7", "alternate function 7"]}
    cite_values: [PB6, TIM4_CH1]
  graders: [keyfacts, numeric_claims, citation]
  review_status: verified
  provenance:
    evidence:
      - {doc_id: STM32G474_Datasheet, page: 74, contains: ["PB6 - TIM16_CH1N TIM4_CH1 - - TIM8_CH1 TIM8_ETR USART1_TX COMP4_OUT"]}
    note: "Cột AF suy ra từ vị trí token trong hàng PB6 của Table 13 (AF0='-', AF1=TIM16_CH1N, AF2=TIM4_CH1, ..., AF7=USART1_TX)."

