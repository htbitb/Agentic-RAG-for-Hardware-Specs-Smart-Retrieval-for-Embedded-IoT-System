  expected:
    keyfacts:
      - {attribute: ws_24mhz_range2, value: "1 WS", aliases: ["1 wait state", "one wait state", "LATENCY = 1", "LATENCY=1", "1 WS (2 CPU cycles)", "one WS", "LATENCY[3:0] = 1"], literal: true}
