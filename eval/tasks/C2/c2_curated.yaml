  review_status: verified
  provenance:
    evidence:
      - {doc_id: STM32G474_RM0440, page: 291, contains: ["f(VCO clock) = f(PLL clock input) × (PLLN / PLLM)", "f(PLL_R) = f(VCO clock) / PLLR"]}
      - {doc_id: STM32G474_RM0440, page: 278, contains: ["programmable factor PLLM from 1 to 8", "Disable the PLL by setting PLLON to 0"]}
      - {doc_id: STM32G474_RM0440, page: 293, contains: ["VCO input frequency = PLL input clock frequency / PLLM with 1 ≤ PLLM ≤ 16"]}
    note: "RM0440 TỰ MÂU THUẪN về dải PLLM: §7.2.4 (p.278) ghi 'PLLM from 1 to 8', còn mô tả thanh ghi RCC_PLLCFGR (p.293) và trường PLLM[3:0] 4 bit ghi 1 ≤ PLLM ≤ 16 (0000..1111 = 1..16). Chọn phương án KHOAN DUNG (D11): chấp nhận cả '1 to 16' và '1 to 8'; giữ nguyên câu hỏi."
    review: {by: "independent model review (Claude Opus 5.5)", date: "2026-10-22", change: "pllm_range: chấp nhận cả '1 to 16' (p.293) và '1 to 8' (p.278) vì RM tự mâu thuẫn; thêm bằng chứng p.293; thêm alias vco_formula/disable_pll"}

