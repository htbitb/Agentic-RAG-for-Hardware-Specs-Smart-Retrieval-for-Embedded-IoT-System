- id: C3-015
  category: C3
  split: test
  difficulty: medium
  chips: [stm32g474]
  tags: [i2c, i2c1, rm_example]
  turns:
    - user: "Write bare-metal C for the STM32G474 that accesses registers the CMSIS way (e.g. `TIM1->PSC = ...;`, `RCC->APB2ENR |= RCC_APB2ENR_TIM1EN;`) using the register and bit names of ST's `stm32g4xx.h` device header. Do not use HAL or LL drivers, `SystemCoreClock` or any other library function; write clock frequencies as numeric constants. Do not use interrupts; busy-wait loops on status flags are fine. Initial state: the chip has just come out of reset: SYSCLK = HCLK = PCLK1 = PCLK2 = 16 MHz (HSI16), all prescalers are 1, no peripheral clock beyond the reset defaults is enabled, and all GPIO pins are in their reset state. Task: configure I2C1 for 100 kHz (standard mode) with SCL on pin PB8 and SDA on pin PB9. I2C1 uses its default kernel clock (PCLK1). Configure the peripheral for controller operation: program I2C_TIMINGR (while the peripheral is still disabled) so that the target fSCL is reachable, where fSCL = 1 / tSCL with tSCL = tSYNC1 + tSYNC2 + [(SCLH+1) + (SCLL+1)] x (PRESC+1) x tI2CCLK (RM0440 §39.4.9) and tSYNC1 + tSYNC2 anywhere between its minimum 4 x tI2CCLK and 1000 ns (the largest value in the manual's examples): the target must lie within ±5 % of the frequency range this gives. The bus timing must also meet the standard-mode (Sm) minimums of RM0440 Table 358 (tLOW >= 4.7 us and tHIGH >= 4.0 us), estimating tLOW as tSCLL + tSYNC1 and tHIGH as tSCLH + tSYNC2 with tSYNC1 = tSYNC2 = 2 x tI2CCLK. Then enable the peripheral; SCL and SDA are open-drain alternate-function pins; no interrupts or DMA. Answer with one complete C code block (`#include \"stm32g4xx.h\"`, then a `main()` that configures everything and finally loops forever with `while (1)`), followed by a short explanation."
  expected:
    initial: "reset"
    spec:
      - {"type": "i2c", "instance": "I2C1", "scl_hz": 100000, "tol_pct": 5, "scl_pin": "PB8", "sda_pin": "PB9", "open_drain": true, "kernel_clk_hz": 16000000, "mode": "Sm"}
  graders: [functional_sim, compile]
  review_status: verified
  provenance:
    authored_by: "session P2 (Claude Sonnet 5.5); lời giải và phép tính tay độc lập với simulator"
    review: {by: "independent model review (Claude Opus, fresh context)", date: "2026-10-22", report: "plan/reviews/review_C3.md", change: "sửa theo review: PLLREN, khoá ghi khi đang bật, khung UART/kernel clock/over8, dải I2C theo tSYNC, SCLDEL/SDADEL theo RM, trang trích dẫn, lọc violation theo spec"}
    reference_solution: |
      #include "stm32g4xx.h"

      int main(void)
      {
          RCC->AHB2ENR |= RCC_AHB2ENR_GPIOBEN;
          RCC->APB1ENR1 |= RCC_APB1ENR1_I2C1EN;

          GPIOB->MODER = (GPIOB->MODER & ~(GPIO_MODER_MODE8 | GPIO_MODER_MODE9)) | GPIO_MODER_MODE8_1 | GPIO_MODER_MODE9_1;
          GPIOB->OTYPER |= GPIO_OTYPER_OT8 | GPIO_OTYPER_OT9;                      /* open-drain */
          GPIOB->AFR[1] = (GPIOB->AFR[1] & ~(GPIO_AFRH_AFSEL8 | GPIO_AFRH_AFSEL9)) | (4U << GPIO_AFRH_AFSEL8_Pos) | (4U << GPIO_AFRH_AFSEL9_Pos);

          /* fI2CCLK = 16 MHz: RM0440 Table 360, Sm 100 kHz: PRESC=3, SCLL=0x13, SCLH=0xF, SDADEL=2, SCLDEL=4 */
          I2C1->TIMINGR = (3U << I2C_TIMINGR_PRESC_Pos) | (4U << I2C_TIMINGR_SCLDEL_Pos) | (2U << I2C_TIMINGR_SDADEL_Pos) | (0xFU << I2C_TIMINGR_SCLH_Pos) | (0x13U << I2C_TIMINGR_SCLL_Pos);
          I2C1->CR1 |= I2C_CR1_PE;

          while (1) { }
      }
    reference_calc: "Công thức RM0440 §39.4.9 (p.1645): tSCL = tSYNC1 + tSYNC2 + [(SCLH+1) + (SCLL+1)] × (PRESC+1) × tI2CCLK, với tSYNC1 + tSYNC2 ≥ 4 × tI2CCLK (Table 360 chú thích, p.1657). TIMINGR: PRESC [31:28], SCLDEL [23:20], SDADEL [19:16], SCLH [15:8], SCLL [7:0] (p.1681). Trạng thái reset ⇒ PCLK1 = 16 MHz ⇒ tI2CCLK = 62,5 ns. Chọn đúng ví dụ Table 360 (fI2CCLK = 16 MHz, Sm 100 kHz): PRESC = 3 (tPRESC = 4 × 62,5 = 250 ns), SCLL = 0x13 (20 × 250 ns = 5,0 µs), SCLH = 0xF (16 × 250 ns = 4,0 µs). tSCL = 5,0 + 4,0 + 4 × 0,0625 = 9,25 µs ⇒ fSCL = 108,1 kHz với tSYNC cực tiểu; với tSYNC = 1000 ns (giá trị ví dụ của RM) tSCL = 10,0 µs ⇒ 100,0 kHz: dải [100,0; 108,1] kHz chứa mục tiêu. TIMINGR = 0x30420F13 (đúng cột Sm 100 kHz của Table 360), ghi khi PE = 0 (RM p.1681). SCLDEL = 4 ⇒ 5 × 250 ns = 1250 ns ≥ tr + tSU;DAT = 1000 + 250 ns. PB8 = AF4 = I2C1_SCL, PB9 = AF4 = I2C1_SDA (DS p.74); I2C1EN = APB1ENR1 bit 21."
