      - {"doc_id": "STM32G474_RM0440", "page": 1179, "contains": ["high as long as TIMx_CNT < TIMx_CCRx"]}
      - {"doc_id": "STM32G474_Datasheet", "page": 73, "contains": ["PA0 - TIM2_CH1 TIM5_CH1"]}
      - {"doc_id": "STM32G474_RM0440", "page": 1389, "contains": ["ARR[31:0]: Autoreload value"]}
