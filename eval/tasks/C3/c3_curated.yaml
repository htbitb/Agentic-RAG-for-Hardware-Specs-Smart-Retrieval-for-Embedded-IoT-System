# C3 — Tính toán và sinh cấu hình (bare-metal C, truy cập thanh ghi kiểu CMSIS). Chấm bằng `functional_sim` (gate) + `compile` (chỉ số riêng).
# Mỗi task có provenance.reference_solution (code tham chiếu) + reference_calc (PHÉP TÍNH TAY, trang RM/DS) — KHÔNG sinh từ simulator (D19) —
# và wrong_variants (biến thể sai kinh điển: mỗi biến thể phải bị trượt đúng mã). `python -m eval.tools.verify_tasks --categories C3` kiểm tất cả.
# D20: đề nêu quy ước CMSIS, trạng thái khởi đầu, cấm HAL/LL/SystemCoreClock, và yêu cầu một khối code C hoàn chỉnh.

- id: C3-001
  category: C3
  split: dev
  difficulty: medium
  chips: [stm32g474]
  tags: [pwm, advanced_timer, moe]
  turns:
    - user: "Write bare-metal C for the STM32G474 that accesses registers the CMSIS way (e.g. `TIM1->PSC = ...;`, `RCC->APB2ENR |= RCC_APB2ENR_TIM1EN;`) using the register and bit names of ST's `stm32g4xx.h` device header. Do not use HAL or LL drivers, `SystemCoreClock` or any other library function; write clock frequencies as numeric constants. Do not use interrupts; busy-wait loops on status flags are fine. Initial state: SYSCLK = HCLK = PCLK1 = PCLK2 = 170 MHz (PLL fed by HSI16, AHB/APB1/APB2 prescalers = 1, voltage Range 1 boost mode, Flash wait states already set). Every peripheral clock that is off at reset is still off, and all GPIO pins are in their reset state. Task: on the STM32G474, generate a 20 kHz PWM signal with a 25 % duty cycle on pin PA8 using TIM1 channel 1. The PWM frequency must be within ±1 % and the duty cycle (high time / period) within ±1 percentage point; edge-aligned PWM mode 1, active-high output, no dead time, no interrupts. Answer with one complete C code block (`#include \"stm32g4xx.h\"`, then a `main()` that configures everything and finally loops forever with `while (1)`), followed by a short explanation."
  expected:
    initial: "sysclk_170mhz_pll_hsi16_apb_div1"
    spec:
      - {"type": "pwm", "pin": "PA8", "freq_hz": 20000, "duty_pct": 25, "tol_pct": 1}
  graders: [functional_sim, compile]
  review_status: verified
  provenance:
    authored_by: "session P2 (Claude Sonnet 5.5); lời giải và phép tính tay độc lập với simulator"
    review: {by: "independent model review (Claude Opus, fresh context)", date: "2026-10-22", report: "plan/reviews/review_C3.md", change: "sửa theo review: PLLREN, khoá ghi khi đang bật, khung UART/kernel clock/over8, dải I2C theo tSYNC, SCLDEL/SDADEL theo RM, trang trích dẫn, lọc violation theo spec"}
    reference_solution: |
      #include "stm32g4xx.h"

      int main(void)
      {
          RCC->AHB2ENR |= RCC_AHB2ENR_GPIOAEN;                /* clock of the GPIO port */
          RCC->APB2ENR |= RCC_APB2ENR_TIM1EN;                 /* clock of the timer (writes to a clock-gated peripheral are lost) */

          GPIOA->MODER = (GPIOA->MODER & ~GPIO_MODER_MODE8) | GPIO_MODER_MODE8_1;      /* alternate function mode */
          GPIOA->AFR[1] = (GPIOA->AFR[1] & ~GPIO_AFRH_AFSEL8) | (6U << GPIO_AFRH_AFSEL8_Pos);   /* AF6 */

          TIM1->PSC = 0;
          TIM1->ARR = 8499;
          TIM1->CCR1 = 2125;
          TIM1->CCMR1 = (TIM1->CCMR1 & ~TIM_CCMR1_OC1M) | (6U << TIM_CCMR1_OC1M_Pos) | TIM_CCMR1_OC1PE;   /* PWM mode 1 + preload */
          TIM1->CCER |= TIM_CCER_CC1E;
          TIM1->BDTR |= TIM_BDTR_MOE;                              /* main output enable */
          TIM1->CR1 |= TIM_CR1_ARPE;
          TIM1->EGR = TIM_EGR_UG;                                  /* load the shadow registers before starting */
          TIM1->CR1 |= TIM_CR1_CEN;

          while (1) { }
      }
    reference_calc: "Phép tính tay: f_PWM = f_TIMxCLK / ((PSC+1)(ARR+1)) và duty = CCR / (ARR+1) (RM0440 §29.3.13, p.1179: tim_ocxref cao khi CNT < CCR). TIM1 ở APB2 với prescaler 1: TIM1CLK = PCLK2 = 170 MHz (RM p.281). 170e6 / 20e3 = 8500 nhịp ⇒ PSC = 0, ARR = 8499. 25 % × 8500 = 2125 ⇒ CCR1 = 2125. PA8 = AF6 = TIM1_CH1 (DS12288 Table 13, p.73). TIM1 là advanced timer: BDTR.MOE = 1 mới có ngõ ra (RM Table 282 p.1261, MOE p.1270). Clock GPIOA (AHB2ENR bit 0) và TIM1 (APB2ENR bit 11) phải bật trước khi ghi."
    evidence:
      - {"doc_id": "STM32G474_RM0440", "page": 1179, "contains": ["high as long as TIMx_CNT < TIMx_CCRx"]}
      - {"doc_id": "STM32G474_Datasheet", "page": 73, "contains": ["PA8 MCO - I2C3_SCL - I2C2_SDA I2S2_MCK TIM1_CH1"]}
      - {"doc_id": "STM32G474_RM0440", "page": 1270, "contains": ["Bit 15 MOE: Main output enable"]}
    wrong_variants:
      - name: forgot_moe
        patches: [{"find": "    TIM1->BDTR |= TIM_BDTR_MOE;", "replace": ""}]
        expect: ["sim_violation:SIM-TIM-MOE"]
      - name: wrong_af2
        patches: [{"find": "(6U << GPIO_AFRH_AFSEL8_Pos)", "replace": "(2U << GPIO_AFRH_AFSEL8_Pos)"}]
        expect: ["sim_violation:SIM-GPIO-AF"]
      - name: psc_off_by_one
        patches: [{"find": "TIM1->PSC = 0;", "replace": "TIM1->PSC = 1;"}]
        expect: ["wrong_freq"]
      - name: no_tim1_clock
        patches: [{"find": "    RCC->APB2ENR |= RCC_APB2ENR_TIM1EN;", "replace": ""}]
        expect: ["sim_violation:SIM-CLK-GATE"]
      - name: afr_shift_by_four
        patches: [{"find": "(6U << GPIO_AFRH_AFSEL8_Pos)", "replace": "(6U << 4)"}]
        expect: ["sim_violation:SIM-GPIO-AF"]

