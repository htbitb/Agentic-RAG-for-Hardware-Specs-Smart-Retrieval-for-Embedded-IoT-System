  expected:
    initial: "sysclk_170mhz_pll_hsi16_apb2_div2"
    spec:
      - {"type": "pwm", "pin": "PC6", "freq_hz": 10000, "duty_pct": 40, "tol_pct": 1}
  graders: [functional_sim, compile]
  review_status: verified
  provenance:
    authored_by: "session P2 (Claude Sonnet 5.5); lời giải và phép tính tay độc lập với simulator"
    review: {by: "independent model review (Claude Opus, fresh context)", date: "2026-10-22", report: "plan/reviews/review_C3.md", change: "sửa theo review: PLLREN, khoá ghi khi đang bật, khung UART/kernel clock/over8, dải I2C theo tSYNC, SCLDEL/SDADEL theo RM, trang trích dẫn, lọc violation theo spec"}
    reference_solution: |
      #include "stm32g4xx.h"

      int main(void)
      {
          RCC->AHB2ENR |= RCC_AHB2ENR_GPIOCEN;                /* clock of the GPIO port */
          RCC->APB2ENR |= RCC_APB2ENR_TIM8EN;                 /* clock of the timer (writes to a clock-gated peripheral are lost) */

          GPIOC->MODER = (GPIOC->MODER & ~GPIO_MODER_MODE6) | GPIO_MODER_MODE6_1;      /* alternate function mode */
          GPIOC->AFR[0] = (GPIOC->AFR[0] & ~GPIO_AFRL_AFSEL6) | (4U << GPIO_AFRL_AFSEL6_Pos);   /* AF4 */

          TIM8->PSC = 0;
          TIM8->ARR = 16999;
          TIM8->CCR1 = 6800;
          TIM8->CCMR1 = (TIM8->CCMR1 & ~TIM_CCMR1_OC1M) | (6U << TIM_CCMR1_OC1M_Pos) | TIM_CCMR1_OC1PE;   /* PWM mode 1 + preload */
          TIM8->CCER |= TIM_CCER_CC1E;
          TIM8->BDTR |= TIM_BDTR_MOE;                              /* main output enable */
