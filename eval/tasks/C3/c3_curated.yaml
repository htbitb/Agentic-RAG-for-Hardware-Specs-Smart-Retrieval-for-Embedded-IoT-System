          I2C3->TIMINGR = (15U << I2C_TIMINGR_PRESC_Pos) | (13U << I2C_TIMINGR_SCLDEL_Pos) | (3U << I2C_TIMINGR_SDADEL_Pos) | (45U << I2C_TIMINGR_SCLH_Pos) | (59U << I2C_TIMINGR_SCLL_Pos);
          I2C3->CR1 |= I2C_CR1_PE;

          while (1) { }
      }
    reference_calc: "Công thức RM0440 §39.4.9 (p.1645): tSCL = tSYNC1 + tSYNC2 + [(SCLH+1) + (SCLL+1)] × (PRESC+1) × tI2CCLK, với tSYNC1 + tSYNC2 ≥ 4 × tI2CCLK (Table 360 chú thích, p.1657). TIMINGR: PRESC [31:28], SCLDEL [23:20], SDADEL [19:16], SCLH [15:8], SCLL [7:0] (p.1681). I2C3SEL = 01 (RCC_CCIPR bits 17:16, RM p.323) ⇒ fI2CCLK = 170 MHz, tI2CCLK = 5,882 ns. Chọn PRESC = 15: tPRESC = 16 × 5,882 = 94,12 ns. Cần (SCLL+1) + (SCLH+1) = (10 µs − 4 × 5,882 ns) / 94,12 ns = 106,0. SCLL = 59 ⇒ tLOW = 60 × 94,12 = 5,647 µs (≥ 4,7 µs), SCLH = 45 ⇒ tHIGH = 46 × 94,12 = 4,329 µs (≥ 4,0 µs): tổng 106 ⇒ tSCL = 9976,5 + 23,5 = 10000 ns ⇒ 100,00 kHz. SCLDEL ≥ [tr(max) + tSU;DAT(min)] / tPRESC − 1 = (1000 + 250) / 94,12 − 1 = 12,3 ⇒ 13 và SDADEL ≥ [tf(max) + tHD;DAT(min) − tAF(min) − (DNF+3) × tI2CCLK] / tPRESC = (300 + 0 − 50 − 17,6) / 94,12 = 2,5 ⇒ 3 (tLOW ≈ 5,65 + 0,012 µs ≥ 4,7; tHIGH ≈ 4,33 + 0,012 µs ≥ 4,0 theo Table 358 p.1647) (RM p.1631–1632, Table 356 p.1632: Sm tr = 1000 ns, tf = 300 ns, tSU;DAT = 250 ns). Nếu quên I2C3SEL thì nguồn là PCLK1 = 85 MHz ⇒ cùng TIMINGR cho 50 kHz. PA8 = AF2 = I2C3_SCL (DS p.73), PC9 = AF8 = I2C3_SDA (DS p.75; AF2 của PC9 không có I2C)."
