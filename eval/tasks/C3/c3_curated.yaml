        patches: [{"find": "    TIM2->CR1 |= TIM_CR1_CEN;", "replace": ""}]
        expect: ["sim_violation:SIM-TIM-CEN"]

- id: C3-004
  category: C3
  split: test
  difficulty: hard
  chips: [stm32g474]
  tags: [pwm, general_timer, prescaler]
  turns:
    - user: "Write bare-metal C for the STM32G474 that accesses registers the CMSIS way (e.g. `TIM1->PSC = ...;`, `RCC->APB2ENR |= RCC_APB2ENR_TIM1EN;`) using the register and bit names of ST's `stm32g4xx.h` device header. Do not use HAL or LL drivers, `SystemCoreClock` or any other library function; write clock frequencies as numeric constants. Do not use interrupts; busy-wait loops on status flags are fine. Initial state: SYSCLK = HCLK = PCLK1 = PCLK2 = 170 MHz (PLL fed by HSI16, AHB/APB1/APB2 prescalers = 1, voltage Range 1 boost mode, Flash wait states already set). Every peripheral clock that is off at reset is still off, and all GPIO pins are in their reset state. Task: on the STM32G474, generate a 500 Hz PWM signal with a 30 % duty cycle on pin PA6 using TIM3 channel 1 (TIM3 has a 16-bit counter). The PWM frequency must be within ±1 % and the duty cycle (high time / period) within ±1 percentage point; edge-aligned PWM mode 1, active-high output, no dead time, no interrupts. Answer with one complete C code block (`#include \"stm32g4xx.h\"`, then a `main()` that configures everything and finally loops forever with `while (1)`), followed by a short explanation."
  expected:
    initial: "sysclk_170mhz_pll_hsi16_apb_div1"
    spec:
      - {"type": "pwm", "pin": "PA6", "freq_hz": 500, "duty_pct": 30, "tol_pct": 1}
  graders: [functional_sim, compile]
  review_status: verified
  provenance:
    authored_by: "session P2 (Claude Sonnet 5.5); lời giải và phép tính tay độc lập với simulator"
    review: {by: "independent model review (Claude Opus, fresh context)", date: "2026-10-22", report: "plan/reviews/review_C3.md", change: "sửa theo review: PLLREN, khoá ghi khi đang bật, khung UART/kernel clock/over8, dải I2C theo tSYNC, SCLDEL/SDADEL theo RM, trang trích dẫn, lọc violation theo spec"}
    reference_solution: |
      #include "stm32g4xx.h"

      int main(void)
      {
          RCC->AHB2ENR |= RCC_AHB2ENR_GPIOAEN;                /* clock of the GPIO port */
          RCC->APB1ENR1 |= RCC_APB1ENR1_TIM3EN;                 /* clock of the timer (writes to a clock-gated peripheral are lost) */

          GPIOA->MODER = (GPIOA->MODER & ~GPIO_MODER_MODE6) | GPIO_MODER_MODE6_1;      /* alternate function mode */
          GPIOA->AFR[0] = (GPIOA->AFR[0] & ~GPIO_AFRL_AFSEL6) | (2U << GPIO_AFRL_AFSEL6_Pos);   /* AF2 */

          TIM3->PSC = 7;
          TIM3->ARR = 42499;
          TIM3->CCR1 = 12750;
          TIM3->CCMR1 = (TIM3->CCMR1 & ~TIM_CCMR1_OC1M) | (6U << TIM_CCMR1_OC1M_Pos) | TIM_CCMR1_OC1PE;   /* PWM mode 1 + preload */
          TIM3->CCER |= TIM_CCER_CC1E;
          TIM3->CR1 |= TIM_CR1_ARPE;
          TIM3->EGR = TIM_EGR_UG;                                  /* load the shadow registers before starting */
          TIM3->CR1 |= TIM_CR1_CEN;

          while (1) { }
      }
    reference_calc: "Phép tính tay: f_PWM = f_TIMxCLK / ((PSC+1)(ARR+1)) và duty = CCR / (ARR+1) (RM0440 §29.3.13, p.1179: tim_ocxref cao khi CNT < CCR). TIM3CLK = 170 MHz. 170e6 / 500 = 340000 nhịp > 65536 ⇒ cần PSC. Điều kiện (PSC+1)(ARR+1) = 340000 và ARR+1 ≤ 65536 ⇒ PSC+1 ≥ 5,19. 340000 = 2⁵·5⁴·17; ước nhỏ nhất ≥ 6 là 8 (6 và 7 không chia hết) ⇒ PSC = 7, ARR+1 = 42500 ⇒ ARR = 42499; CCR1 = 30 % × 42500 = 12750. PA6 = AF2 = TIM3_CH1 (DS p.73; AF1 là TIM16_CH1)."
    evidence:
      - {"doc_id": "STM32G474_RM0440", "page": 1179, "contains": ["high as long as TIMx_CNT < TIMx_CCRx"]}
      - {"doc_id": "STM32G474_Datasheet", "page": 73, "contains": ["PA6 - TIM16_CH1 TIM3_CH1"]}
    wrong_variants:
      - name: no_prescaler_16bit_overflow
        patches: [{"find": "TIM3->PSC = 7;", "replace": "TIM3->PSC = 0;"}, {"find": "TIM3->ARR = 42499;", "replace": "TIM3->ARR = 339999;"}, {"find": "TIM3->CCR1 = 12750;", "replace": "TIM3->CCR1 = 102000;"}]
        expect: ["sim_violation:SIM-TIM-RANGE"]
      - name: arr_clamped_to_65535
        patches: [{"find": "TIM3->PSC = 7;", "replace": "TIM3->PSC = 0;"}, {"find": "TIM3->ARR = 42499;", "replace": "TIM3->ARR = 65535;"}]
        expect: ["wrong_freq"]
      - name: af1_is_tim16
        patches: [{"find": "(2U << GPIO_AFRL_AFSEL6_Pos)", "replace": "(1U << GPIO_AFRL_AFSEL6_Pos)"}]
        expect: ["sim_violation:SIM-GPIO-AF"]

- id: C3-005
  category: C3
