      #include "stm32g4xx.h"

      int main(void)
      {
          RCC->AHB2ENR |= RCC_AHB2ENR_GPIOAEN | RCC_AHB2ENR_GPIOCEN;
          RCC->APB1ENR1 |= RCC_APB1ENR1_I2C3EN;
          RCC->CCIPR = (RCC->CCIPR & ~RCC_CCIPR_I2C3SEL) | (1U << RCC_CCIPR_I2C3SEL_Pos);      /* 01: SYSCLK */

          GPIOA->MODER = (GPIOA->MODER & ~GPIO_MODER_MODE8) | GPIO_MODER_MODE8_1;
          GPIOA->OTYPER |= GPIO_OTYPER_OT8;
          GPIOA->AFR[1] = (GPIOA->AFR[1] & ~GPIO_AFRH_AFSEL8) | (2U << GPIO_AFRH_AFSEL8_Pos);   /* PA8: AF2 = I2C3_SCL */
          GPIOC->MODER = (GPIOC->MODER & ~GPIO_MODER_MODE9) | GPIO_MODER_MODE9_1;
          GPIOC->OTYPER |= GPIO_OTYPER_OT9;
          GPIOC->AFR[1] = (GPIOC->AFR[1] & ~GPIO_AFRH_AFSEL9) | (8U << GPIO_AFRH_AFSEL9_Pos);   /* PC9: AF8 = I2C3_SDA */

          /* fI2CCLK = 170 MHz, PRESC = 15 (tPRESC = 16/170 MHz = 94.1 ns), SCLL = 59 (60 x 94.1 = 5.65 us), SCLH = 45 (46 x 94.1 = 4.33 us);
