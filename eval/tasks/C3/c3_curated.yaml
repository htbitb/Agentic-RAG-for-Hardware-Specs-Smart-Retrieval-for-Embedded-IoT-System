    reference_solution: |
      #include "stm32g4xx.h"

      int main(void)
      {
          RCC->AHB2ENR |= RCC_AHB2ENR_GPIOAEN;                /* clock of the GPIO port */
          RCC->APB2ENR |= RCC_APB2ENR_TIM1EN;                 /* clock of the timer (writes to a clock-gated peripheral are lost) */

          GPIOA->MODER = (GPIOA->MODER & ~GPIO_MODER_MODE8) | GPIO_MODER_MODE8_1;      /* alternate function mode */
          GPIOA->AFR[1] = (GPIOA->AFR[1] & ~GPIO_AFRH_AFSEL8) | (6U << GPIO_AFRH_AFSEL8_Pos);   /* AF6 */
          GPIOA->MODER = (GPIOA->MODER & ~GPIO_MODER_MODE9) | GPIO_MODER_MODE9_1;      /* alternate function mode */
          GPIOA->AFR[1] = (GPIOA->AFR[1] & ~GPIO_AFRH_AFSEL9) | (6U << GPIO_AFRH_AFSEL9_Pos);   /* AF6 */

          TIM1->PSC = 0;
          TIM1->ARR = 8499;
          TIM1->CCR1 = 2125;
          TIM1->CCR2 = 6375;
          TIM1->CCMR1 = (TIM1->CCMR1 & ~TIM_CCMR1_OC1M) | (6U << TIM_CCMR1_OC1M_Pos) | TIM_CCMR1_OC1PE;   /* PWM mode 1 + preload */
          TIM1->CCMR1 = (TIM1->CCMR1 & ~TIM_CCMR1_OC2M) | (6U << TIM_CCMR1_OC2M_Pos) | TIM_CCMR1_OC2PE;   /* PWM mode 1 + preload */
          TIM1->CCER |= TIM_CCER_CC1E | TIM_CCER_CC2E;
          TIM1->BDTR |= TIM_BDTR_MOE;                              /* main output enable */
          TIM1->CR1 |= TIM_CR1_ARPE;
          TIM1->EGR = TIM_EGR_UG;                                  /* load the shadow registers before starting */
          TIM1->CR1 |= TIM_CR1_CEN;

          while (1) { }
      }
    reference_calc: "Phép tính tay: f_PWM = f_TIMxCLK / ((PSC+1)(ARR+1)) và duty = CCR / (ARR+1) (RM0440 §29.3.13, p.1179: tim_ocxref cao khi CNT < CCR). Cả hai kênh dùng chung PSC = 0, ARR = 8499 (170e6/20e3 = 8500 nhịp). CCR1 = 25 % × 8500 = 2125, CCR2 = 75 % × 8500 = 6375. PA8 = AF6 = TIM1_CH1, PA9 = AF6 = TIM1_CH2 (DS p.73). Cần CC1E và CC2E trong TIMx_CCER, OC1M/OC2M trong TIMx_CCMR1 (OC2M ở bit [14:12], OC2PE bit 11) và một MOE chung."
    evidence:
      - {"doc_id": "STM32G474_RM0440", "page": 1179, "contains": ["high as long as TIMx_CNT < TIMx_CCRx"]}
      - {"doc_id": "STM32G474_Datasheet", "page": 73, "contains": ["PA9 - - I2C3_SMBA - I2C2_SCL I2S3_MCK TIM1_CH2 USART1_TX"]}
    wrong_variants:
      - name: forgot_cc2e
        patches: [{"find": "TIM1->CCER |= TIM_CCER_CC1E | TIM_CCER_CC2E;", "replace": "TIM1->CCER |= TIM_CCER_CC1E;"}]
        expect: ["sim_violation:SIM-TIM-CCE"]
      - name: pa9_not_alternate_function
        patches: [{"find": "GPIO_MODER_MODE9_1", "replace": "GPIO_MODER_MODE9_0"}]
        expect: ["sim_violation:SIM-GPIO-MODE"]
      - name: same_duty_on_both
        patches: [{"find": "TIM1->CCR2 = 6375;", "replace": "TIM1->CCR2 = 2125;"}]
        expect: ["wrong_duty"]

