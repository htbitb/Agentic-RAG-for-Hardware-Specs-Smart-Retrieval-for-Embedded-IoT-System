  graders: [functional_sim, compile]
  review_status: verified
  provenance:
    authored_by: "session P2 (Claude Sonnet 5.5); lời giải và phép tính tay độc lập với simulator"
    review: {by: "independent model review (Claude Opus, fresh context)", date: "2026-10-22", report: "plan/reviews/review_C3.md", change: "sửa theo review: PLLREN, khoá ghi khi đang bật, khung UART/kernel clock/over8, dải I2C theo tSYNC, SCLDEL/SDADEL theo RM, trang trích dẫn, lọc violation theo spec"}
    reference_solution: |
      #include "stm32g4xx.h"

      int main(void)
      {
          RCC->AHB2ENR |= RCC_AHB2ENR_GPIOAEN;                /* clock of the GPIO port */
          RCC->APB1ENR1 |= RCC_APB1ENR1_TIM2EN;                 /* clock of the timer (writes to a clock-gated peripheral are lost) */

          GPIOA->MODER = (GPIOA->MODER & ~GPIO_MODER_MODE0) | GPIO_MODER_MODE0_1;      /* alternate function mode */
          GPIOA->AFR[0] = (GPIOA->AFR[0] & ~GPIO_AFRL_AFSEL0) | (1U << GPIO_AFRL_AFSEL0_Pos);   /* AF1 */

          TIM2->PSC = 0;
          TIM2->ARR = 169999;
          TIM2->CCR1 = 85000;
          TIM2->CCMR1 = (TIM2->CCMR1 & ~TIM_CCMR1_OC1M) | (6U << TIM_CCMR1_OC1M_Pos) | TIM_CCMR1_OC1PE;   /* PWM mode 1 + preload */
          TIM2->CCER |= TIM_CCER_CC1E;
          TIM2->CR1 |= TIM_CR1_ARPE;
          TIM2->EGR = TIM_EGR_UG;                                  /* load the shadow registers before starting */
          TIM2->CR1 |= TIM_CR1_CEN;

          while (1) { }
      }
    reference_calc: "Phép tính tay: f_PWM = f_TIMxCLK / ((PSC+1)(ARR+1)) và duty = CCR / (ARR+1) (RM0440 §29.3.13, p.1179: tim_ocxref cao khi CNT < CCR). TIM2 ở APB1 (prescaler 1): TIM2CLK = 170 MHz. 170e6 / 1e3 = 170000 nhịp. TIM2 là bộ đếm 32 bit (RM p.1387–1389: ARR[31:0]) nên PSC = 0, ARR = 169999, CCR1 = 50 % × 170000 = 85000. PA0 = AF1 = TIM2_CH1 (DS p.73). TIM2 không có BDTR/MOE (timer đa dụng)."
