- id: C3-018
  category: C3
  split: test
  difficulty: hard
  chips: [stm32g474]
  tags: [pll, sysclk_170, boost_mode]
  turns:
    - user: "Write bare-metal C for the STM32G474 that accesses registers the CMSIS way (e.g. `TIM1->PSC = ...;`, `RCC->APB2ENR |= RCC_APB2ENR_TIM1EN;`) using the register and bit names of ST's `stm32g4xx.h` device header. Do not use HAL or LL drivers, `SystemCoreClock` or any other library function; write clock frequencies as numeric constants. Do not use interrupts; busy-wait loops on status flags are fine. Initial state: the chip has just come out of reset: SYSCLK = HCLK = PCLK1 = PCLK2 = 16 MHz (HSI16), all prescalers are 1, no peripheral clock beyond the reset defaults is enabled, and all GPIO pins are in their reset state. Task: configure the clock tree so that SYSCLK = HCLK = PCLK1 = PCLK2 = 170 MHz, using the PLL fed by HSI16 (AHB, APB1 and APB2 prescalers = 1). The resulting clock frequencies must be accurate to within 0.1 %; wait for each oscillator/PLL to be ready before using it and for the clock switch to take effect (busy-wait on the status flags). Answer with one complete C code block (`#include \"stm32g4xx.h\"`, then a `main()` that configures everything and finally loops forever with `while (1)`), followed by a short explanation."
  expected:
    initial: "reset"
    spec:
      - {"type": "clock", "sysclk_hz": 170000000, "hclk_hz": 170000000, "pclk1_hz": 170000000, "pclk2_hz": 170000000, "tol_pct": 0.1}
  graders: [functional_sim, compile]
  review_status: verified
  provenance:
    authored_by: "session P2 (Claude Sonnet 5.5); lời giải và phép tính tay độc lập với simulator"
    review: {by: "independent model review (Claude Opus, fresh context)", date: "2026-10-22", report: "plan/reviews/review_C3.md", change: "sửa theo review: PLLREN, khoá ghi khi đang bật, khung UART/kernel clock/over8, dải I2C theo tSYNC, SCLDEL/SDADEL theo RM, trang trích dẫn, lọc violation theo spec"}
    reference_solution: |
      #include "stm32g4xx.h"

      int main(void)
      {
          RCC->APB1ENR1 |= RCC_APB1ENR1_PWREN;
          (void)RCC->APB1ENR1;                                           /* dummy read: delay before the first PWR access (RM0440 p.285) */
          PWR->CR5 &= ~PWR_CR5_R1MODE;                                   /* Range 1 boost mode: needed above 150 MHz (reset value: normal mode) */
          FLASH->ACR = (FLASH->ACR & ~FLASH_ACR_LATENCY) | FLASH_ACR_LATENCY_4WS;

          /* HSI16 / 4 = 4 MHz, x 85 = 340 MHz VCO, / 2 = 170 MHz */
          RCC->PLLCFGR = RCC_PLLCFGR_PLLSRC_HSI | (3U << RCC_PLLCFGR_PLLM_Pos) | (85U << RCC_PLLCFGR_PLLN_Pos) | RCC_PLLCFGR_PLLREN;
          RCC->CR |= RCC_CR_PLLON;
          while (!(RCC->CR & RCC_CR_PLLRDY)) { }

          RCC->CFGR = (RCC->CFGR & ~RCC_CFGR_HPRE) | RCC_CFGR_HPRE_DIV2;    /* AHB / 2 while switching above 150 MHz */
          RCC->CFGR = (RCC->CFGR & ~RCC_CFGR_SW) | RCC_CFGR_SW_PLL;
          while ((RCC->CFGR & RCC_CFGR_SWS) != RCC_CFGR_SWS_PLL) { }
          for (volatile int i = 0; i < 100; i++) { }                         /* wait >= 1 us before restoring the AHB prescaler (RM0440 p.280) */
          RCC->CFGR = (RCC->CFGR & ~RCC_CFGR_HPRE) | RCC_CFGR_HPRE_DIV1;    /* back to HCLK = SYSCLK */

          while (1) { }
      }
    reference_calc: "PLL (RM0440 §7.4.4, p.291–293): f_VCO = f_in × PLLN / PLLM; f_PLLR = f_VCO / PLLR; PLLM mã hoá M−1 (0000 = /1), PLLR[1:0] = 00 ⇒ /2, PLLSRC = 10 HSI16 / 11 HSE. Giới hạn (DS12288 Table 46, p.123): f_in sau chia M ∈ [2,66; 16] MHz, f_VCO ∈ [96; 344] MHz, SYSCLK ≤ 170 MHz (boost) / 150 MHz (R1MODE = 1). Wait state Flash (RM Table 9, p.98): ≤34/68/102/136/170 MHz cho 0..4 WS (boost); ≤30/60/90/120/150 MHz (normal). HSI16 = 16 MHz: M = 4 ⇒ 4 MHz (trong [2,66; 16]); N = 85 ⇒ VCO = 340 MHz (≤ 344); R = 2 ⇒ 170 MHz. Sau reset PWR_CR5.R1MODE = 1 (Range 1 normal, ≤ 150 MHz; RM p.267, Table 38 p.232) nên phải xoá R1MODE (cần bật PWREN, APB1ENR1 bit 28) trước khi chuyển lên 170 MHz; FLASH_ACR.LATENCY = 4 (170 MHz). Trước khi lên > 150 MHz RM (p.233) yêu cầu chia HCLK cho 2 rồi trả về /1 sau ≥ 1 µs (p.280); sau khi bật PWREN phải chờ một khoảng trước khi truy cập PWR (p.285) ⇒ đọc giả `RCC->APB1ENR1`. PLLREN (RCC_PLLCFGR bit 24) bật ngõ ra R của PLL dùng làm SYSCLK (RM p.292, bước 5 p.278)."
    evidence:
      - {"doc_id": "STM32G474_RM0440", "page": 291, "contains": ["f(VCO clock) = f(PLL clock input) × (PLLN / PLLM)"]}
      - {"doc_id": "STM32G474_RM0440", "page": 233, "contains": ["Select the Range 1 boost mode by clearing the R1MODE bit"]}
      - {"doc_id": "STM32G474_RM0440", "page": 98, "contains": ["4 WS (5 CPU cycles) ≤ 170 ≤ 150"]}
    wrong_variants:
      - name: forgot_boost_mode
        patches: [{"find": "    PWR->CR5 &= ~PWR_CR5_R1MODE;", "replace": ""}]
        expect: ["sim_violation:SIM-CLK-LIMIT"]
      - name: forgot_flash_latency
        patches: [{"find": "    FLASH->ACR = (FLASH->ACR & ~FLASH_ACR_LATENCY) | FLASH_ACR_LATENCY_4WS;", "replace": ""}]
        expect: ["sim_violation:SIM-FLASH-WS"]
      - name: forgot_pllren
        patches: [{"find": " | RCC_PLLCFGR_PLLREN;", "replace": ";"}]
        expect: ["sim_violation:SIM-CLK-NOSRC"]
      - name: n_86_gives_172mhz
        patches: [{"find": "(85U << RCC_PLLCFGR_PLLN_Pos)", "replace": "(86U << RCC_PLLCFGR_PLLN_Pos)"}]
        expect: ["sim_violation:SIM-CLK-LIMIT", "wrong_clock"]
      - name: forgot_pllon
        patches: [{"find": "    RCC->CR |= RCC_CR_PLLON;", "replace": ""}]
        expect: ["sim_violation:SIM-CLK-NOSRC"]

