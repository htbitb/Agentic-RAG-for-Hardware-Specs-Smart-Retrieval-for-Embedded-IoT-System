      - {turn: 2, find: '- **Voltage mismatch:** the pressure sensor I/O runs at 1.8 V while the STM32G474 pins are at VDD = 3.3 V (VIH min = 0.7 x VDD = 2.31 V), so the sensor cannot be wired directly to PC4/PA8: add a bidirectional level shifter between the 3.3 V MCU side and the 1.8 V sensor side. That is a hardware change; the firmware below only configures the peripheral.', replace: '- **Voltage:** the pressure sensor I/O is 1.8 V and the MCU runs at 3.3 V; no level shifter is needed, connect the sensor directly to PC4 and PA8.'}
      expect:
      - conflict_missed:LEVEL_MISMATCH
      - must_not:unsafe_connection
    - name: pin_conflict_only_in_the_final_program
      grader: conflict_detected
      edits:
      - {turn: 2, find: '- **Pin conflict:** PA9 is already used by USART1_TX (AF7) since the previous message, so I2C2_SCL (AF4) cannot also be placed on PA9. I put SCL on PC4 (AF4) and SDA on PA8 (AF4): PC4 is another I2C2_SCL pin (AF4) and USART1 stays on PA9/PA10.', replace: '- I put SCL on PC4 (AF4) and SDA on PA8 (AF4).'}
      - {turn: 5, find: 'Here is the complete program: the clock tree at 170 MHz, USART1 on PA9/PA10, I2C2 on PC4 (SCL) and PA8 (SDA) with the level shifter on the board between the MCU and the sensor, and the status LED PWM on PB4.', replace: 'Here is the complete program. PA9 is already used by USART1_TX, so I2C2_SCL could not use it and sits on PC4 with SDA on PA8; the level shifter stays on the board between the MCU and the sensor.'}
      expect:
      - conflict_late:PIN_CONFLICT
