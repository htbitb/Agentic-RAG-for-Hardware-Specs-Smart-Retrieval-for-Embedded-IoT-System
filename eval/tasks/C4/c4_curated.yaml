- id: C4-011
  category: C4
  split: dev
  difficulty: medium
  chips:
  - stm32g474
  tags:
  - timer_shared
  - pwm
  - uart
  turns:
  - user: 'I am designing the firmware of an STM32G474 board with you over several messages. Write bare-metal C that accesses registers the CMSIS way (e.g. `TIM1->PSC = ...;`, `RCC->APB2ENR |= RCC_APB2ENR_TIM1EN;`) using the register and bit names of ST''s `stm32g4xx.h` device header. Do not use HAL or LL drivers, `SystemCoreClock` or any other library function; write clock frequencies as numeric constants. Do not use interrupts; busy-wait loops on status flags are fine. Initial state: SYSCLK = HCLK = PCLK1 = PCLK2 = 170 MHz (PLL fed by HSI16, AHB/APB1/APB2 prescalers = 1, voltage Range 1 boost mode, Flash wait states already set); the board is powered at VDD = 3.3 V. Every peripheral clock that is off at reset is still off, and all GPIO pins are in their reset state. Answer every message with the relevant C code (in fenced C code blocks that follow these conventions) and a short explanation. Message 1: generate a 20 kHz PWM signal with a 40 % duty cycle on pin PA6 (TIM3 channel 1) to dim a status LED; edge-aligned PWM mode 1, active-high output, no dead time.'
  - user: 'Message 2: now add a buzzer driven by a 1 kHz PWM signal with a 50 % duty cycle on pin PA7 (TIM3 channel 2); edge-aligned PWM mode 1, active-high output, no dead time.'
  - user: 'Message 3: add a debug serial port on USART3 at 115200 baud with TX on pin PB10 and RX on pin PB11: 8 data bits, no parity, 1 stop bit, oversampling by 16, both directions enabled, and the baud-rate register written before the USART is enabled.'
  - user: 'Message 4: please give me the complete initialisation program for the whole design so far (the LED PWM, the buzzer PWM and USART3) as one C code block (`#include "stm32g4xx.h"`, then a `main()` that configures everything and finally loops forever with `while (1)`), followed by a short explanation.'
  expected:
    chip: stm32g474
    initial: sysclk_170mhz_pll_hsi16_apb_div1
    spec:
    - {type: pwm, pin: PA6, freq_hz: 20000, duty_pct: 40, tol_pct: 1}
    - {type: pwm, pin: PA7, freq_hz: 1000, duty_pct: 50, tol_pct: 1}
    - {type: uart, instance: USART3, baud: 115200, tol_pct: 2, tx_pin: PB10, rx_pin: PB11, frame: 8N1, te: true, re: true, over8: 0, require_pins: true}
    must_detect:
    - {code: 'TIMER_SHARED:TIM3', turn: 1, from_turn: 1}
  graders:
  - final_state
  - conflict_detected
  - compile
  review_status: verified
  provenance:
    authored_by: session P3 (Claude Sonnet 5.5); lời giải và phép tính tay độc lập với simulator và DRC
    conflict_facts:
    - {type: af, pin: PA6, signal: TIM3_CH1, af: 2}
    - {type: af, pin: PA7, signal: TIM3_CH2, af: 2}
    - {type: af, pin: PA7, signal: TIM17_CH1, af: 1}
    - {type: af, pin: PA6, signal: TIM16_CH1, af: 1}
    - {type: af, pin: PB10, signal: USART3_TX, af: 7}
    - {type: af, pin: PB11, signal: USART3_RX, af: 7}
    evidence:
    - {doc_id: STM32G474_Datasheet, page: 73, contains: [PA6 - TIM16_CH1 TIM3_CH1, PA7 - TIM17_CH1 TIM3_CH2 - TIM8_CH1N]}
    - {doc_id: STM32G474_Datasheet, page: 74, contains: [PB10 - TIM2_CH3 - - - - - USART3_TX, PB11 - TIM2_CH4 - - - - - USART3_RX]}
    - {doc_id: STM32G474_RM0440, page: 1294, contains: [The main block of the programmable timer is a 16-bit/32-bit counter with its related, Prescaler register (TIMx_PSC), Autoreload register (TIMx_ARR)]}
    - {doc_id: STM32G474_RM0440, page: 1319, contains: [high as long as TIMx_CNT <TIMx_CCRx]}
    - {doc_id: STM32G474_RM0440, page: 281, contains: [the timer clock frequencies are set to the same frequency of the APB]}
    - {doc_id: STM32G474_RM0440, page: 1404, contains: [The TIM15/TIM16/TIM17 timers consist of a 16-bit autoreload counter]}
    - {doc_id: STM32G474_RM0440, page: 1499, contains: ['Bit 15 MOE: Main output enable']}
    - {doc_id: STM32G474_RM0440, page: 1708, contains: ['When OVER8 = 0, BRR = USARTDIV.']}
    reference_calc: "Xung đột (timer dùng chung): TIM3_CH1 (PA6, AF2) và TIM3_CH2 (PA7, AF2) thuộc cùng một bộ đếm; PSC, ARR và CNT là của timer chứ không phải của kênh (RM0440 §30.4.3, p.1294: time-base unit gồm TIMx_CNT, TIMx_PSC, TIMx_ARR) nên mọi kênh của TIM3 cùng một tần số (chỉ duty khác nhau qua CCRx). LED cần 20 kHz, còi cần 1 kHz ⇒ không thể đặt cả hai trên TIM3. Sửa hợp lệ: còi sang TIM17_CH1 trên PA7 (AF1; DS12288 Table 13, p.73) hoặc LED sang TIM16_CH1 trên PA6 (AF1). LED: TIM3 ở APB1 prescaler 1 ⇒ TIM3CLK = PCLK1 = 170 MHz (RM p.281); 170e6 / 20e3 = 8500 nhịp ⇒ PSC = 0, ARR = 8499, CCR1 = 40 % × 8500 = 3400 (RM p.1319: tim_ocxref cao khi CNT < CCR). Còi: TIM17 ở APB2 prescaler 1 ⇒ 170 MHz; 170e6 / 1e3 = 170000 nhịp > 65536 (TIM17 là bộ đếm 16 bit, RM p.1404) ⇒ cần PSC; 170000 = 2⁴·5⁴·17 nên PSC+1 ≥ 170000/65536 = 2,59 ⇒ ước nhỏ nhất ≥ 3 là 4 ⇒ PSC = 3, ARR+1 = 42500 ⇒ ARR = 42499, CCR1 = 50 % × 42500 = 21250. TIM17 có BDTR ⇒ MOE = 1 (RM p.1499). USART3 (APB1, PCLK1 = 170 MHz, USART3SEL reset = PCLK1): USARTDIV = 170e6 / 115200 = 1475,69 ⇒ BRR = 1476 ⇒ baud thực = 170e6 / 1476 = 115176 (−0,02 %) (RM p.1708). PB10 = USART3_TX, PB11 = USART3_RX, AF7 (DS p.74). Clock: GPIOA/GPIOB = AHB2ENR bit 0/1, TIM3EN = APB1ENR1 bit 1, USART3EN = APB1ENR1 bit 18, TIM17EN = APB2ENR bit 18."
    reference_solution:
      turns:
      - |
        TIM3 channel 1 on PA6 (AF2): TIM3 sits on APB1 with prescaler 1, so TIM3CLK = 170 MHz and 170 MHz / 20 kHz = 8500 ticks, i.e. PSC = 0, ARR = 8499 and CCR1 = 40 % x 8500 = 3400. TIM3 is a general-purpose timer, so there is no BDTR.MOE to set.

        ```c
        #include "stm32g4xx.h"

        int main(void)
        {
            RCC->AHB2ENR |= RCC_AHB2ENR_GPIOAEN;
            RCC->APB1ENR1 |= RCC_APB1ENR1_TIM3EN;

            GPIOA->MODER = (GPIOA->MODER & ~GPIO_MODER_MODE6) | GPIO_MODER_MODE6_1;                 /* PA6: alternate function */
            GPIOA->AFR[0] = (GPIOA->AFR[0] & ~GPIO_AFRL_AFSEL6) | (2U << GPIO_AFRL_AFSEL6_Pos);     /* AF2 = TIM3_CH1 */

            TIM3->PSC = 0;
            TIM3->ARR = 8499;
            TIM3->CCR1 = 3400;
            TIM3->CCMR1 = (TIM3->CCMR1 & ~TIM_CCMR1_OC1M) | (6U << TIM_CCMR1_OC1M_Pos) | TIM_CCMR1_OC1PE;
            TIM3->CCER |= TIM_CCER_CC1E;
            TIM3->CR1 |= TIM_CR1_ARPE;
            TIM3->EGR = TIM_EGR_UG;
            TIM3->CR1 |= TIM_CR1_CEN;

            while (1) { }
        }
        ```
      - |
        **Timer conflict:** TIM3_CH2 on PA7 (AF2) cannot give the buzzer 1 kHz, because TIM3 already generates the 20 kHz LED signal on channel 1 and the channels of one timer share a single counter, prescaler and auto-reload value, so TIM3 cannot run channel 2 at a different frequency. I keep the LED on TIM3_CH1 and drive the buzzer from TIM17 channel 1, which is also available on PA7 (AF1).

        TIM17 sits on APB2 (prescaler 1), so TIM17CLK = 170 MHz. 170 MHz / 1 kHz = 170000 ticks, more than the 16-bit counter of TIM17 can hold (65536), so the prescaler is needed: PSC = 3 (divide by 4), ARR = 42499 (42500 ticks) and CCR1 = 50 % x 42500 = 21250. TIM17 has a BDTR register, so BDTR.MOE must be set.

        ```c
        RCC->AHB2ENR |= RCC_AHB2ENR_GPIOAEN;
        RCC->APB2ENR |= RCC_APB2ENR_TIM17EN;
        GPIOA->MODER = (GPIOA->MODER & ~GPIO_MODER_MODE7) | GPIO_MODER_MODE7_1;
        GPIOA->AFR[0] = (GPIOA->AFR[0] & ~GPIO_AFRL_AFSEL7) | (1U << GPIO_AFRL_AFSEL7_Pos);     /* AF1 = TIM17_CH1 */
        TIM17->PSC = 3;
        TIM17->ARR = 42499;
        TIM17->CCR1 = 21250;
        TIM17->CCMR1 = (TIM17->CCMR1 & ~TIM_CCMR1_OC1M) | (6U << TIM_CCMR1_OC1M_Pos) | TIM_CCMR1_OC1PE;
        TIM17->CCER |= TIM_CCER_CC1E;
        TIM17->BDTR |= TIM_BDTR_MOE;
        TIM17->CR1 |= TIM_CR1_ARPE;
        TIM17->EGR = TIM_EGR_UG;
        TIM17->CR1 |= TIM_CR1_CEN;
        ```
      - |
        USART3 sits on APB1, so its kernel clock is PCLK1 = 170 MHz (USART3SEL = PCLK1 at reset). With OVER8 = 0, USARTDIV = 170 MHz / 115200 = 1475.69, so BRR = 1476 (115176 baud, -0.02 %); BRR is written while UE = 0. PB10 = USART3_TX and PB11 = USART3_RX are both AF7, and neither pin is used by the PWM outputs.

        ```c
        RCC->AHB2ENR |= RCC_AHB2ENR_GPIOBEN;
        RCC->APB1ENR1 |= RCC_APB1ENR1_USART3EN;
        GPIOB->MODER = (GPIOB->MODER & ~(GPIO_MODER_MODE10 | GPIO_MODER_MODE11)) | GPIO_MODER_MODE10_1 | GPIO_MODER_MODE11_1;
        GPIOB->AFR[1] = (GPIOB->AFR[1] & ~(GPIO_AFRH_AFSEL10 | GPIO_AFRH_AFSEL11)) | (7U << GPIO_AFRH_AFSEL10_Pos) | (7U << GPIO_AFRH_AFSEL11_Pos);   /* AF7 */
        USART3->BRR = 1476;
        USART3->CR1 = USART_CR1_UE | USART_CR1_TE | USART_CR1_RE;
        ```
      - |
        Here is the complete program: the LED on TIM3_CH1 (PA6), the buzzer on TIM17_CH1 (PA7) and USART3 on PB10/PB11.

        ```c
        #include "stm32g4xx.h"

        int main(void)
        {
            RCC->AHB2ENR |= RCC_AHB2ENR_GPIOAEN | RCC_AHB2ENR_GPIOBEN;
            RCC->APB1ENR1 |= RCC_APB1ENR1_TIM3EN | RCC_APB1ENR1_USART3EN;
            RCC->APB2ENR |= RCC_APB2ENR_TIM17EN;

            /* LED: PA6 = TIM3_CH1 (AF2), 20 kHz, 40 % */
            GPIOA->MODER = (GPIOA->MODER & ~GPIO_MODER_MODE6) | GPIO_MODER_MODE6_1;
            GPIOA->AFR[0] = (GPIOA->AFR[0] & ~GPIO_AFRL_AFSEL6) | (2U << GPIO_AFRL_AFSEL6_Pos);
            TIM3->PSC = 0;
            TIM3->ARR = 8499;
            TIM3->CCR1 = 3400;
            TIM3->CCMR1 = (TIM3->CCMR1 & ~TIM_CCMR1_OC1M) | (6U << TIM_CCMR1_OC1M_Pos) | TIM_CCMR1_OC1PE;
            TIM3->CCER |= TIM_CCER_CC1E;
            TIM3->CR1 |= TIM_CR1_ARPE;
            TIM3->EGR = TIM_EGR_UG;
            TIM3->CR1 |= TIM_CR1_CEN;

            /* buzzer: PA7 = TIM17_CH1 (AF1), 1 kHz, 50 % */
            GPIOA->MODER = (GPIOA->MODER & ~GPIO_MODER_MODE7) | GPIO_MODER_MODE7_1;
            GPIOA->AFR[0] = (GPIOA->AFR[0] & ~GPIO_AFRL_AFSEL7) | (1U << GPIO_AFRL_AFSEL7_Pos);
            TIM17->PSC = 3;
            TIM17->ARR = 42499;
            TIM17->CCR1 = 21250;
            TIM17->CCMR1 = (TIM17->CCMR1 & ~TIM_CCMR1_OC1M) | (6U << TIM_CCMR1_OC1M_Pos) | TIM_CCMR1_OC1PE;
            TIM17->CCER |= TIM_CCER_CC1E;
            TIM17->BDTR |= TIM_BDTR_MOE;
            TIM17->CR1 |= TIM_CR1_ARPE;
            TIM17->EGR = TIM_EGR_UG;
            TIM17->CR1 |= TIM_CR1_CEN;

            /* USART3: PB10 = TX, PB11 = RX (AF7), 115200 8N1 */
            GPIOB->MODER = (GPIOB->MODER & ~(GPIO_MODER_MODE10 | GPIO_MODER_MODE11)) | GPIO_MODER_MODE10_1 | GPIO_MODER_MODE11_1;
            GPIOB->AFR[1] = (GPIOB->AFR[1] & ~(GPIO_AFRH_AFSEL10 | GPIO_AFRH_AFSEL11)) | (7U << GPIO_AFRH_AFSEL10_Pos) | (7U << GPIO_AFRH_AFSEL11_Pos);
            USART3->BRR = 1476;
            USART3->CR1 = USART_CR1_UE | USART_CR1_TE | USART_CR1_RE;

            while (1) { }
        }
        ```
    wrong_variants:
    - name: buzzer_kept_on_tim3_ch2
      grader: final_state
      edits:
      - {turn: 3, find: 'GPIOA->AFR[0] = (GPIOA->AFR[0] & ~GPIO_AFRL_AFSEL7) | (1U << GPIO_AFRL_AFSEL7_Pos);', replace: 'GPIOA->AFR[0] = (GPIOA->AFR[0] & ~GPIO_AFRL_AFSEL7) | (2U << GPIO_AFRL_AFSEL7_Pos);'}
      - turn: 3
        find: |-
          TIM17->PSC = 3;
              TIM17->ARR = 42499;
              TIM17->CCR1 = 21250;
        replace: TIM3->CCR2 = 4250;
      - turn: 3
        find: |-
          TIM17->CCMR1 = (TIM17->CCMR1 & ~TIM_CCMR1_OC1M) | (6U << TIM_CCMR1_OC1M_Pos) | TIM_CCMR1_OC1PE;
              TIM17->CCER |= TIM_CCER_CC1E;
              TIM17->BDTR |= TIM_BDTR_MOE;
              TIM17->CR1 |= TIM_CR1_ARPE;
              TIM17->EGR = TIM_EGR_UG;
              TIM17->CR1 |= TIM_CR1_CEN;
        replace: |-
          TIM3->CCMR1 = (TIM3->CCMR1 & ~TIM_CCMR1_OC2M) | (6U << TIM_CCMR1_OC2M_Pos) | TIM_CCMR1_OC2PE;
              TIM3->CCER |= TIM_CCER_CC2E;
      expect:
      - wrong_freq
    - name: forgot_moe_on_tim17
      grader: final_state
      edits:
      - {turn: 3, find: TIM17->BDTR |= TIM_BDTR_MOE;, replace: ''}
      expect:
      - sim_violation:SIM-TIM-MOE
    - name: tim17_16bit_overflow_without_prescaler
      grader: final_state
      edits:
      - {turn: 3, find: TIM17->PSC = 3;, replace: TIM17->PSC = 0;}
      - {turn: 3, find: TIM17->ARR = 42499;, replace: TIM17->ARR = 169999;}
      - {turn: 3, find: TIM17->CCR1 = 21250;, replace: TIM17->CCR1 = 85000;}
      expect:
      - sim_violation:SIM-TIM-RANGE
    - name: forgot_gpiob_clock
      grader: final_state
      edits:
      - {turn: 3, find: RCC->AHB2ENR |= RCC_AHB2ENR_GPIOAEN | RCC_AHB2ENR_GPIOBEN;, replace: RCC->AHB2ENR |= RCC_AHB2ENR_GPIOAEN;}
      expect:
      - sim_violation:SIM-CLK-GATE
    - name: usart_baud_computed_for_16mhz
      grader: final_state
      edits:
      - {turn: 3, find: USART3->BRR = 1476;, replace: USART3->BRR = 139;}
      expect:
      - wrong_baud
    - name: silent_about_the_shared_timer
      grader: conflict_detected
      edits:
