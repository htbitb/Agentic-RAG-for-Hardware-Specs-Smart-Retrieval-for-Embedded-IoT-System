    evidence:
    - {doc_id: STM32G474_Datasheet, page: 73, contains: [PA8 MCO - I2C3_SCL - I2C2_SDA I2S2_MCK TIM1_CH1, PA9 - - I2C3_SMBA - I2C2_SCL I2S3_MCK TIM1_CH2 USART1_TX, PA10 - TIM17_BKIN - USB_CRS_SYNC I2C2_SMBA SPI2_MISO TIM1_CH3 USART1_RX]}
    - {doc_id: STM32G474_Datasheet, page: 75, contains: [PC4 - - TIM1_ETR - I2C2_SCL -- USART1_TX]}
    - {doc_id: STM32G474_Datasheet, page: 74, contains: [PB6 - TIM16_CH1N TIM4_CH1 - - TIM8_CH1 TIM8_ETR USART1_TX]}
    - {doc_id: STM32G474_Datasheet, page: 171, contains: [tAF Maximum pulse width of spikes that are suppressed by the analog filter 50(2), Spikes with widths above t AF(max) are not filtered]}
    - {doc_id: STM32G474_RM0440, page: 1708, contains: ['When OVER8 = 0, BRR = USARTDIV.']}
    - {doc_id: STM32G474_RM0440, page: 324, contains: ['Bits 15:14 I2C2SEL[1:0]: I2C2 clock source selection', '00: PCLK selected as I2C2 clock']}
    - {doc_id: STM32G474_RM0440, page: 1645, contains: [tSCL = tSYNC1 + tSYNC2]}
