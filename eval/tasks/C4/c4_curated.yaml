  - i2c
  turns:
  - user: 'I am designing the firmware of an STM32G474 board with you over several messages. Write bare-metal C that accesses registers the CMSIS way (e.g. `TIM1->PSC = ...;`, `RCC->APB2ENR |= RCC_APB2ENR_TIM1EN;`) using the register and bit names of ST''s `stm32g4xx.h` device header. Do not use HAL or LL drivers, `SystemCoreClock` or any other library function; write clock frequencies as numeric constants. Do not use interrupts; busy-wait loops on status flags are fine. Initial state: SYSCLK = HCLK = PCLK1 = PCLK2 = 170 MHz (PLL fed by HSI16, AHB/APB1/APB2 prescalers = 1, voltage Range 1 boost mode, Flash wait states already set); the board is powered at VDD = 3.3 V. Every peripheral clock that is off at reset is still off, and all GPIO pins are in their reset state. Answer every message with the relevant C code (in fenced C code blocks that follow these conventions) and a short explanation. Message 1: configure USART1 for 115200 baud with TX on pin PA9 and RX on pin PA10. Use 8 data bits, no parity, 1 stop bit and oversampling by 16, enable both the transmitter and the receiver (write the baud-rate register before enabling the USART), and make the baud rate accurate to within ±2 %.'
  - user: 'Message 2: now add an I2C2 controller for a sensor on the board, in fast mode (400 kHz), with SCL on pin PA9 and SDA on pin PA8. Configure the peripheral only (no transfers yet): open-drain SCL and SDA pins, program I2C_TIMINGR while the peripheral is disabled so that the fast-mode minimums of RM0440 Table 358 are met (tLOW >= 1.3 us and tHIGH >= 0.6 us), then enable it. Keep the I2C2 kernel clock at its reset selection.'
  - user: 'Message 3: please give me the complete initialisation program for the whole design so far (USART1 and I2C2) as one C code block (`#include "stm32g4xx.h"`, then a `main()` that configures everything and finally loops forever with `while (1)`), followed by a short explanation.'
  expected:
