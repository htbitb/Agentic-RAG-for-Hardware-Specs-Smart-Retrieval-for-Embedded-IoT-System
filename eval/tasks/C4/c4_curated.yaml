    reference_calc: >-
      Xung đột 1 (NO_SUCH_AF, lượt 2): người dùng chọn SCL = PB6, nhưng hàng PB6 của bảng AF (DS12288 Table 13, p.74) chỉ có TIM16_CH1N, TIM4_CH1, TIM8_CH1, TIM8_ETR, USART1_TX, COMP4_OUT, FDCAN2_TX, ...
      — không có tín hiệu I2C nào. I2C1_SCL chỉ nằm ở PA13 (SWDIO), PA15 (AF4, p.73) và PB8 (AF4, p.74); chọn PB8 (có ở LQFP64). I2C1_SDA ở PB7 (AF4, p.74), PB9 (AF4) và PA14; giữ SDA ở PB7 vì người dùng nói SDA đã đi dây tới PB7 (nên spec ép sda_pin = PB7).
      Xung đột 2 (PIN_CONFLICT, lượt 3): người dùng đòi USART1_TX = PB6 (AF7) và USART1_RX = PB7 (AF7, p.74). PB6 đã rảnh vì SCL rời sang PB8, nhưng PB7 đang là I2C1_SDA (AF4): một chân chỉ mang một chức năng.
      USART1_RX còn ở PA10 (AF7, p.73), PC5, PE1; chọn PA10 (có ở LQFP64). Vì SDA cố định ở PB7 nên không thể nhường PB7 cho USART1_RX; cách sửa là đổi chân USART1_RX (PA10 / PC5 / PE1) — TX giữ PB6 vì PB6 đã rảnh, hoặc PA9 / PC4 / PE0.
      UART (RM0440 §40.5.7 p.1708: OVER8 = 0 ⇒ BRR = USARTDIV; RCC_CCIPR p.324: USART1SEL/USART2SEL reset = 00 = PCLK ⇒ kernel = PCLK2/PCLK1 = 170 MHz): USART2 115200: 170e6 / 115200 = 1475,69 ⇒ BRR = 1476 ⇒ 170e6 / 1476 = 115176 baud (−0,02 %).
      USART1 921600: 170e6 / 921600 = 184,46 ⇒ BRR = 184 ⇒ 170e6 / 184 = 923913 baud (+0,25 %, trong ±2 %).
      I2C1 400 kHz (RM0440 §39.4.9 p.1645: tSCL = tSYNC1 + tSYNC2 + [(SCLH+1) + (SCLL+1)] × (PRESC+1) × tI2CCLK; RCC_CCIPR p.324: I2C1SEL reset = 00 = PCLK ⇒ fI2CCLK = PCLK1 = 170 MHz, tI2CCLK = 5,882 ns):
      chọn PRESC = 4 ⇒ tPRESC = 5 × 5,882 = 29,41 ns. Mục tiêu tSCL = 2500 ns với tSYNC1 + tSYNC2 cực tiểu 4 × tI2CCLK = 23,5 ns ⇒ (SCLL+1) + (SCLH+1) = (2500 − 23,5) / 29,41 = 84,2 ⇒ 84.
      Fast-mode cần tLOW ≥ 1,3 µs và tHIGH ≥ 0,6 µs (Table 358 p.1647): SCLL = 55 ⇒ 56 × 29,41 = 1647 ns (+ tSYNC1 = 2 × 5,882 = 11,8 ns ⇒ 1659 ns); SCLH = 27 ⇒ 28 × 29,41 = 823,5 ns (+ 11,8 ⇒ 835 ns); tổng 84 ⇒
      tSCL = 84 × 29,41 + 23,5 = 2494 ns ⇒ 400,9 kHz (cận trên); với tSYNC = 1000 ns: 84 × 29,41 + 1000 = 3470,6 ns ⇒ 288,1 kHz ⇒ dải [288,1; 400,9] chứa 400 kHz.
      SCLDEL ≥ [tr(max) + tSU;DAT(min)] / tPRESC − 1 = (300 + 100) / 29,41 − 1 = 12,6 ⇒ 13 (Table 356 p.1632, Fm: tr = 300 ns, tSU;DAT = 100 ns; p.1632 công thức SCLDEL).
      SDADEL ≥ [tf(max) + tHD;DAT(min) − tAF(min) − (DNF+3) × tI2CCLK] / tPRESC = (300 + 0 − 50 − 17,6) / 29,41 = 7,9 ⇒ 8 (tAF(min) = 50 ns: DS12288 Table 88 p.171; RM p.1631);
      SDADEL ≤ [tVD;DAT(max) − tr(max) − tAF(max) − (DNF+4) × tI2CCLK] / tPRESC = (900 − 300 − 90 − 23,5) / 29,41 = 16,5 ≥ 8 ✓ (RM p.1632, tAF(max) = 90 ns).
      TIMINGR = PRESC 4 [31:28], SCLDEL 13 [23:20], SDADEL 8 [19:16], SCLH 27 [15:8], SCLL 55 [7:0] (RM p.1681). SCL/SDA cần open-drain (GPIOx_OTYPER).
    reference_solution:
      turns:
        - |
          USART2 sits on APB1 (prescaler 1) and its kernel clock is PCLK1 (reset selection), so fUSART = 170 MHz. With oversampling by 16, BRR = USARTDIV = 170 MHz / 115200 = 1475.7, so BRR = 1476 and the actual rate is 115176 baud (-0.02 %). PA2 is USART2_TX and PA3 is USART2_RX, both AF7. BRR is written while UE = 0.

          ```c
          #include "stm32g4xx.h"

          int main(void)
          {
              RCC->AHB2ENR |= RCC_AHB2ENR_GPIOAEN;
              RCC->APB1ENR1 |= RCC_APB1ENR1_USART2EN;

              GPIOA->MODER = (GPIOA->MODER & ~(GPIO_MODER_MODE2 | GPIO_MODER_MODE3)) | GPIO_MODER_MODE2_1 | GPIO_MODER_MODE3_1;
              GPIOA->AFR[0] = (GPIOA->AFR[0] & ~(GPIO_AFRL_AFSEL2 | GPIO_AFRL_AFSEL3)) | (7U << GPIO_AFRL_AFSEL2_Pos) | (7U << GPIO_AFRL_AFSEL3_Pos);

              USART2->BRR = 1476;
              USART2->CR1 = USART_CR1_UE | USART_CR1_TE | USART_CR1_RE;

              while (1) { }
          }
          ```
        - |
          One thing to flag before the code:
          - **No such alternate function:** PB6 does not carry I2C1_SCL on the STM32G474 (its alternate functions are TIM16_CH1N, TIM4_CH1, TIM8_CH1, USART1_TX and so on, but no I2C), so SCL cannot be placed on PB6. I2C1_SCL is available on PB8 and PA15 (AF4); I put SCL on PB8 (note: PB8 is also the BOOT0 pin, so an external pull-up on SCL would select the system bootloader at reset unless nSWBOOT0 = 0; PA15 is the alternative) and keep SDA on PB7, which is already routed and is I2C1_SDA (AF4). Only the SCL wire of your sensor board has to move, from PB6 to PB8.

          I2C1 kernel clock is PCLK1 = 170 MHz (I2C1SEL reset value), so tI2CCLK = 5.88 ns. PRESC = 4 gives tPRESC = 29.4 ns, SCLL = 55 (tLOW about 1.66 us), SCLH = 27 (tHIGH about 0.84 us), SCLDEL = 13, SDADEL = 8: fSCL lies between 288 kHz (tSYNC = 1000 ns) and 401 kHz (minimum tSYNC), and both fast-mode minimums are met.

          ```c
          RCC->AHB2ENR |= RCC_AHB2ENR_GPIOBEN;
          RCC->APB1ENR1 |= RCC_APB1ENR1_I2C1EN;
          GPIOB->MODER = (GPIOB->MODER & ~(GPIO_MODER_MODE7 | GPIO_MODER_MODE8)) | GPIO_MODER_MODE7_1 | GPIO_MODER_MODE8_1;
          GPIOB->OTYPER |= GPIO_OTYPER_OT7 | GPIO_OTYPER_OT8;
          GPIOB->AFR[0] = (GPIOB->AFR[0] & ~GPIO_AFRL_AFSEL7) | (4U << GPIO_AFRL_AFSEL7_Pos);
          GPIOB->AFR[1] = (GPIOB->AFR[1] & ~GPIO_AFRH_AFSEL8) | (4U << GPIO_AFRH_AFSEL8_Pos);
          I2C1->TIMINGR = (4U << I2C_TIMINGR_PRESC_Pos) | (13U << I2C_TIMINGR_SCLDEL_Pos) | (8U << I2C_TIMINGR_SDADEL_Pos) | (27U << I2C_TIMINGR_SCLH_Pos) | (55U << I2C_TIMINGR_SCLL_Pos);
          I2C1->CR1 |= I2C_CR1_PE;
          ```
        - |
          One thing to flag before the code:
          - **Pin conflict:** PB7 is already used by I2C1_SDA (AF4), so USART1_RX (AF7) cannot also be placed on PB7. PB6 is free now that SCL moved to PB8, so USART1_TX stays on PB6 (AF7), and I move USART1_RX to PA10 (AF7).

          USART1 is on APB2 (prescaler 1) with its kernel clock at PCLK2 (reset selection) = 170 MHz, so USARTDIV = 170 MHz / 921600 = 184.46 and BRR = 184, i.e. 923913 baud (+0.25 %).

          ```c
          RCC->APB2ENR |= RCC_APB2ENR_USART1EN;
          GPIOB->MODER = (GPIOB->MODER & ~GPIO_MODER_MODE6) | GPIO_MODER_MODE6_1;
          GPIOB->AFR[0] = (GPIOB->AFR[0] & ~GPIO_AFRL_AFSEL6) | (7U << GPIO_AFRL_AFSEL6_Pos);
          GPIOA->MODER = (GPIOA->MODER & ~GPIO_MODER_MODE10) | GPIO_MODER_MODE10_1;
          GPIOA->AFR[1] = (GPIOA->AFR[1] & ~GPIO_AFRH_AFSEL10) | (7U << GPIO_AFRH_AFSEL10_Pos);
          USART1->BRR = 184;
          USART1->CR1 = USART_CR1_UE | USART_CR1_TE | USART_CR1_RE;
          ```
        - |
          Here is the complete program: USART2 on PA2/PA3, I2C1 on PB8 (SCL) and PB7 (SDA), and the debug USART1 on PB6 (TX) and PA10 (RX).

          ```c
          #include "stm32g4xx.h"

          int main(void)
          {
              RCC->AHB2ENR |= RCC_AHB2ENR_GPIOAEN | RCC_AHB2ENR_GPIOBEN;
              RCC->APB1ENR1 |= RCC_APB1ENR1_USART2EN | RCC_APB1ENR1_I2C1EN;
              RCC->APB2ENR |= RCC_APB2ENR_USART1EN;

              /* USART2: PA2 = TX, PA3 = RX (AF7), 115200 baud */
              GPIOA->MODER = (GPIOA->MODER & ~(GPIO_MODER_MODE2 | GPIO_MODER_MODE3)) | GPIO_MODER_MODE2_1 | GPIO_MODER_MODE3_1;
              GPIOA->AFR[0] = (GPIOA->AFR[0] & ~(GPIO_AFRL_AFSEL2 | GPIO_AFRL_AFSEL3)) | (7U << GPIO_AFRL_AFSEL2_Pos) | (7U << GPIO_AFRL_AFSEL3_Pos);
              USART2->BRR = 1476;
              USART2->CR1 = USART_CR1_UE | USART_CR1_TE | USART_CR1_RE;

              /* I2C1: SCL = PB8, SDA = PB7 (AF4), open drain, 400 kHz */
              GPIOB->MODER = (GPIOB->MODER & ~(GPIO_MODER_MODE7 | GPIO_MODER_MODE8)) | GPIO_MODER_MODE7_1 | GPIO_MODER_MODE8_1;
              GPIOB->OTYPER |= GPIO_OTYPER_OT7 | GPIO_OTYPER_OT8;
              GPIOB->AFR[0] = (GPIOB->AFR[0] & ~GPIO_AFRL_AFSEL7) | (4U << GPIO_AFRL_AFSEL7_Pos);
              GPIOB->AFR[1] = (GPIOB->AFR[1] & ~GPIO_AFRH_AFSEL8) | (4U << GPIO_AFRH_AFSEL8_Pos);
              I2C1->TIMINGR = (4U << I2C_TIMINGR_PRESC_Pos) | (13U << I2C_TIMINGR_SCLDEL_Pos) | (8U << I2C_TIMINGR_SDADEL_Pos) | (27U << I2C_TIMINGR_SCLH_Pos) | (55U << I2C_TIMINGR_SCLL_Pos);
              I2C1->CR1 |= I2C_CR1_PE;

              /* USART1: PB6 = TX, PA10 = RX (AF7), 921600 baud */
              GPIOB->MODER = (GPIOB->MODER & ~GPIO_MODER_MODE6) | GPIO_MODER_MODE6_1;
              GPIOB->AFR[0] = (GPIOB->AFR[0] & ~GPIO_AFRL_AFSEL6) | (7U << GPIO_AFRL_AFSEL6_Pos);
              GPIOA->MODER = (GPIOA->MODER & ~GPIO_MODER_MODE10) | GPIO_MODER_MODE10_1;
              GPIOA->AFR[1] = (GPIOA->AFR[1] & ~GPIO_AFRH_AFSEL10) | (7U << GPIO_AFRH_AFSEL10_Pos);
              USART1->BRR = 184;
              USART1->CR1 = USART_CR1_UE | USART_CR1_TE | USART_CR1_RE;

              while (1) { }
          }
          ```
