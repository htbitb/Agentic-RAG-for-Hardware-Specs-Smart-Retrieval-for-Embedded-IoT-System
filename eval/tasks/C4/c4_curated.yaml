- id: C4-010
  category: C4
  split: test
  difficulty: medium
  chips:
  - stm32g474
  tags:
  - pin_conflict
  - pwm
  - uart
  turns:
  - user: 'I am designing the firmware of an STM32G474 board with you over several messages. Write bare-metal C that accesses registers the CMSIS way (e.g. `TIM1->PSC = ...;`, `RCC->APB2ENR |= RCC_APB2ENR_TIM1EN;`) using the register and bit names of ST''s `stm32g4xx.h` device header. Do not use HAL or LL drivers, `SystemCoreClock` or any other library function; write clock frequencies as numeric constants. Do not use interrupts; busy-wait loops on status flags are fine. Initial state: SYSCLK = HCLK = PCLK1 = PCLK2 = 170 MHz (PLL fed by HSI16, AHB/APB1/APB2 prescalers = 1, voltage Range 1 boost mode, Flash wait states already set); the board is powered at VDD = 3.3 V. Every peripheral clock that is off at reset is still off, and all GPIO pins are in their reset state. Answer every message with the relevant C code (in fenced C code blocks that follow these conventions) and a short explanation. Message 1: generate two PWM signals from TIM4, both at 10 kHz: channel 1 on pin PB6 with a 30 % duty cycle and channel 2 on pin PB7 with a 60 % duty cycle; edge-aligned PWM mode 1, active-high outputs, no dead time.'
  - user: 'Message 2: now add a debug console on USART1 at 115200 baud with TX on pin PB6 and RX on pin PB7. Use 8 data bits, no parity, 1 stop bit and oversampling by 16, enable both the transmitter and the receiver, and write the baud-rate register before enabling the USART; the baud rate must be accurate to within ±2 %.'
  - user: 'Message 3: please give me the complete initialisation program for the whole design so far (the two PWM outputs and USART1) as one C code block (`#include "stm32g4xx.h"`, then a `main()` that configures everything and finally loops forever with `while (1)`), followed by a short explanation.'
  expected:
    chip: stm32g474
    initial: sysclk_170mhz_pll_hsi16_apb_div1
    spec:
    - {type: pwm, any_pin: true, signal: TIM4_CH1, freq_hz: 10000, duty_pct: 30, tol_pct: 1}
    - {type: pwm, any_pin: true, signal: TIM4_CH2, freq_hz: 10000, duty_pct: 60, tol_pct: 1}
    - {type: uart, instance: USART1, baud: 115200, tol_pct: 2, require_pins: true, frame: 8N1, te: true, re: true}
    must_detect:
    - {code: 'PIN_CONFLICT:PB6', turn: 1, from_turn: 1}
    - {code: 'PIN_CONFLICT:PB7', turn: 1, from_turn: 1}
  graders:
  - final_state
  - conflict_detected
  - compile
  review_status: verified
  provenance:
    authored_by: session P3 (Claude Sonnet 5.5, tác giả C4 nhóm B); lời giải và phép tính tay độc lập với simulator và DRC
    conflict_facts:
    - {type: af, pin: PB6, signal: TIM4_CH1, af: 2}
    - {type: af, pin: PB7, signal: TIM4_CH2, af: 2}
    - {type: af, pin: PB6, signal: USART1_TX, af: 7}
    - {type: af, pin: PB7, signal: USART1_RX, af: 7}
    - {type: af, pin: PA9, signal: USART1_TX, af: 7}
    - {type: af, pin: PA10, signal: USART1_RX, af: 7}
    - {type: af, pin: PC4, signal: USART1_TX, af: 7}
    - {type: af, pin: PC5, signal: USART1_RX, af: 7}
    evidence:
    - {doc_id: STM32G474_Datasheet, page: 74, contains: [PB6 - TIM16_CH1N TIM4_CH1 - - TIM8_CH1 TIM8_ETR USART1_TX, PB7 - TIM17_CH1N TIM4_CH2 I2C4_SDA I2C1_SDA TIM8_BKIN - USART1_RX]}
    - {doc_id: STM32G474_Datasheet, page: 73, contains: [PA9 - - I2C3_SMBA - I2C2_SCL I2S3_MCK TIM1_CH2 USART1_TX, PA10 - TIM17_BKIN - USB_CRS_SYNC I2C2_SMBA SPI2_MISO TIM1_CH3 USART1_RX]}
    - {doc_id: STM32G474_Datasheet, page: 75, contains: [PC4 - - TIM1_ETR - I2C2_SCL -- USART1_TX, PC5 - - TIM15_BKIN SAI1_D3 - - TIM1_CH4N USART1_RX]}
    - {doc_id: STM32G474_RM0440, page: 1319, contains: [high as long as TIMx_CNT <TIMx_CCRx]}
    - {doc_id: STM32G474_RM0440, page: 1288, contains: [Table 284. STM32G4 series general purpose timers, Resolution 32-bit 16-bit 16-bit 32-bit]}
    - {doc_id: STM32G474_RM0440, page: 281, contains: ['If the APB prescaler equals 1, the timer clock frequencies are set to the same frequency of the APB domain']}
    - {doc_id: STM32G474_RM0440, page: 1708, contains: ['When OVER8 = 0, BRR = USARTDIV.']}
    reference_calc: 'Xung đột (chân): lượt 0 đặt PWM TIM4_CH1 trên PB6 (AF2) và TIM4_CH2 trên PB7 (AF2) (DS12288 Table 13 p.74: PB6 ... TIM4_CH1 ... USART1_TX; PB7 ... TIM4_CH2 ... USART1_RX); lượt 1 yêu cầu USART1_TX trên PB6 (AF7) và USART1_RX trên PB7 (AF7) ⇒ PIN_CONFLICT:PB6 và PIN_CONFLICT:PB7 (một chân chỉ có một chức năng thay thế tại một thời điểm). Cách sửa hợp lệ: chuyển USART1 sang PA9 (TX, AF7) / PA10 (RX, AF7) (p.73) hoặc PC4 / PC5 (AF7, p.75; PC5 là TT_a nhưng ở đây chỉ làm ngõ vào RX nên vẫn dùng được). PWM: TIM4 trên APB1, prescaler 1 ⇒ TIM4CLK = PCLK1 = 170 MHz (RM0440 §7.2.13 p.281). 170e6 / 10e3 = 17000 nhịp (< 65536: TIM4 là bộ đếm 16 bit) ⇒ PSC = 0, ARR = 16999; CCR1 = 30 % × 17000 = 5100, CCR2 = 60 % × 17000 = 10200 (RM §30.4.x p.1319). TIM4 là general-purpose timer nên không có BDTR.MOE; cần CC1E và CC2E trong TIM4_CCER. USART1: kernel clock mặc định USART1SEL = 00 = PCLK2 = 170 MHz; OVER8 = 0 ⇒ BRR = USARTDIV = 170e6 / 115200 = 1475,69 ⇒ 1476 ⇒ baud thực 115176 (−0,02 %) (RM §40.5.7 p.1707–1708).'
    reference_solution:
      turns:
      - |
        TIM4 sits on APB1 with prescaler 1, so TIM4CLK = 170 MHz and 170 MHz / 10 kHz = 17000 ticks, which fits the 16-bit counter: PSC = 0, ARR = 16999, CCR1 = 30 % x 17000 = 5100 and CCR2 = 60 % x 17000 = 10200. TIM4_CH1 is on PB6 (AF2) and TIM4_CH2 on PB7 (AF2); TIM4 is a general-purpose timer, so there is no BDTR.MOE.

        ```c
        #include "stm32g4xx.h"

        int main(void)
        {
            RCC->AHB2ENR |= RCC_AHB2ENR_GPIOBEN;
            RCC->APB1ENR1 |= RCC_APB1ENR1_TIM4EN;

            /* PWM: PB6 = TIM4_CH1 (AF2) 30 %, PB7 = TIM4_CH2 (AF2) 60 %, 10 kHz */
            GPIOB->MODER = (GPIOB->MODER & ~(GPIO_MODER_MODE6 | GPIO_MODER_MODE7)) | GPIO_MODER_MODE6_1 | GPIO_MODER_MODE7_1;
            GPIOB->AFR[0] = (GPIOB->AFR[0] & ~(GPIO_AFRL_AFSEL6 | GPIO_AFRL_AFSEL7)) | (2U << GPIO_AFRL_AFSEL6_Pos) | (2U << GPIO_AFRL_AFSEL7_Pos);
            TIM4->PSC = 0;
            TIM4->ARR = 16999;
            TIM4->CCR1 = 5100;
            TIM4->CCR2 = 10200;
            TIM4->CCMR1 = (TIM4->CCMR1 & ~TIM_CCMR1_OC1M) | (6U << TIM_CCMR1_OC1M_Pos) | TIM_CCMR1_OC1PE;
            TIM4->CCMR1 = (TIM4->CCMR1 & ~TIM_CCMR1_OC2M) | (6U << TIM_CCMR1_OC2M_Pos) | TIM_CCMR1_OC2PE;
            TIM4->CCER |= TIM_CCER_CC1E | TIM_CCER_CC2E;
            TIM4->CR1 |= TIM_CR1_ARPE;
            TIM4->EGR = TIM_EGR_UG;
            TIM4->CR1 |= TIM_CR1_CEN;

            while (1) { }
        }
        ```
      - |
        Two things to flag before the code:
        - **PB6:** PB6 is already used by the PWM output TIM4_CH1 (AF2), so USART1_TX cannot also be placed on PB6.
        - **PB7:** PB7 is already used by the PWM output TIM4_CH2 (AF2), so USART1_RX cannot also be placed on PB7.
        I keep the two PWM outputs where you put them and move USART1 to PA9 (TX, AF7) and PA10 (RX, AF7), which are in the alternate-function table of the datasheet; PC4 (TX) and PC5 (RX) in AF7 would work as well.

        USART1 is on APB2 (prescaler 1) and keeps its reset kernel clock PCLK2 = 170 MHz, so USARTDIV = 170 MHz / 115200 = 1475.7 and BRR = 1476 (real baud rate 115176, -0.02 %).

        ```c
        RCC->AHB2ENR |= RCC_AHB2ENR_GPIOAEN;
        RCC->APB2ENR |= RCC_APB2ENR_USART1EN;

        /* USART1: TX = PA9 (AF7), RX = PA10 (AF7), 115200 baud, 8N1 */
        GPIOA->MODER = (GPIOA->MODER & ~(GPIO_MODER_MODE9 | GPIO_MODER_MODE10)) | GPIO_MODER_MODE9_1 | GPIO_MODER_MODE10_1;
        GPIOA->AFR[1] = (GPIOA->AFR[1] & ~(GPIO_AFRH_AFSEL9 | GPIO_AFRH_AFSEL10)) | (7U << GPIO_AFRH_AFSEL9_Pos) | (7U << GPIO_AFRH_AFSEL10_Pos);
        USART1->BRR = 1476;                                                /* written while UE = 0 */
        USART1->CR1 = USART_CR1_UE | USART_CR1_TE | USART_CR1_RE;
        ```
      - |
        Here is the complete program: TIM4 PWM on PB6/PB7 (10 kHz, 30 % and 60 %) and USART1 on PA9/PA10 at 115200 baud.

        ```c
        #include "stm32g4xx.h"

        int main(void)
        {
            RCC->AHB2ENR |= RCC_AHB2ENR_GPIOBEN;
            RCC->APB1ENR1 |= RCC_APB1ENR1_TIM4EN;
            RCC->AHB2ENR |= RCC_AHB2ENR_GPIOAEN;
            RCC->APB2ENR |= RCC_APB2ENR_USART1EN;

            /* PWM: PB6 = TIM4_CH1 (AF2) 30 %, PB7 = TIM4_CH2 (AF2) 60 %, 10 kHz */
            GPIOB->MODER = (GPIOB->MODER & ~(GPIO_MODER_MODE6 | GPIO_MODER_MODE7)) | GPIO_MODER_MODE6_1 | GPIO_MODER_MODE7_1;
            GPIOB->AFR[0] = (GPIOB->AFR[0] & ~(GPIO_AFRL_AFSEL6 | GPIO_AFRL_AFSEL7)) | (2U << GPIO_AFRL_AFSEL6_Pos) | (2U << GPIO_AFRL_AFSEL7_Pos);
            TIM4->PSC = 0;
            TIM4->ARR = 16999;
            TIM4->CCR1 = 5100;
            TIM4->CCR2 = 10200;
            TIM4->CCMR1 = (TIM4->CCMR1 & ~TIM_CCMR1_OC1M) | (6U << TIM_CCMR1_OC1M_Pos) | TIM_CCMR1_OC1PE;
            TIM4->CCMR1 = (TIM4->CCMR1 & ~TIM_CCMR1_OC2M) | (6U << TIM_CCMR1_OC2M_Pos) | TIM_CCMR1_OC2PE;
            TIM4->CCER |= TIM_CCER_CC1E | TIM_CCER_CC2E;
            TIM4->CR1 |= TIM_CR1_ARPE;
            TIM4->EGR = TIM_EGR_UG;
            TIM4->CR1 |= TIM_CR1_CEN;

            /* USART1: TX = PA9 (AF7), RX = PA10 (AF7), 115200 baud, 8N1 */
            GPIOA->MODER = (GPIOA->MODER & ~(GPIO_MODER_MODE9 | GPIO_MODER_MODE10)) | GPIO_MODER_MODE9_1 | GPIO_MODER_MODE10_1;
            GPIOA->AFR[1] = (GPIOA->AFR[1] & ~(GPIO_AFRH_AFSEL9 | GPIO_AFRH_AFSEL10)) | (7U << GPIO_AFRH_AFSEL9_Pos) | (7U << GPIO_AFRH_AFSEL10_Pos);
            USART1->BRR = 1476;                                                /* written while UE = 0 */
            USART1->CR1 = USART_CR1_UE | USART_CR1_TE | USART_CR1_RE;

            while (1) { }
        }
        ```
    valid_variants:
    - name: pwm_moved_to_pd12_pd13_usart1_keeps_pb6_pb7
      note: "the user asked for both on PB6/PB7; moving the PWM (TIM4_CH1/CH2 are also on PD12/PD13, AF2) instead of USART1 is an equally valid fix"
      edits:
