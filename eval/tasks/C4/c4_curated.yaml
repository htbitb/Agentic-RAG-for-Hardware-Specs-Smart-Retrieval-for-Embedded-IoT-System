      turns:
      - |
        **Wrong pins:** PA2 does not carry USART1_TX: the AF7 function of PA2 is USART2_TX. PA3 does not carry USART1_RX either: the AF7 function of PA3 is USART2_RX. USART1_TX is available on PA9, PB6 and PC4 and USART1_RX on PA10, PB7 and PC5 (all AF7); I use PA9 for TX and PA10 for RX.

        USART1 sits on APB2, so its kernel clock is PCLK2 = 170 MHz (USART1SEL = PCLK2 at reset). With OVER8 = 0, USARTDIV = 170 MHz / 115200 = 1475.69, so BRR = 1476 (115176 baud, -0.02 %); BRR is written while UE = 0.

        ```c
        #include "stm32g4xx.h"

        int main(void)
        {
            RCC->AHB2ENR |= RCC_AHB2ENR_GPIOAEN;
            RCC->APB2ENR |= RCC_APB2ENR_USART1EN;

            GPIOA->MODER = (GPIOA->MODER & ~(GPIO_MODER_MODE9 | GPIO_MODER_MODE10)) | GPIO_MODER_MODE9_1 | GPIO_MODER_MODE10_1;
            GPIOA->AFR[1] = (GPIOA->AFR[1] & ~(GPIO_AFRH_AFSEL9 | GPIO_AFRH_AFSEL10)) | (7U << GPIO_AFRH_AFSEL9_Pos) | (7U << GPIO_AFRH_AFSEL10_Pos);   /* AF7 */

            USART1->BRR = 1476;
            USART1->CR1 = USART_CR1_UE | USART_CR1_TE | USART_CR1_RE;

            while (1) { }
        }
        ```
      - |
        TIM3 channel 1 on PA6 (AF2): TIM3CLK = 170 MHz, and 170 MHz / 1 kHz = 170000 ticks, more than the 16-bit counter of TIM3 can hold (65536), so PSC = 3 (divide by 4): ARR = 42499 (42500 ticks) and CCR1 = 50 % x 42500 = 21250. TIM3 is a general-purpose timer, so there is no BDTR.MOE.

        ```c
        RCC->APB1ENR1 |= RCC_APB1ENR1_TIM3EN;
        GPIOA->MODER = (GPIOA->MODER & ~GPIO_MODER_MODE6) | GPIO_MODER_MODE6_1;
        GPIOA->AFR[0] = (GPIOA->AFR[0] & ~GPIO_AFRL_AFSEL6) | (2U << GPIO_AFRL_AFSEL6_Pos);     /* AF2 = TIM3_CH1 */
        TIM3->PSC = 3;
        TIM3->ARR = 42499;
        TIM3->CCR1 = 21250;
        TIM3->CCMR1 = (TIM3->CCMR1 & ~TIM_CCMR1_OC1M) | (6U << TIM_CCMR1_OC1M_Pos) | TIM_CCMR1_OC1PE;
        TIM3->CCER |= TIM_CCER_CC1E;
        TIM3->CR1 |= TIM_CR1_ARPE;
        TIM3->EGR = TIM_EGR_UG;
        TIM3->CR1 |= TIM_CR1_CEN;
        ```
      - |
        Here is the complete program: USART1 on PA9 (TX) and PA10 (RX), and the fan PWM on PA6 (TIM3_CH1).

        ```c
        #include "stm32g4xx.h"

        int main(void)
        {
            RCC->AHB2ENR |= RCC_AHB2ENR_GPIOAEN;
            RCC->APB2ENR |= RCC_APB2ENR_USART1EN;
            RCC->APB1ENR1 |= RCC_APB1ENR1_TIM3EN;

            /* USART1: PA9 = TX, PA10 = RX (AF7), 115200 8N1 */
            GPIOA->MODER = (GPIOA->MODER & ~(GPIO_MODER_MODE9 | GPIO_MODER_MODE10)) | GPIO_MODER_MODE9_1 | GPIO_MODER_MODE10_1;
            GPIOA->AFR[1] = (GPIOA->AFR[1] & ~(GPIO_AFRH_AFSEL9 | GPIO_AFRH_AFSEL10)) | (7U << GPIO_AFRH_AFSEL9_Pos) | (7U << GPIO_AFRH_AFSEL10_Pos);
            USART1->BRR = 1476;
            USART1->CR1 = USART_CR1_UE | USART_CR1_TE | USART_CR1_RE;

            /* PWM: PA6 = TIM3_CH1 (AF2), 1 kHz, 50 % */
            GPIOA->MODER = (GPIOA->MODER & ~GPIO_MODER_MODE6) | GPIO_MODER_MODE6_1;
            GPIOA->AFR[0] = (GPIOA->AFR[0] & ~GPIO_AFRL_AFSEL6) | (2U << GPIO_AFRL_AFSEL6_Pos);
            TIM3->PSC = 3;
            TIM3->ARR = 42499;
            TIM3->CCR1 = 21250;
            TIM3->CCMR1 = (TIM3->CCMR1 & ~TIM_CCMR1_OC1M) | (6U << TIM_CCMR1_OC1M_Pos) | TIM_CCMR1_OC1PE;
            TIM3->CCER |= TIM_CCER_CC1E;
            TIM3->CR1 |= TIM_CR1_ARPE;
            TIM3->EGR = TIM_EGR_UG;
            TIM3->CR1 |= TIM_CR1_CEN;

            while (1) { }
        }
        ```
