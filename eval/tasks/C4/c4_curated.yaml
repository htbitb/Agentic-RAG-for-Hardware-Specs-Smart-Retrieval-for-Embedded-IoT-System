            USART3->CR1 = USART_CR1_UE | USART_CR1_TE | USART_CR1_RE;

            while (1) { }
        }
        ```
      - |
        **Pin conflict:** PB10 is already used by USART3_TX (AF7) from the previous message, so TIM2_CH3 (AF1) cannot also be placed on PB10. I keep USART3 on PB10/PB11 and move the heater PWM to another TIM2 channel-3 pin, PA2 (AF1); the alternative would be to move USART3_TX to PC10 (AF7) and keep the PWM on PB10.

        TIM2 is a 32-bit timer on APB1 (prescaler 1), so TIM2CLK = 170 MHz and 170 MHz / 5 kHz = 34000 ticks: PSC = 0, ARR = 33999 and CCR3 = 80 % x 34000 = 27200. Channel 3 is configured in CCMR2 (OC3M, OC3PE) and enabled by CC3E; TIM2 has no BDTR.MOE.

        ```c
        RCC->AHB2ENR |= RCC_AHB2ENR_GPIOAEN;
        RCC->APB1ENR1 |= RCC_APB1ENR1_TIM2EN;
        GPIOA->MODER = (GPIOA->MODER & ~GPIO_MODER_MODE2) | GPIO_MODER_MODE2_1;
        GPIOA->AFR[0] = (GPIOA->AFR[0] & ~GPIO_AFRL_AFSEL2) | (1U << GPIO_AFRL_AFSEL2_Pos);     /* AF1 = TIM2_CH3 */
        TIM2->PSC = 0;
        TIM2->ARR = 33999;
        TIM2->CCR3 = 27200;
        TIM2->CCMR2 = (TIM2->CCMR2 & ~TIM_CCMR2_OC3M) | (6U << TIM_CCMR2_OC3M_Pos) | TIM_CCMR2_OC3PE;
        TIM2->CCER |= TIM_CCER_CC3E;
        TIM2->CR1 |= TIM_CR1_ARPE;
        TIM2->EGR = TIM_EGR_UG;
        TIM2->CR1 |= TIM_CR1_CEN;
        ```
      - |
        Here is the complete program: USART3 on PB10 (TX) and PB11 (RX), and the heater PWM on PA2 (TIM2_CH3).

        ```c
        #include "stm32g4xx.h"

        int main(void)
        {
            RCC->AHB2ENR |= RCC_AHB2ENR_GPIOAEN | RCC_AHB2ENR_GPIOBEN;
            RCC->APB1ENR1 |= RCC_APB1ENR1_USART3EN | RCC_APB1ENR1_TIM2EN;

            /* USART3: PB10 = TX, PB11 = RX (AF7), 115200 8N1 */
            GPIOB->MODER = (GPIOB->MODER & ~(GPIO_MODER_MODE10 | GPIO_MODER_MODE11)) | GPIO_MODER_MODE10_1 | GPIO_MODER_MODE11_1;
            GPIOB->AFR[1] = (GPIOB->AFR[1] & ~(GPIO_AFRH_AFSEL10 | GPIO_AFRH_AFSEL11)) | (7U << GPIO_AFRH_AFSEL10_Pos) | (7U << GPIO_AFRH_AFSEL11_Pos);
            USART3->BRR = 1476;
            USART3->CR1 = USART_CR1_UE | USART_CR1_TE | USART_CR1_RE;

            /* heater PWM: PA2 = TIM2_CH3 (AF1), 5 kHz, 80 % */
