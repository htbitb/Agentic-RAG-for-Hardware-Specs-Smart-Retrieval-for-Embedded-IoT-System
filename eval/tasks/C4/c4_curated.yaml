    authored_by: session P3 (Claude Sonnet 5.5, tác giả C4 nhóm B); lời giải và phép tính tay độc lập với simulator và DRC
    conflict_facts:
    - {type: af, pin: PA2, signal: USART2_TX, af: 7}
    - {type: af, pin: PA3, signal: USART2_RX, af: 7}
    evidence:
    - {doc_id: STM32G474_Datasheet, page: 73, contains: [PA2 - TIM2_CH3 TIM5_CH3 - - - - USART2_TX, PA3 - TIM2_CH4 TIM5_CH4 SAI1_CK1 - - - USART2_RX]}
    - {doc_id: STM32G474_Datasheet, page: 128, contains: [Table 54. I/O static characteristics, I/O input high level voltage, 0.7xVDD]}
    - {doc_id: STM32G474_Datasheet, page: 130, contains: [Table 55. Output voltage characteristics, Output high level voltage for an I/O pin V DD-0.4 -]}
    - {doc_id: STM32G474_RM0440, page: 1708, contains: ['When OVER8 = 0, BRR = USARTDIV.', USARTDIV must be greater than or equal to 16]}
    reference_calc: 'UART: USART2 trên APB1 (prescaler 1), kernel clock mặc định USART2SEL = 00 = PCLK1 = 170 MHz; OVER8 = 0 ⇒ BRR = USARTDIV (RM0440 §40.5.7 p.1707–1708): USARTDIV = 170e6 / 921600 = 184,46 ⇒ BRR = 184 (≥ 16) ⇒ baud thực 170e6 / 184 = 923913 (+0,25 %). PA2 = AF7 = USART2_TX, PA3 = AF7 = USART2_RX (DS12288 Table 13 p.73). Xung đột (mức logic): module BLE có chân UART logic 1,8 V (nguồn I/O 1,8 V) còn MCU cấp VDD = 3,3 V. (1) BLE → MCU (PA3): VIH(min) của MCU = 0,7 × VDD = 0,7 × 3,3 = 2,31 V (DS Table 54 p.128; công thức TTL thay thế 0,49 × VDD + 0,26 = 1,88 V cũng vẫn > 1,8 V) trong khi mức cao tối đa của module ≈ 1,8 V ⇒ không bảo đảm đọc được mức cao. (2) MCU → BLE (PA2): VOH(min) = VDD − 0,4 = 2,9 V (DS Table 55 p.130, CMOS, |IIO| = 8 mA, VDD ≥ 2,7 V), thực tế ≈ 3,3 V, vượt điện áp vào cho phép của chân 1,8 V (thường VDDIO + 0,3 V = 2,1 V; tra datasheet module) ⇒ nguy cơ hỏng chân. ⇒ cần level shifter 3,3 V ↔ 1,8 V (phần cứng; firmware không đổi) ⇒ LEVEL_MISMATCH:1.8V-3.3V do lượt 1 gây ra; must_not: khuyên nối trực tiếp.'
    reference_solution:
      turns:
      - |
        USART2 is on APB1 (prescaler 1) and keeps its reset kernel clock PCLK1 = 170 MHz, so USARTDIV = 170 MHz / 921600 = 184.46 and BRR = 184 (real baud rate 923913, +0.25 %). PA2 (USART2_TX) and PA3 (USART2_RX) are both AF7.

        ```c
        #include "stm32g4xx.h"

        int main(void)
        {
            RCC->AHB2ENR |= RCC_AHB2ENR_GPIOAEN;
            RCC->APB1ENR1 |= RCC_APB1ENR1_USART2EN;

            /* USART2: TX = PA2 (AF7), RX = PA3 (AF7), 921600 baud, 8N1 */
            GPIOA->MODER = (GPIOA->MODER & ~(GPIO_MODER_MODE2 | GPIO_MODER_MODE3)) | GPIO_MODER_MODE2_1 | GPIO_MODER_MODE3_1;
            GPIOA->AFR[0] = (GPIOA->AFR[0] & ~(GPIO_AFRL_AFSEL2 | GPIO_AFRL_AFSEL3)) | (7U << GPIO_AFRL_AFSEL2_Pos) | (7U << GPIO_AFRL_AFSEL3_Pos);
            USART2->BRR = 184;                                                 /* written while UE = 0 */
            USART2->CR1 = USART_CR1_UE | USART_CR1_TE | USART_CR1_RE;

            while (1) { }
        }
        ```
      - |
        Before wiring it, there is a **voltage mismatch**: the BLE module's UART pins run at 1.8 V logic, but the STM32G474 I/O pins are powered from VDD = 3.3 V, so PA2/PA3 cannot be wired directly to the module: use a level shifter.

        - PA2 (TX to the module): its high level is at least VDD - 0.4 = 2.9 V (DS12288 Table 55) and about 3.3 V when unloaded, well above the 1.8 V supply of the module's input (a 1.8 V I/O typically tolerates only VDDIO + 0.3 V = 2.1 V, check the module datasheet), which can damage it.
        - PA3 (RX from the module): the MCU needs an input high level of at least 0.7 x VDD = 2.31 V (DS12288 Table 54), but the module only drives about 1.8 V, so a high level would not be recognised reliably.

        Use a 3.3 V <-> 1.8 V level translator (one unidirectional channel per signal, or a bidirectional one), supplied from both rails: 1.8 V on the module side and 3.3 V on the MCU side. That is a hardware change; the firmware of message 1 is unchanged (921600 baud, 8N1), so no new code is needed.
      - |
        Here is the complete program: USART2 on PA2/PA3 at 921600 baud. The 1.8 V BLE module and the 3.3 V MCU still need the level shifter between them; the firmware itself does not change.

        ```c
        #include "stm32g4xx.h"

        int main(void)
        {
            RCC->AHB2ENR |= RCC_AHB2ENR_GPIOAEN;
            RCC->APB1ENR1 |= RCC_APB1ENR1_USART2EN;

            /* USART2: TX = PA2 (AF7), RX = PA3 (AF7), 921600 baud, 8N1 */
            GPIOA->MODER = (GPIOA->MODER & ~(GPIO_MODER_MODE2 | GPIO_MODER_MODE3)) | GPIO_MODER_MODE2_1 | GPIO_MODER_MODE3_1;
            GPIOA->AFR[0] = (GPIOA->AFR[0] & ~(GPIO_AFRL_AFSEL2 | GPIO_AFRL_AFSEL3)) | (7U << GPIO_AFRL_AFSEL2_Pos) | (7U << GPIO_AFRL_AFSEL3_Pos);
            USART2->BRR = 184;                                                 /* written while UE = 0 */
            USART2->CR1 = USART_CR1_UE | USART_CR1_TE | USART_CR1_RE;

            while (1) { }
        }
        ```
