    evidence:
      - {"doc_id": "STM32G474_Datasheet", "page": 82, "contains": ["Input voltage on TT_xx pins V SS-0.3 4.0", "Input voltage on FT_xxx pins except FT_c pins"]}
      - {"doc_id": "STM32G474_Datasheet", "page": 83, "contains": ["To sustain a voltage higher than 4 V the intern al pull-up/pull-down resistors must be disabled."]}
