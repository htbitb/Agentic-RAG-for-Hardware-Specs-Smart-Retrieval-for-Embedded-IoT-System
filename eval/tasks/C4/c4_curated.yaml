          - {turn: 2, find: "(85U << RCC_PLLCFGR_PLLN_Pos)", replace: "(75U << RCC_PLLCFGR_PLLN_Pos)"}
          - {turn: 2, find: "TIM1->ARR = 1699;", replace: "TIM1->ARR = 1499;"}
          - {turn: 2, find: "TIM1->CCR1 = 850;", replace: "TIM1->CCR1 = 750;"}
        expect: ["wrong_clock"]
      - name: forgot_boost_mode
        grader: final_state
        edits:
          - {turn: 2, find: "PWR->CR5 &= ~PWR_CR5_R1MODE;", replace: ""}
        expect: ["sim_violation:SIM-CLK-LIMIT"]
      - name: pwm_computed_for_200mhz_but_clock_kept_at_170mhz
        grader: final_state
        edits:
          - {turn: 2, find: "TIM1->ARR = 1699;", replace: "TIM1->ARR = 1999;"}
          - {turn: 2, find: "TIM1->CCR1 = 850;", replace: "TIM1->CCR1 = 1000;"}
        expect: ["wrong_freq"]
      - name: ahb_prescaler_left_at_div2
        grader: final_state
        edits:
          - {turn: 2, find: "RCC->CFGR = (RCC->CFGR & ~RCC_CFGR_HPRE) | RCC_CFGR_HPRE_DIV1;    /* back to HCLK = SYSCLK */", replace: ""}
        expect: ["wrong_clock", "wrong_freq"]
      - name: hse_not_enabled
        grader: final_state
