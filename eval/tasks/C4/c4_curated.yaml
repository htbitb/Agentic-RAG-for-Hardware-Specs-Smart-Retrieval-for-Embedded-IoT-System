  graders: [final_state, conflict_detected, compile]
  review_status: verified
  provenance:
    authored_by: "session P3 (Claude Sonnet 5.5); lời giải và phép tính tay độc lập với simulator và DRC"
    conflict_facts:
      - {"type": "af", "pin": "PA0", "signal": "TIM2_CH1", "af": 1}
      - {"type": "af", "pin": "PA1", "signal": "TIM2_CH2", "af": 1}
      - {"type": "af", "pin": "PA1", "signal": "TIM5_CH2", "af": 2}
      - {"type": "af", "pin": "PA6", "signal": "TIM3_CH1", "af": 2}
    evidence:
      - {"doc_id": "STM32G474_Datasheet", "page": 73, "contains": ["PA0 - TIM2_CH1 TIM5_CH1 - - - - USART2_CTS", "PA1 RTC_REFIN TIM2_CH2 TIM5_CH2"]}
      - {"doc_id": "STM32G474_RM0440", "page": 1294, "contains": ["The time-base unit includes: • Counter register (TIMx_CNT) • Prescaler register (TIMx_PSC) • Autoreload register (TIMx_ARR)."]}
      - {"doc_id": "STM32G474_RM0440", "page": 1318, "contains": ["a signal with a frequency determined by the value of the TIMx_ARR register and a duty cycle determined by the value of the TIMx_CCRx register"]}
      - {"doc_id": "STM32G474_RM0440", "page": 1287, "contains": ["The timers are completely independent, and do not share any resources."]}
      - {"doc_id": "STM32G474_RM0440", "page": 1179, "contains": ["high as long as TIMx_CNT < TIMx_CCRx"]}
      - {"doc_id": "STM32G474_RM0440", "page": 281, "contains": ["If the APB prescaler equals 1, the timer clock frequencies are set to the same frequency of the APB domain"]}
    reference_calc: >-
      Xung đột (TIMER_SHARED, lượt 2): TIM2 chỉ có một đơn vị cơ sở thời gian (TIMx_CNT, TIMx_PSC, TIMx_ARR; RM0440 §30.4.3 p.1294) chung cho mọi kênh; tần số PWM do TIMx_ARR (và PSC) quyết định, chỉ duty do từng TIMx_CCRx quyết định (§30.4.11 p.1318).
      Vì vậy CH1 (PA0) không thể ở 1 kHz trong khi CH2 (PA1) ở 50 Hz cùng trên TIM2. Phải chuyển một tín hiệu sang timer khác: PA1 còn là TIM5_CH2 (AF2, DS12288 Table 13 p.73) — TIM2…TIM5 độc lập, không chia sẻ tài nguyên (RM p.1287);
      hoặc servo sang TIM3_CH1 trên PA6 (AF2). Cách khác hợp lệ: chuyển PWM 1 kHz sang TIM5_CH1 trên PA0 (AF2) và giữ servo trên TIM2_CH2.
      TIM2/TIM5 trên APB1 với prescaler 1 ⇒ tim_ker_ck = PCLK1 = 170 MHz (RM p.281). TIM2: PSC = 169 ⇒ 170e6 / 170 = 1 MHz; ARR = 999 ⇒ 1000 nhịp = 1 ms ⇒ 1 kHz; CCR1 = 50 % × 1000 = 500 (RM p.1179: tim_ocxref cao khi CNT < CCR).
      TIM5 (32 bit): PSC = 169 ⇒ 1 MHz; ARR = 19999 ⇒ 20000 nhịp = 20 ms ⇒ 50 Hz; CCR2 = 1,5 ms / 1 µs = 1500 ⇒ duty 1500 / 20000 = 7,5 %. (Nếu dùng TIM3 16 bit: 170e6 / 50 = 3,4e6 nhịp > 65536 nên cần PSC + 1 ≥ 3,4e6 / 65536 = 51,9 ⇒ PSC ≥ 51; PSC = 169, ARR = 19999 vẫn vừa 16 bit.)
      PA0 = AF1 = TIM2_CH1, PA1 = AF2 = TIM5_CH2 (DS p.73). TIM2/TIM5 không phải timer advanced ⇒ không cần BDTR.MOE.
    reference_solution:
      turns:
        - |
          TIM2 sits on APB1 with prescaler 1, so its clock is 170 MHz. PSC = 169 gives a 1 MHz tick, ARR = 999 makes the period 1000 ticks = 1 ms (1 kHz) and CCR1 = 500 gives 50 %. PA0 is TIM2_CH1 on AF1.

          ```c
          #include "stm32g4xx.h"

          int main(void)
          {
              RCC->AHB2ENR |= RCC_AHB2ENR_GPIOAEN;
              RCC->APB1ENR1 |= RCC_APB1ENR1_TIM2EN;

              GPIOA->MODER = (GPIOA->MODER & ~GPIO_MODER_MODE0) | GPIO_MODER_MODE0_1;
              GPIOA->AFR[0] = (GPIOA->AFR[0] & ~GPIO_AFRL_AFSEL0) | (1U << GPIO_AFRL_AFSEL0_Pos);

              TIM2->PSC = 169;
              TIM2->ARR = 999;
              TIM2->CCR1 = 500;
              TIM2->CCMR1 = (TIM2->CCMR1 & ~TIM_CCMR1_OC1M) | (6U << TIM_CCMR1_OC1M_Pos) | TIM_CCMR1_OC1PE;
              TIM2->CCER |= TIM_CCER_CC1E;
              TIM2->CR1 |= TIM_CR1_ARPE;
              TIM2->EGR = TIM_EGR_UG;
              TIM2->CR1 |= TIM_CR1_CEN;

              while (1) { }
          }
          ```
        - |
          One thing to flag before the code:
          - **Shared timer:** all channels of TIM2 share the same counter, prescaler and auto-reload register (one time base), so TIM2 can generate only one PWM frequency: channel 1 cannot stay at 1 kHz while channel 2 runs at 50 Hz. The servo therefore needs a different timer. TIM5 channel 2 is also on PA1 (AF2), so the servo keeps its pin and moves to TIM5, a 32-bit timer on APB1 that is independent of TIM2.

          TIM5 is also clocked at 170 MHz: PSC = 169 gives a 1 MHz tick, ARR = 19999 gives a 20 ms period (50 Hz) and CCR2 = 1500 gives the 1.5 ms pulse (7.5 %). The PWM on PA0 is unchanged.

          ```c
          RCC->APB1ENR1 |= RCC_APB1ENR1_TIM5EN;
          GPIOA->MODER = (GPIOA->MODER & ~GPIO_MODER_MODE1) | GPIO_MODER_MODE1_1;
          GPIOA->AFR[0] = (GPIOA->AFR[0] & ~GPIO_AFRL_AFSEL1) | (2U << GPIO_AFRL_AFSEL1_Pos);
          TIM5->PSC = 169;
          TIM5->ARR = 19999;
          TIM5->CCR2 = 1500;
          TIM5->CCMR1 = (TIM5->CCMR1 & ~TIM_CCMR1_OC2M) | (6U << TIM_CCMR1_OC2M_Pos) | TIM_CCMR1_OC2PE;
          TIM5->CCER |= TIM_CCER_CC2E;
          TIM5->CR1 |= TIM_CR1_ARPE;
          TIM5->EGR = TIM_EGR_UG;
          TIM5->CR1 |= TIM_CR1_CEN;
          ```
        - |
          Here is the complete program: the 1 kHz PWM on PA0 from TIM2 channel 1 and the servo signal on PA1 from TIM5 channel 2.

          ```c
          #include "stm32g4xx.h"

          int main(void)
          {
              RCC->AHB2ENR |= RCC_AHB2ENR_GPIOAEN;
              RCC->APB1ENR1 |= RCC_APB1ENR1_TIM2EN | RCC_APB1ENR1_TIM5EN;

              /* PA0 = TIM2_CH1 (AF1): 1 kHz, 50 % */
              GPIOA->MODER = (GPIOA->MODER & ~GPIO_MODER_MODE0) | GPIO_MODER_MODE0_1;
              GPIOA->AFR[0] = (GPIOA->AFR[0] & ~GPIO_AFRL_AFSEL0) | (1U << GPIO_AFRL_AFSEL0_Pos);
              TIM2->PSC = 169;
              TIM2->ARR = 999;
              TIM2->CCR1 = 500;
              TIM2->CCMR1 = (TIM2->CCMR1 & ~TIM_CCMR1_OC1M) | (6U << TIM_CCMR1_OC1M_Pos) | TIM_CCMR1_OC1PE;
              TIM2->CCER |= TIM_CCER_CC1E;
              TIM2->CR1 |= TIM_CR1_ARPE;
              TIM2->EGR = TIM_EGR_UG;
              TIM2->CR1 |= TIM_CR1_CEN;

              /* PA1 = TIM5_CH2 (AF2): 50 Hz servo signal, 1.5 ms pulse */
              GPIOA->MODER = (GPIOA->MODER & ~GPIO_MODER_MODE1) | GPIO_MODER_MODE1_1;
              GPIOA->AFR[0] = (GPIOA->AFR[0] & ~GPIO_AFRL_AFSEL1) | (2U << GPIO_AFRL_AFSEL1_Pos);
              TIM5->PSC = 169;
              TIM5->ARR = 19999;
              TIM5->CCR2 = 1500;
              TIM5->CCMR1 = (TIM5->CCMR1 & ~TIM_CCMR1_OC2M) | (6U << TIM_CCMR1_OC2M_Pos) | TIM_CCMR1_OC2PE;
              TIM5->CCER |= TIM_CCER_CC2E;
              TIM5->CR1 |= TIM_CR1_ARPE;
              TIM5->EGR = TIM_EGR_UG;
              TIM5->CR1 |= TIM_CR1_CEN;

              while (1) { }
          }
          ```
