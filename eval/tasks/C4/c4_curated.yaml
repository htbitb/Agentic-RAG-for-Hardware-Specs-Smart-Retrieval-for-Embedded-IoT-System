- id: C4-014
  category: C4
  split: dev
  difficulty: medium
  chips:
  - stm32g474
  tags:
  - non_ft
  - uart
  turns:
  - user: 'I am designing the firmware of an STM32G474 board with you over several messages. Write bare-metal C that accesses registers the CMSIS way (e.g. `TIM1->PSC = ...;`, `RCC->APB2ENR |= RCC_APB2ENR_TIM1EN;`) using the register and bit names of ST''s `stm32g4xx.h` device header. Do not use HAL or LL drivers, `SystemCoreClock` or any other library function; write clock frequencies as numeric constants. Do not use interrupts; busy-wait loops on status flags are fine. Initial state: SYSCLK = HCLK = PCLK1 = PCLK2 = 170 MHz (PLL fed by HSI16, AHB/APB1/APB2 prescalers = 1, voltage Range 1 boost mode, Flash wait states already set); the board is powered at VDD = 3.3 V. Every peripheral clock that is off at reset is still off, and all GPIO pins are in their reset state. Answer every message with the relevant C code (in fenced C code blocks that follow these conventions) and a short explanation. Message 1: configure USART1 for 230400 baud with TX on pin PC4 and RX on pin PC5: 8 data bits, no parity, 1 stop bit, oversampling by 16, both directions enabled, and the baud-rate register written before the USART is enabled.'
  - user: 'Message 2: the receive line is driven by a LiDAR sensor that is powered from 5 V; its serial output swings between 0 V and 5 V and runs at the same 230400 baud, 8N1. The sensor cable goes straight to the USART1 RX pin of the board, and the board has no room for any extra component. Update the USART1 configuration for this sensor.'
  - user: 'Message 3: please give me the complete initialisation program for the whole design so far (USART1 with the LiDAR sensor) as one C code block (`#include "stm32g4xx.h"`, then a `main()` that configures everything and finally loops forever with `while (1)`), followed by a short explanation.'
  expected:
    chip: stm32g474
    initial: sysclk_170mhz_pll_hsi16_apb_div1
    spec:
    - {type: uart, instance: USART1, baud: 230400, tol_pct: 2, rx_not_in: [PC5], require_pins: true, frame: 8N1, te: true, re: true, over8: 0}
    must_detect:
    - {code: 'NOT_5V_TOLERANT:PC5', turn: 1, from_turn: 1}
    must_not:
    - {code: unsafe_connection, pin: PC5}
  graders:
  - final_state
  - conflict_detected
  - compile
  review_status: verified
  provenance:
    authored_by: session P3 (Claude Sonnet 5.5); lời giải và phép tính tay độc lập với simulator và DRC
    conflict_facts:
    - {type: ft, pin: PC5, tolerant: false}
    - {type: ft, pin: PA10, tolerant: true}
    - {type: ft, pin: PB7, tolerant: true}
    - {type: af, pin: PC5, signal: USART1_RX, af: 7}
    - {type: af, pin: PC4, signal: USART1_TX, af: 7}
    - {type: af, pin: PA10, signal: USART1_RX, af: 7}
    - {type: af, pin: PB7, signal: USART1_RX, af: 7}
    evidence:
    - {doc_id: STM32G474_Datasheet, page: 56, contains: [FT 5 V tolerant I/O, TT 3.6 V tolerant I/O]}
    - {doc_id: STM32G474_Datasheet, page: 61, contains: [PC5 I/O TT_a]}
    - {doc_id: STM32G474_Datasheet, page: 66, contains: [PA10 I/O FT_fda]}
    - {doc_id: STM32G474_Datasheet, page: 71, contains: [PB7 I/O FT_f]}
    - {doc_id: STM32G474_Datasheet, page: 84, contains: [TT_xx -0.3 V DD+0.3]}
    - {doc_id: STM32G474_Datasheet, page: 75, contains: [PC4 - - TIM1_ETR - I2C2_SCL -- USART1_TX, PC5 - - TIM15_BKIN SAI1_D3 - - TIM1_CH4N USART1_RX]}
    - {doc_id: STM32G474_Datasheet, page: 73, contains: [PA10 - TIM17_BKIN - USB_CRS_SYNC I2C2_SMBA SPI2_MISO TIM1_CH3 USART1_RX]}
    - {doc_id: STM32G474_Datasheet, page: 74, contains: [PB7 - TIM17_CH1N TIM4_CH2 I2C4_SDA I2C1_SDA TIM8_BKIN - USART1_RX]}
    - {doc_id: STM32G474_RM0440, page: 1708, contains: ['When OVER8 = 0, BRR = USARTDIV.']}
    reference_calc: "Xung đột (chân không chịu 5 V): PC5 có cấu trúc I/O TT_a (DS12288 Table 12, p.61); theo chú giải Table 11 (p.56) 'FT' = 5 V tolerant, 'TT' = 3.6 V tolerant, và Table 17 (p.84) giới hạn điện áp vào của TT_xx là −0,3 V … VDD + 0,3 V = 3,6 V (VDD = 3,3 V) ⇒ ngõ ra 0–5 V của LiDAR không được nối thẳng vào PC5. USART1_RX còn ở PA10 (AF7, FT_fda, p.66, 73) và PB7 (AF7, FT_f, p.71, 74) — đều FT và có trong LQFP64 (PE1 cũng là USART1_RX nhưng không có ở LQFP64); chọn PA10, giữ TX ở PC4 (AF7, FT_fa). Đề nói rõ không có chỗ cho linh kiện phụ nên cách sửa duy nhất là đổi chân RX sang chân FT. USART1 ở APB2, USART1SEL reset = PCLK2 = 170 MHz (quy tắc ×2 chỉ áp cho timer): OVER8 = 0 ⇒ BRR = USARTDIV (RM0440 §40.5.7, p.1708); USARTDIV = 170e6 / 230400 = 737,85 ⇒ BRR = 738 ⇒ baud thực = 170e6 / 738 = 230352 (−0,021 %); BRR chỉ được ghi khi UE = 0. Clock: GPIOA/GPIOC = AHB2ENR bit 0/2, USART1EN = APB2ENR bit 14."
    reference_solution:
      turns:
      - |
        USART1 sits on APB2, so its kernel clock is PCLK2 = 170 MHz (USART1SEL = PCLK2 at reset). With OVER8 = 0, USARTDIV = 170 MHz / 230400 = 737.85, so BRR = 738 (230352 baud, -0.02 %); BRR is written while UE = 0. PC4 = USART1_TX and PC5 = USART1_RX are both AF7.

        ```c
        #include "stm32g4xx.h"

        int main(void)
        {
            RCC->AHB2ENR |= RCC_AHB2ENR_GPIOCEN;
            RCC->APB2ENR |= RCC_APB2ENR_USART1EN;

            GPIOC->MODER = (GPIOC->MODER & ~(GPIO_MODER_MODE4 | GPIO_MODER_MODE5)) | GPIO_MODER_MODE4_1 | GPIO_MODER_MODE5_1;
            GPIOC->AFR[0] = (GPIOC->AFR[0] & ~(GPIO_AFRL_AFSEL4 | GPIO_AFRL_AFSEL5)) | (7U << GPIO_AFRL_AFSEL4_Pos) | (7U << GPIO_AFRL_AFSEL5_Pos);   /* AF7 */

            USART1->BRR = 738;
            USART1->CR1 = USART_CR1_UE | USART_CR1_TE | USART_CR1_RE;

            while (1) { }
        }
        ```
      - |
        **Not 5 V tolerant:** PC5 is a TT_a pin, which is not 5 V tolerant (a TT pin accepts at most VDD + 0.3 V, i.e. 3.6 V), so the 0-5 V output of the LiDAR must not be wired directly to PC5. USART1_RX is also available on PA10 (AF7, FT_fda) and on PB7 (AF7, FT_f), which are 5 V tolerant pins; I move RX to PA10 and keep TX on PC4.

        The baud rate does not change (BRR = 738), only the RX pin does: replace the PC5 lines of the previous program by the PA10 lines below.

        ```c
        RCC->AHB2ENR |= RCC_AHB2ENR_GPIOAEN;
        GPIOA->MODER = (GPIOA->MODER & ~GPIO_MODER_MODE10) | GPIO_MODER_MODE10_1;
        GPIOA->AFR[1] = (GPIOA->AFR[1] & ~GPIO_AFRH_AFSEL10) | (7U << GPIO_AFRH_AFSEL10_Pos);     /* PA10: AF7 = USART1_RX */
        ```
      - |
        Here is the complete program: USART1 with TX on PC4 and RX on PA10 (a 5 V tolerant pin), so the LiDAR output can be wired to PA10 with a plain cable.

        ```c
        #include "stm32g4xx.h"

        int main(void)
        {
            RCC->AHB2ENR |= RCC_AHB2ENR_GPIOAEN | RCC_AHB2ENR_GPIOCEN;
            RCC->APB2ENR |= RCC_APB2ENR_USART1EN;

            /* PC4 = USART1_TX (AF7) */
            GPIOC->MODER = (GPIOC->MODER & ~GPIO_MODER_MODE4) | GPIO_MODER_MODE4_1;
            GPIOC->AFR[0] = (GPIOC->AFR[0] & ~GPIO_AFRL_AFSEL4) | (7U << GPIO_AFRL_AFSEL4_Pos);
            /* PA10 = USART1_RX (AF7) */
            GPIOA->MODER = (GPIOA->MODER & ~GPIO_MODER_MODE10) | GPIO_MODER_MODE10_1;
            GPIOA->AFR[1] = (GPIOA->AFR[1] & ~GPIO_AFRH_AFSEL10) | (7U << GPIO_AFRH_AFSEL10_Pos);

            /* 230400 baud, 8N1, oversampling by 16 */
            USART1->BRR = 738;
            USART1->CR1 = USART_CR1_UE | USART_CR1_TE | USART_CR1_RE;

            while (1) { }
        }
        ```
    valid_variants:
    - name: both_directions_moved_to_pa9_pa10
      note: "only RX is constrained by the user's message; moving TX as well to the standard USART1 pair PA9/PA10 (both FT) is an equally valid fix"
      edits:
      - {turn: 2, find: "GPIOC->MODER = (GPIOC->MODER & ~GPIO_MODER_MODE4) | GPIO_MODER_MODE4_1;", replace: "GPIOA->MODER = (GPIOA->MODER & ~GPIO_MODER_MODE9) | GPIO_MODER_MODE9_1;"}
      - {turn: 2, find: "GPIOC->AFR[0] = (GPIOC->AFR[0] & ~GPIO_AFRL_AFSEL4) | (7U << GPIO_AFRL_AFSEL4_Pos);", replace: "GPIOA->AFR[1] = (GPIOA->AFR[1] & ~GPIO_AFRH_AFSEL9) | (7U << GPIO_AFRH_AFSEL9_Pos);"}
    wrong_variants:
    - name: rx_kept_on_pc5
      grader: final_state
      edits:
      - {turn: 2, find: GPIOA->MODER = (GPIOA->MODER & ~GPIO_MODER_MODE10) | GPIO_MODER_MODE10_1;, replace: GPIOC->MODER = (GPIOC->MODER & ~GPIO_MODER_MODE5) | GPIO_MODER_MODE5_1;}
      - {turn: 2, find: 'GPIOA->AFR[1] = (GPIOA->AFR[1] & ~GPIO_AFRH_AFSEL10) | (7U << GPIO_AFRH_AFSEL10_Pos);', replace: 'GPIOC->AFR[0] = (GPIOC->AFR[0] & ~GPIO_AFRL_AFSEL5) | (7U << GPIO_AFRL_AFSEL5_Pos);'}
      expect:
      - forbidden_pin_used
    - name: forgot_gpioa_clock
      grader: final_state
      edits:
      - {turn: 2, find: RCC->AHB2ENR |= RCC_AHB2ENR_GPIOAEN | RCC_AHB2ENR_GPIOCEN;, replace: RCC->AHB2ENR |= RCC_AHB2ENR_GPIOCEN;}
      expect:
      - sim_violation:SIM-CLK-GATE
    - name: baud_of_115200
