    reference_calc: 'Giới hạn: Range 1 có hai chế độ theo PWR_CR5.R1MODE (RM0440 §6.1.5 p.232, Table 38 p.232): R1MODE = 1 ⇒ normal, SYSCLK ≤ 150 MHz; R1MODE = 0 ⇒ boost, SYSCLK ≤ 170 MHz. PWR_CR5 có reset value 0x0000 0100 ⇒ R1MODE = 1 sau reset (p.267); DS12288 Table 46 (p.123): fPLL_R_OUT ≤ 150 MHz ở Range 1 normal, 170 MHz ở boost. Yêu cầu R1MODE = 1 ở message 2 (turn 1, 0-based) mâu thuẫn với SYSCLK = 170 MHz đã nêu từ message 1 và nhắc lại ở message 2 ⇒ CLOCK_LIMIT:SYSCLK, do người dùng gây ra ở turn 1. Hai cách sửa hợp lệ: (a) xoá R1MODE (boost, RM p.233: ''clearing the R1MODE bit'') và giữ 170 MHz (HSI16/4 × 85 / 2; VCO = 340 MHz ≤ 344); (b) giữ R1MODE = 1 và hạ SYSCLK xuống 150 MHz. Tham chiếu chọn (b) vì người dùng muốn tiết kiệm điện (boost tốn điện hơn): 16 MHz / 4 = 4 MHz (trong [2,66; 16] MHz), N = 75 ⇒ VCO = 300 MHz (trong [96; 344]), R = 2 ⇒ 150 MHz (≤ 150, DS Table 46). PLLM mã hoá M−1 (0011 = /4), PLLR[1:0] = 00 ⇒ /2 (RM p.292–293). Flash: RM Table 9 (p.98) cho 4 WS đến 150 MHz ở normal mode ⇒ LATENCY = 4. Chuyển HSI16 → PLL khi HCLK > 80 MHz phải qua trạng thái trung gian AHB /2, chờ ≥ 1 µs rồi trả về /1 (RM p.279–280). PWM: TIM1 trên APB2 prescaler 1 ⇒ TIM1CLK = PCLK2 = SYSCLK = 150 MHz (RM §7.2.13 p.281): 150e6 / 20e3 = 7500 nhịp ⇒ PSC = 0, ARR = 7499, CCR1 = 25 % × 7500 = 1875 (RM §29.3.13 p.1179). Nếu quên đổi: ARR = 8499 (cho 170 MHz) ⇒ 150e6 / 8500 = 17,65 kHz (−11,8 %). PA8 = AF6 = TIM1_CH1 (DS12288 Table 13 p.73); TIM1 là advanced timer ⇒ BDTR.MOE = 1.'
    reference_solution:
      turns:
      - |
        To reach 170 MHz from HSI16 the PLL runs at HSI16 / 4 = 4 MHz (PLLM code 3), x 85 (PLLN) = 340 MHz VCO, / 2 (PLLR code 0) = 170 MHz, and PLLREN must be set so that the R output can feed the system clock. The sequence is: enable the PWR clock and select the Range 1 boost mode (clear PWR_CR5.R1MODE), set 4 Flash wait states, configure and start the PLL, switch to it with the AHB prescaler at /2 for a moment (HCLK above 80 MHz, RM0440 p.279-280) and then restore /1.

        ```c
        #include "stm32g4xx.h"

        int main(void)
        {
            RCC->APB1ENR1 |= RCC_APB1ENR1_PWREN;
            (void)RCC->APB1ENR1;                                               /* dummy read: delay before the first PWR access */
            PWR->CR5 &= ~PWR_CR5_R1MODE;                                       /* Range 1 boost mode */
            FLASH->ACR = (FLASH->ACR & ~FLASH_ACR_LATENCY) | FLASH_ACR_LATENCY_4WS;

            /* HSI16 / 4 = 4 MHz, x 85 = 340 MHz VCO, / 2 = 170 MHz */
            RCC->PLLCFGR = RCC_PLLCFGR_PLLSRC_HSI | (3U << RCC_PLLCFGR_PLLM_Pos) | (85U << RCC_PLLCFGR_PLLN_Pos) | RCC_PLLCFGR_PLLREN;
            RCC->CR |= RCC_CR_PLLON;
            while (!(RCC->CR & RCC_CR_PLLRDY)) { }

            RCC->CFGR = (RCC->CFGR & ~RCC_CFGR_HPRE) | RCC_CFGR_HPRE_DIV2;    /* AHB / 2 during the switch */
            RCC->CFGR = (RCC->CFGR & ~RCC_CFGR_SW) | RCC_CFGR_SW_PLL;
            while ((RCC->CFGR & RCC_CFGR_SWS) != RCC_CFGR_SWS_PLL) { }
            for (volatile int i = 0; i < 100; i++) { }                         /* wait >= 1 us */
            RCC->CFGR = (RCC->CFGR & ~RCC_CFGR_HPRE) | RCC_CFGR_HPRE_DIV1;    /* back to HCLK = SYSCLK */

            while (1) { }
        }
        ```
      - |
        One thing to flag before the code:
        - **Clock limit:** Range 1 normal mode (PWR_CR5.R1MODE = 1) only supports a system clock up to 150 MHz (RM0440 Table 38; DS12288 Table 46 also limits the PLL R output to 150 MHz in this mode), so SYSCLK = 170 MHz cannot be reached with R1MODE = 1: the 170 MHz of message 1 needs the boost mode (R1MODE = 0). Because you asked for the normal mode to save power, I keep R1MODE = 1 (its reset value, so no PWR access at all) and lower SYSCLK to 150 MHz, the highest frequency of this mode. If 170 MHz is mandatory instead, keep the code of message 1 with R1MODE cleared.

        The PLL becomes HSI16 / 4 = 4 MHz, x 75 = 300 MHz VCO, / 2 = 150 MHz; the Flash still needs 4 wait states (RM0440 Table 9) and the AHB /2 transition is kept because HCLK ends above 80 MHz.

        ```c
        #include "stm32g4xx.h"

        int main(void)
        {
            FLASH->ACR = (FLASH->ACR & ~FLASH_ACR_LATENCY) | FLASH_ACR_LATENCY_4WS;       /* 4 wait states */

            /* HSI16 / 4 = 4 MHz, x 75 = 300 MHz VCO, / 2 = 150 MHz */
            RCC->PLLCFGR = RCC_PLLCFGR_PLLSRC_HSI | (3U << RCC_PLLCFGR_PLLM_Pos) | (75U << RCC_PLLCFGR_PLLN_Pos) | RCC_PLLCFGR_PLLREN;
            RCC->CR |= RCC_CR_PLLON;
            while (!(RCC->CR & RCC_CR_PLLRDY)) { }

            RCC->CFGR = (RCC->CFGR & ~RCC_CFGR_HPRE) | RCC_CFGR_HPRE_DIV2;    /* AHB / 2 during the switch */
            RCC->CFGR = (RCC->CFGR & ~RCC_CFGR_SW) | RCC_CFGR_SW_PLL;
            while ((RCC->CFGR & RCC_CFGR_SWS) != RCC_CFGR_SWS_PLL) { }
            for (volatile int i = 0; i < 100; i++) { }                         /* wait >= 1 us */
            RCC->CFGR = (RCC->CFGR & ~RCC_CFGR_HPRE) | RCC_CFGR_HPRE_DIV1;    /* back to HCLK = SYSCLK */

            while (1) { }
        }
        ```
      - |
        Here is the complete program: the clock tree at 150 MHz (Range 1 normal mode, R1MODE = 1 as after reset) and the PWM on PA8. As explained, SYSCLK stays at 150 MHz because the normal mode cannot run the system clock at 170 MHz. TIM1 sits on APB2 with prescaler 1, so TIM1CLK = 150 MHz (not 170 MHz) and 150 MHz / 20 kHz = 7500 ticks, i.e. PSC = 0, ARR = 7499 and CCR1 = 25 % x 7500 = 1875. TIM1 is an advanced timer, so BDTR.MOE must be set.

        ```c
        #include "stm32g4xx.h"

        int main(void)
        {
            FLASH->ACR = (FLASH->ACR & ~FLASH_ACR_LATENCY) | FLASH_ACR_LATENCY_4WS;       /* 4 wait states */

            /* HSI16 / 4 = 4 MHz, x 75 = 300 MHz VCO, / 2 = 150 MHz */
            RCC->PLLCFGR = RCC_PLLCFGR_PLLSRC_HSI | (3U << RCC_PLLCFGR_PLLM_Pos) | (75U << RCC_PLLCFGR_PLLN_Pos) | RCC_PLLCFGR_PLLREN;
            RCC->CR |= RCC_CR_PLLON;
            while (!(RCC->CR & RCC_CR_PLLRDY)) { }

            RCC->CFGR = (RCC->CFGR & ~RCC_CFGR_HPRE) | RCC_CFGR_HPRE_DIV2;    /* AHB / 2 during the switch */
            RCC->CFGR = (RCC->CFGR & ~RCC_CFGR_SW) | RCC_CFGR_SW_PLL;
            while ((RCC->CFGR & RCC_CFGR_SWS) != RCC_CFGR_SWS_PLL) { }
            for (volatile int i = 0; i < 100; i++) { }                         /* wait >= 1 us */
            RCC->CFGR = (RCC->CFGR & ~RCC_CFGR_HPRE) | RCC_CFGR_HPRE_DIV1;    /* back to HCLK = SYSCLK */

            RCC->AHB2ENR |= RCC_AHB2ENR_GPIOAEN;
            RCC->APB2ENR |= RCC_APB2ENR_TIM1EN;

            /* PWM: PA8 = TIM1_CH1 (AF6), 20 kHz, 25 % */
            GPIOA->MODER = (GPIOA->MODER & ~GPIO_MODER_MODE8) | GPIO_MODER_MODE8_1;
            GPIOA->AFR[1] = (GPIOA->AFR[1] & ~GPIO_AFRH_AFSEL8) | (6U << GPIO_AFRH_AFSEL8_Pos);
            TIM1->PSC = 0;
            TIM1->ARR = 7499;
            TIM1->CCR1 = 1875;
            TIM1->CCMR1 = (TIM1->CCMR1 & ~TIM_CCMR1_OC1M) | (6U << TIM_CCMR1_OC1M_Pos) | TIM_CCMR1_OC1PE;
            TIM1->CCER |= TIM_CCER_CC1E;
            TIM1->BDTR |= TIM_BDTR_MOE;
            TIM1->CR1 |= TIM_CR1_ARPE;
            TIM1->EGR = TIM_EGR_UG;
            TIM1->CR1 |= TIM_CR1_CEN;

            while (1) { }
        }
        ```
