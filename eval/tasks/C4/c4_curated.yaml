    reference_calc: "Xung đột (chân): từ lượt 1 PB10 mang USART3_TX (AF7); TIM2_CH3 cũng nằm ở PB10 (AF1) nên một chân chỉ có một AF tại một thời điểm (DS12288 Table 13, p.74): không thể vừa là USART3_TX vừa là TIM2_CH3. Cách sửa: giữ USART3 ở PB10/PB11 và đặt PWM ở chân TIM2_CH3 khác có trong LQFP64 — PA2 (AF1; PA9 với AF10 cũng là TIM2_CH3 và có trong LQFP64, còn PD7 AF2 thì không có ở LQFP64) — hoặc chuyển USART3_TX sang PC10 (AF7, p.75) và giữ PWM ở PB10; cả hai đều thoả spec. USART3 ở APB1, USART3SEL reset = PCLK1 = 170 MHz: OVER8 = 0 ⇒ BRR = USARTDIV (RM0440 p.1708); USARTDIV = 170e6 / 115200 = 1475,69 ⇒ BRR = 1476 ⇒ 115176 baud (−0,02 %); BRR chỉ ghi khi UE = 0. PWM: TIM2 ở APB1 prescaler 1 ⇒ TIM2CLK = 170 MHz; TIM2 là bộ đếm 32 bit (RM p.1389: ARR[31:0]); 170e6 / 5e3 = 34000 nhịp ⇒ PSC = 0, ARR = 33999, CCR3 = 80 % × 34000 = 27200 (RM p.1319: tim_ocxref cao khi CNT < CCR). Kênh 3 cấu hình trong CCMR2 (OC3M, OC3PE), bật bằng CCER.CC3E; TIM2 không có BDTR/MOE. Clock: GPIOA/GPIOB = AHB2ENR bit 0/1, TIM2EN = APB1ENR1 bit 0, USART3EN = APB1ENR1 bit 18."
    reference_solution:
      turns:
      - |
        USART3 sits on APB1, so its kernel clock is PCLK1 = 170 MHz (USART3SEL = PCLK1 at reset). With OVER8 = 0, USARTDIV = 170 MHz / 115200 = 1475.69, so BRR = 1476 (115176 baud, -0.02 %); BRR is written while UE = 0. PB10 = USART3_TX and PB11 = USART3_RX are both AF7.

        ```c
        #include "stm32g4xx.h"

        int main(void)
        {
            RCC->AHB2ENR |= RCC_AHB2ENR_GPIOBEN;
            RCC->APB1ENR1 |= RCC_APB1ENR1_USART3EN;

            GPIOB->MODER = (GPIOB->MODER & ~(GPIO_MODER_MODE10 | GPIO_MODER_MODE11)) | GPIO_MODER_MODE10_1 | GPIO_MODER_MODE11_1;
            GPIOB->AFR[1] = (GPIOB->AFR[1] & ~(GPIO_AFRH_AFSEL10 | GPIO_AFRH_AFSEL11)) | (7U << GPIO_AFRH_AFSEL10_Pos) | (7U << GPIO_AFRH_AFSEL11_Pos);   /* AF7 */

