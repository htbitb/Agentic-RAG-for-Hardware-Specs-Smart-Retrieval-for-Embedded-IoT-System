- id: C4-005
  category: C4
  split: test
  difficulty: hard
  chips: [stm32g474]
  tags: [clock_limit, pwm, pll]
  turns:
    - user: "I am designing the firmware of an STM32G474 board with you over several messages. Write bare-metal C that accesses registers the CMSIS way (e.g. `TIM1->PSC = ...;`, `RCC->APB2ENR |= RCC_APB2ENR_TIM1EN;`) using the register and bit names of ST's `stm32g4xx.h` device header. Do not use HAL or LL drivers, `SystemCoreClock` or any other library function; write clock frequencies as numeric constants. Do not use interrupts; busy-wait loops on status flags are fine. Initial state: the chip has just come out of reset: SYSCLK = HCLK = PCLK1 = PCLK2 = 16 MHz (HSI16), all prescalers are 1, no peripheral clock beyond the reset defaults is enabled, and all GPIO pins are in their reset state; the board is powered at VDD = 3.3 V and has an 8 MHz crystal connected to the HSE oscillator. Answer every message with the relevant C code (in fenced C code blocks that follow these conventions) and a short explanation. Message 1: configure the clock tree so that SYSCLK = HCLK = PCLK1 = PCLK2 = 170 MHz, using the PLL fed by HSE (AHB, APB1 and APB2 prescalers = 1). The resulting clock frequencies must be accurate to within 0.1 %; wait for each oscillator/PLL to be ready before using it and for the clock switch to take effect (busy-wait on the status flags)."
    - user: "Message 2: now add a 100 kHz PWM signal with a 50 % duty cycle on pin PA8 (TIM1 channel 1) for a switching power stage; edge-aligned PWM mode 1, active-high output, no dead time. To get a finer duty-cycle resolution, raise SYSCLK to 200 MHz as well (keep the AHB, APB1 and APB2 prescalers at 1)."
    - user: "Message 3: please give me the complete initialisation program for the whole design so far (the clock tree and the PWM) as one C code block (`#include \"stm32g4xx.h\"`, then a `main()` that configures everything and finally loops forever with `while (1)`), followed by a short explanation. The PWM must still come out at 100 kHz with a 50 % duty cycle."
  expected:
    chip: stm32g474
    initial: "reset"
    hse_hz: 8000000
    spec:
      - {"type": "clock", "sysclk_hz": 170000000, "hclk_hz": 170000000, "pclk1_hz": 170000000, "pclk2_hz": 170000000, "tol_pct": 0.1}
      - {"type": "pwm", "pin": "PA8", "freq_hz": 100000, "duty_pct": 50, "tol_pct": 1}
    must_detect:
      - {"code": "CLOCK_LIMIT:SYSCLK", "turn": 1, "from_turn": 1}
  graders: [final_state, conflict_detected, compile]
  review_status: verified
  provenance:
    authored_by: "session P3 (Claude Sonnet 5.5); lời giải và phép tính tay độc lập với simulator và DRC"
    conflict_facts:
      - {"type": "clock_limit", "like": "%HCLK%", "max": 170}
      - {"type": "clock_limit", "like": "PLL VCO output", "max": 344}
      - {"type": "af", "pin": "PA8", "signal": "TIM1_CH1", "af": 6}
    evidence:
      - {"doc_id": "STM32G474_RM0440", "page": 279, "contains": ["The system clock maximum frequency is 170 MHz."]}
      - {"doc_id": "STM32G474_RM0440", "page": 232, "contains": ["Table 38. Range 1 boost mode configuration", "It is used when the system clock frequency is up to 170 MHz."]}
      - {"doc_id": "STM32G474_Datasheet", "page": 84, "contains": ["fHCLK Internal AHB clock frequency - 0 170"]}
      - {"doc_id": "STM32G474_Datasheet", "page": 123, "contains": ["fVCO_OUT PLL VCO output", "Voltage scaling Range 1 96 - 344"]}
      - {"doc_id": "STM32G474_Datasheet", "page": 117, "contains": ["fOSC_IN Oscillator frequency - 4 8 48 MHz"]}
      - {"doc_id": "STM32G474_RM0440", "page": 291, "contains": ["f(VCO clock) = f(PLL clock input) × (PLLN / PLLM)"]}
      - {"doc_id": "STM32G474_RM0440", "page": 293, "contains": ["11: HSE clock selected as PLL clock entry"]}
      - {"doc_id": "STM32G474_RM0440", "page": 233, "contains": ["Select the Range 1 boost mode by clearing the R1MODE bit", "Wait for at least 1us and then reconfigure the AHB prescaler to get the needed HCLK clock frequency."]}
      - {"doc_id": "STM32G474_RM0440", "page": 98, "contains": ["4 WS (5 CPU cycles) ≤ 170 ≤ 150"]}
      - {"doc_id": "STM32G474_RM0440", "page": 1179, "contains": ["high as long as TIMx_CNT < TIMx_CCRx"]}
    reference_calc: >-
      Xung đột (CLOCK_LIMIT:SYSCLK, lượt 2): người dùng đòi SYSCLK = 200 MHz, nhưng tần số tối đa của system clock là 170 MHz (RM0440 p.279 "The system clock maximum frequency is 170 MHz."; DS12288 Table 17 p.84: fHCLK max 170 MHz; RM Table 38 p.232: boost mode dùng đến 170 MHz).
      Ngoài ra không có (M, N, R) nào cho 200 MHz từ HSE 8 MHz: SYSCLK = f_VCO / R với R ≥ 2 ⇒ f_VCO ≥ 400 MHz > 344 MHz (DS Table 46 p.123, Range 1). Vì vậy giữ SYSCLK = 170 MHz (mức cao nhất cho phép).
      PLL (RM0440 §7.4.4 p.291–293): f_VCO = f_in × PLLN / PLLM; PLLM mã hoá M−1 (mã 1 ⇒ M = 2); PLLR[1:0] = 00 ⇒ /2; PLLSRC = 11 là HSE. HSE 8 MHz / 2 = 4 MHz (trong [2,66; 16] MHz, DS Table 46); N = 85 ⇒ VCO = 340 MHz (≤ 344); R = 2 ⇒ 170 MHz.
      170 MHz > 150 MHz ⇒ phải xoá PWR_CR5.R1MODE (boost mode; RM Table 38 p.232, bước ở p.233; cần bật PWREN) và FLASH_ACR.LATENCY = 4 (RM Table 9 p.98: 4 WS đến 170 MHz); chia HCLK cho 2 trước khi chuyển lên tần số cao hơn, rồi chờ ≥ 1 µs mới trả AHB prescaler về /1 (RM0440 p.233).
      HSEON phải chờ HSERDY trước khi bật PLLON (PLLSRC = HSE). TIM1 ở APB2 với prescaler 1 ⇒ TIM1CLK = PCLK2 = 170 MHz (RM p.281): 170e6 / 100e3 = 1700 nhịp ⇒ PSC = 0, ARR = 1699, CCR1 = 50 % × 1700 = 850 (RM p.1179); TIM1 là advanced timer ⇒ BDTR.MOE. PA8 = AF6 = TIM1_CH1 (DS p.73).
      Với 200 MHz giả định sẽ là 2000 nhịp (ARR = 1999, bước duty 0,050 % thay vì 0,059 %, tức nhỏ hơn 15 %) — lợi ích nhỏ và không đạt được.
    reference_solution:
      turns:
        - |
          The PLL is fed by HSE: 8 MHz / 2 (PLLM code 1) = 4 MHz at the PLL input, x 85 = 340 MHz at the VCO, / 2 (PLLR = 00) = 170 MHz. Because the target is above 150 MHz, the regulator has to be in Range 1 boost mode (clear PWR_CR5.R1MODE after enabling the PWR clock), the Flash needs 4 wait states, and the AHB prescaler is set to /2 while switching to the PLL and back to /1 after at least 1 us.

          ```c
          #include "stm32g4xx.h"

          int main(void)
          {
              RCC->APB1ENR1 |= RCC_APB1ENR1_PWREN;
              (void)RCC->APB1ENR1;                                           /* dummy read: delay before the first PWR access */
              PWR->CR5 &= ~PWR_CR5_R1MODE;                                   /* Range 1 boost mode */
              FLASH->ACR = (FLASH->ACR & ~FLASH_ACR_LATENCY) | FLASH_ACR_LATENCY_4WS;

              RCC->CR |= RCC_CR_HSEON;
              while (!(RCC->CR & RCC_CR_HSERDY)) { }

              /* HSE 8 MHz / 2 = 4 MHz, x 85 = 340 MHz VCO, / 2 = 170 MHz */
              RCC->PLLCFGR = RCC_PLLCFGR_PLLSRC_HSE | (1U << RCC_PLLCFGR_PLLM_Pos) | (85U << RCC_PLLCFGR_PLLN_Pos) | RCC_PLLCFGR_PLLREN;
              RCC->CR |= RCC_CR_PLLON;
              while (!(RCC->CR & RCC_CR_PLLRDY)) { }

              RCC->CFGR = (RCC->CFGR & ~RCC_CFGR_HPRE) | RCC_CFGR_HPRE_DIV2;    /* AHB / 2 while switching */
              RCC->CFGR = (RCC->CFGR & ~RCC_CFGR_SW) | RCC_CFGR_SW_PLL;
              while ((RCC->CFGR & RCC_CFGR_SWS) != RCC_CFGR_SWS_PLL) { }
              for (volatile int i = 0; i < 100; i++) { }                         /* wait at least 1 us */
              RCC->CFGR = (RCC->CFGR & ~RCC_CFGR_HPRE) | RCC_CFGR_HPRE_DIV1;    /* back to HCLK = SYSCLK */

              while (1) { }
          }
          ```
        - |
          One thing to flag before the code:
          - **Clock limit:** SYSCLK cannot be raised to 200 MHz: 200 MHz exceeds the maximum system clock frequency of the STM32G474, which is 170 MHz (RM0440: "The system clock maximum frequency is 170 MHz"; DS12288 Table 17: fHCLK max 170 MHz), and the PLL could not produce it from the 8 MHz crystal anyway because the VCO would have to run at 400 MHz, above its 344 MHz maximum. So SYSCLK stays at 170 MHz, which already gives 1700 timer ticks per 100 kHz period (a duty step of 0.059 %).

          TIM1 is on APB2 with prescaler 1, so TIM1CLK = 170 MHz and 170 MHz / 100 kHz = 1700 ticks: PSC = 0, ARR = 1699 and CCR1 = 50 % x 1700 = 850. TIM1 is an advanced timer, so BDTR.MOE must be set.

          ```c
          RCC->AHB2ENR |= RCC_AHB2ENR_GPIOAEN;
          RCC->APB2ENR |= RCC_APB2ENR_TIM1EN;
          GPIOA->MODER = (GPIOA->MODER & ~GPIO_MODER_MODE8) | GPIO_MODER_MODE8_1;
          GPIOA->AFR[1] = (GPIOA->AFR[1] & ~GPIO_AFRH_AFSEL8) | (6U << GPIO_AFRH_AFSEL8_Pos);
          TIM1->PSC = 0;
          TIM1->ARR = 1699;
          TIM1->CCR1 = 850;
          TIM1->CCMR1 = (TIM1->CCMR1 & ~TIM_CCMR1_OC1M) | (6U << TIM_CCMR1_OC1M_Pos) | TIM_CCMR1_OC1PE;
          TIM1->CCER |= TIM_CCER_CC1E;
          TIM1->BDTR |= TIM_BDTR_MOE;
          TIM1->CR1 |= TIM_CR1_ARPE;
          TIM1->EGR = TIM_EGR_UG;
          TIM1->CR1 |= TIM_CR1_CEN;
          ```
        - |
          Here is the complete program: the PLL from the 8 MHz crystal at 170 MHz, then the 100 kHz / 50 % PWM on PA8 (TIM1 channel 1).

          ```c
          #include "stm32g4xx.h"

          int main(void)
          {
              RCC->APB1ENR1 |= RCC_APB1ENR1_PWREN;
              (void)RCC->APB1ENR1;                                           /* dummy read: delay before the first PWR access */
              PWR->CR5 &= ~PWR_CR5_R1MODE;                                   /* Range 1 boost mode */
              FLASH->ACR = (FLASH->ACR & ~FLASH_ACR_LATENCY) | FLASH_ACR_LATENCY_4WS;

              RCC->CR |= RCC_CR_HSEON;
              while (!(RCC->CR & RCC_CR_HSERDY)) { }

              /* HSE 8 MHz / 2 = 4 MHz, x 85 = 340 MHz VCO, / 2 = 170 MHz */
              RCC->PLLCFGR = RCC_PLLCFGR_PLLSRC_HSE | (1U << RCC_PLLCFGR_PLLM_Pos) | (85U << RCC_PLLCFGR_PLLN_Pos) | RCC_PLLCFGR_PLLREN;
              RCC->CR |= RCC_CR_PLLON;
              while (!(RCC->CR & RCC_CR_PLLRDY)) { }

              RCC->CFGR = (RCC->CFGR & ~RCC_CFGR_HPRE) | RCC_CFGR_HPRE_DIV2;    /* AHB / 2 while switching */
              RCC->CFGR = (RCC->CFGR & ~RCC_CFGR_SW) | RCC_CFGR_SW_PLL;
              while ((RCC->CFGR & RCC_CFGR_SWS) != RCC_CFGR_SWS_PLL) { }
              for (volatile int i = 0; i < 100; i++) { }                         /* wait at least 1 us */
              RCC->CFGR = (RCC->CFGR & ~RCC_CFGR_HPRE) | RCC_CFGR_HPRE_DIV1;    /* back to HCLK = SYSCLK */

              /* PWM: PA8 = TIM1_CH1 (AF6), 170 MHz / 1700 = 100 kHz, 50 % */
              RCC->AHB2ENR |= RCC_AHB2ENR_GPIOAEN;
              RCC->APB2ENR |= RCC_APB2ENR_TIM1EN;
              GPIOA->MODER = (GPIOA->MODER & ~GPIO_MODER_MODE8) | GPIO_MODER_MODE8_1;
              GPIOA->AFR[1] = (GPIOA->AFR[1] & ~GPIO_AFRH_AFSEL8) | (6U << GPIO_AFRH_AFSEL8_Pos);
              TIM1->PSC = 0;
              TIM1->ARR = 1699;
              TIM1->CCR1 = 850;
              TIM1->CCMR1 = (TIM1->CCMR1 & ~TIM_CCMR1_OC1M) | (6U << TIM_CCMR1_OC1M_Pos) | TIM_CCMR1_OC1PE;
              TIM1->CCER |= TIM_CCER_CC1E;
              TIM1->BDTR |= TIM_BDTR_MOE;
              TIM1->CR1 |= TIM_CR1_ARPE;
              TIM1->EGR = TIM_EGR_UG;
              TIM1->CR1 |= TIM_CR1_CEN;

              while (1) { }
          }
          ```
    wrong_variants:
      - name: pll_retuned_to_200mhz
        grader: final_state
        edits:
          - {turn: 2, find: "(85U << RCC_PLLCFGR_PLLN_Pos)", replace: "(100U << RCC_PLLCFGR_PLLN_Pos)"}
          - {turn: 2, find: "TIM1->ARR = 1699;", replace: "TIM1->ARR = 1999;"}
          - {turn: 2, find: "TIM1->CCR1 = 850;", replace: "TIM1->CCR1 = 1000;"}
        expect: ["sim_violation:SIM-CLK-LIMIT"]
      - name: silently_lowered_to_150mhz
        grader: final_state
