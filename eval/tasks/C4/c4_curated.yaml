    - {doc_id: STM32G474_RM0440, page: 1632, contains: [tSU;DAT Data setup time 250 - 100 - 50 - 250 -, tVD;DAT Data valid time - 3.45 - 0.9 - 0.45 - -]}
    reference_calc: 'Xung đột (chân): lượt 0 đặt USART1_TX trên PA9 (AF7); lượt 1 yêu cầu I2C2_SCL cũng trên PA9 (AF4) ⇒ PIN_CONFLICT:PA9 (DS12288 Table 13 p.73: dòng PA9 có I2C2_SCL ở AF4 và USART1_TX ở AF7; một chân chỉ mang một chức năng thay thế). Các cách sửa hợp lệ: chuyển I2C2_SCL sang chân I2C2_SCL khác — PC4 (AF4, p.75; PF6 AF4 chỉ có ở LQFP128/UFBGA121), SDA giữ PA8 (AF4, p.73); hoặc chuyển USART1_TX sang PB6 (AF7, p.74) / PC4 (AF7, p.75) và giữ SCL ở PA9. Tham chiếu chọn I2C2_SCL → PC4 (USART1 đã nối ở lượt 0). USART1: OVER8 = 0 ⇒ BRR = USARTDIV = 170e6 / 115200 = 1475,69 ⇒ 1476 ⇒ baud thực 115176 (−0,02 %) (RM0440 §40.5.7 p.1707–1708). I2C2: I2C2SEL reset = 00 = PCLK1 = 170 MHz (RM p.324) ⇒ tI2CCLK = 5,882 ns. Fm 400 kHz ⇒ tSCL = 2,5 µs. Chọn PRESC = 4 ⇒ tPRESC = 5 × 5,882 = 29,41 ns (SCLDEL/SDADEL chỉ có 4 bit nên PRESC = 3 sẽ đòi SCLDEL = 16 > 15). (SCLL+1) + (SCLH+1) = (2500 − 4 × 5,882) / 29,41 = 84,2 ⇒ 84 (RM §39.4.9 p.1645: tSCL = tSYNC1 + tSYNC2 + [(SCLH+1)+(SCLL+1)] × tPRESC): SCLL = 55 ⇒ tLOW = 56 × 29,41 = 1,647 µs ≥ 1,3 µs; SCLH = 27 ⇒ tHIGH = 28 × 29,41 = 0,824 µs ≥ 0,6 µs (Table 358 p.1647); tSCL = 2470,6 + 23,5 = 2494 ns ⇒ 401 kHz (dải với tSYNC = 1000 ns: 288–401 kHz chứa mục tiêu ±5 %). SCLDEL ≥ [tr(max) + tSU;DAT(min)] / tPRESC − 1 = (300 + 100) / 29,41 − 1 = 12,6 ⇒ 13 (Table 356 p.1632). SDADEL: cận dưới [tf(max) + tHD;DAT(min) − tAF(min) − 3 tI2CCLK] / tPRESC = (300 + 0 − 50 − 17,6) / 29,41 = 7,9; cận trên [tVD;DAT(max) − tr(max) − tAF(max) − 4 tI2CCLK] / tPRESC = (900 − 300 − 90 − 23,5) / 29,41 = 16,5 (tAF 50–90 ns, DS p.171 Table 88; trường 4 bit ≤ 15) ⇒ chọn 9 (p.1631–1632). PA8 = AF4 = I2C2_SDA, PC4 = AF4 = I2C2_SCL (DS p.73, p.75); SCL/SDA open-drain.'
    reference_solution:
      turns:
      - |
        USART1 is on APB2 (prescaler 1) and keeps its reset kernel clock PCLK2 = 170 MHz, so USARTDIV = 170 MHz / 115200 = 1475.7 and BRR = 1476 (real baud rate 115176, -0.02 %). PA9 (USART1_TX) and PA10 (USART1_RX) are both AF7.

        ```c
        #include "stm32g4xx.h"

        int main(void)
        {
            RCC->AHB2ENR |= RCC_AHB2ENR_GPIOAEN;
            RCC->APB2ENR |= RCC_APB2ENR_USART1EN;

            /* USART1: TX = PA9 (AF7), RX = PA10 (AF7), 115200 baud, 8N1 */
            GPIOA->MODER = (GPIOA->MODER & ~(GPIO_MODER_MODE9 | GPIO_MODER_MODE10)) | GPIO_MODER_MODE9_1 | GPIO_MODER_MODE10_1;
            GPIOA->AFR[1] = (GPIOA->AFR[1] & ~(GPIO_AFRH_AFSEL9 | GPIO_AFRH_AFSEL10)) | (7U << GPIO_AFRH_AFSEL9_Pos) | (7U << GPIO_AFRH_AFSEL10_Pos);
            USART1->BRR = 1476;                                                /* written while UE = 0 */
            USART1->CR1 = USART_CR1_UE | USART_CR1_TE | USART_CR1_RE;

            while (1) { }
        }
        ```
      - |
        One thing to flag before the code:
        - **Pin conflict:** PA9 is already used by USART1_TX (AF7) from message 1, so I2C2_SCL cannot also be placed on PA9 (a pin carries one alternate function at a time). I2C2_SCL is also available on PC4 (AF4), so I put SCL on PC4 and keep SDA on PA8 (AF4) as you asked; USART1 stays on PA9/PA10.

        I2C2 keeps its reset kernel clock (RCC_CCIPR.I2C2SEL = 00, PCLK1), so fI2CCLK = 170 MHz and tI2CCLK = 5.88 ns. With PRESC = 4, tPRESC = 5 x 5.88 = 29.4 ns. SCLL = 55 gives tLOW = 56 x 29.4 = 1.65 us (>= 1.3 us) and SCLH = 27 gives tHIGH = 28 x 29.4 = 0.82 us (>= 0.6 us); (56 + 28) x 29.4 ns + the minimum tSYNC of 4 x 5.88 ns is about 2.49 us, i.e. 401 kHz. SCLDEL = 13 (>= (300 + 100) / 29.4 - 1 = 12.6) and SDADEL = 9 (RM0440 bounds: 7.9 to 16.5).

        ```c
        RCC->AHB2ENR |= RCC_AHB2ENR_GPIOAEN | RCC_AHB2ENR_GPIOCEN;
        RCC->APB1ENR1 |= RCC_APB1ENR1_I2C2EN;

        /* I2C2: SCL = PC4 (AF4), SDA = PA8 (AF4), open drain, 400 kHz */
        GPIOA->MODER = (GPIOA->MODER & ~GPIO_MODER_MODE8) | GPIO_MODER_MODE8_1;
        GPIOA->OTYPER |= GPIO_OTYPER_OT8;
        GPIOA->AFR[1] = (GPIOA->AFR[1] & ~GPIO_AFRH_AFSEL8) | (4U << GPIO_AFRH_AFSEL8_Pos);
        GPIOC->MODER = (GPIOC->MODER & ~GPIO_MODER_MODE4) | GPIO_MODER_MODE4_1;
        GPIOC->OTYPER |= GPIO_OTYPER_OT4;
        GPIOC->AFR[0] = (GPIOC->AFR[0] & ~GPIO_AFRL_AFSEL4) | (4U << GPIO_AFRL_AFSEL4_Pos);
        I2C2->TIMINGR = (4U << I2C_TIMINGR_PRESC_Pos) | (13U << I2C_TIMINGR_SCLDEL_Pos) | (9U << I2C_TIMINGR_SDADEL_Pos) | (27U << I2C_TIMINGR_SCLH_Pos) | (55U << I2C_TIMINGR_SCLL_Pos);
        I2C2->CR1 |= I2C_CR1_PE;
        ```
      - |
        Here is the complete program: USART1 on PA9/PA10 at 115200 baud and I2C2 at 400 kHz with SCL on PC4 and SDA on PA8.

        ```c
        #include "stm32g4xx.h"

        int main(void)
        {
            RCC->AHB2ENR |= RCC_AHB2ENR_GPIOAEN | RCC_AHB2ENR_GPIOCEN;
            RCC->APB2ENR |= RCC_APB2ENR_USART1EN;
            RCC->APB1ENR1 |= RCC_APB1ENR1_I2C2EN;

            /* USART1: TX = PA9 (AF7), RX = PA10 (AF7), 115200 baud, 8N1 */
            GPIOA->MODER = (GPIOA->MODER & ~(GPIO_MODER_MODE9 | GPIO_MODER_MODE10)) | GPIO_MODER_MODE9_1 | GPIO_MODER_MODE10_1;
            GPIOA->AFR[1] = (GPIOA->AFR[1] & ~(GPIO_AFRH_AFSEL9 | GPIO_AFRH_AFSEL10)) | (7U << GPIO_AFRH_AFSEL9_Pos) | (7U << GPIO_AFRH_AFSEL10_Pos);
            USART1->BRR = 1476;                                                /* written while UE = 0 */
            USART1->CR1 = USART_CR1_UE | USART_CR1_TE | USART_CR1_RE;

            /* I2C2: SCL = PC4 (AF4), SDA = PA8 (AF4), open drain, 400 kHz */
            GPIOA->MODER = (GPIOA->MODER & ~GPIO_MODER_MODE8) | GPIO_MODER_MODE8_1;
            GPIOA->OTYPER |= GPIO_OTYPER_OT8;
            GPIOA->AFR[1] = (GPIOA->AFR[1] & ~GPIO_AFRH_AFSEL8) | (4U << GPIO_AFRH_AFSEL8_Pos);
            GPIOC->MODER = (GPIOC->MODER & ~GPIO_MODER_MODE4) | GPIO_MODER_MODE4_1;
            GPIOC->OTYPER |= GPIO_OTYPER_OT4;
            GPIOC->AFR[0] = (GPIOC->AFR[0] & ~GPIO_AFRL_AFSEL4) | (4U << GPIO_AFRL_AFSEL4_Pos);
            I2C2->TIMINGR = (4U << I2C_TIMINGR_PRESC_Pos) | (13U << I2C_TIMINGR_SCLDEL_Pos) | (9U << I2C_TIMINGR_SDADEL_Pos) | (27U << I2C_TIMINGR_SCLH_Pos) | (55U << I2C_TIMINGR_SCLL_Pos);
            I2C2->CR1 |= I2C_CR1_PE;

            while (1) { }
        }
        ```
    wrong_variants:
    - name: scl_kept_on_pa9_as_requested
      grader: final_state
      edits:
      - {turn: 2, find: GPIOC->MODER = (GPIOC->MODER & ~GPIO_MODER_MODE4) | GPIO_MODER_MODE4_1;, replace: GPIOA->MODER = (GPIOA->MODER & ~GPIO_MODER_MODE9) | GPIO_MODER_MODE9_1;}
      - {turn: 2, find: GPIOC->OTYPER |= GPIO_OTYPER_OT4;, replace: GPIOA->OTYPER |= GPIO_OTYPER_OT9;}
      - {turn: 2, find: 'GPIOC->AFR[0] = (GPIOC->AFR[0] & ~GPIO_AFRL_AFSEL4) | (4U << GPIO_AFRL_AFSEL4_Pos);', replace: 'GPIOA->AFR[1] = (GPIOA->AFR[1] & ~GPIO_AFRH_AFSEL9) | (4U << GPIO_AFRH_AFSEL9_Pos);'}
      expect:
      - wrong_pin
    - name: forgot_gpioc_clock
      grader: final_state
      edits:
      - {turn: 2, find: RCC->AHB2ENR |= RCC_AHB2ENR_GPIOAEN | RCC_AHB2ENR_GPIOCEN;, replace: RCC->AHB2ENR |= RCC_AHB2ENR_GPIOAEN;}
      expect:
      - sim_violation:SIM-CLK-GATE
    - name: scl_not_open_drain
