- id: C4-004
  category: C4
  split: test
  difficulty: medium
  chips: [stm32g474]
  tags: [timer_shared, pwm]
  turns:
    - user: "I am designing the firmware of an STM32G474 board with you over several messages. Write bare-metal C that accesses registers the CMSIS way (e.g. `TIM1->PSC = ...;`, `RCC->APB2ENR |= RCC_APB2ENR_TIM1EN;`) using the register and bit names of ST's `stm32g4xx.h` device header. Do not use HAL or LL drivers, `SystemCoreClock` or any other library function; write clock frequencies as numeric constants. Do not use interrupts; busy-wait loops on status flags are fine. Initial state: SYSCLK = HCLK = PCLK1 = PCLK2 = 170 MHz (PLL fed by HSI16, AHB/APB1/APB2 prescalers = 1, voltage Range 1 boost mode, Flash wait states already set); the board is powered at VDD = 3.3 V. Every peripheral clock that is off at reset is still off, and all GPIO pins are in their reset state. Answer every message with the relevant C code (in fenced C code blocks that follow these conventions) and a short explanation. Message 1: generate a 1 kHz PWM signal with a 50 % duty cycle on pin PA0 (TIM2 channel 1, AF1) to drive an LED driver input; edge-aligned PWM mode 1, active-high output. The frequency must be within ±1 % and the duty cycle within ±1 percentage point."
    - user: "Message 2: now add a hobby servo. Its control input is on pin PA1 (TIM2 channel 2, AF1) and needs a 50 Hz signal with a 1.5 ms high pulse (centre position); edge-aligned PWM mode 1, active-high output. The frequency must be within ±1 % and the duty cycle within ±0.5 percentage point. The 1 kHz signal on PA0 must keep running as before."
    - user: "Message 3: please give me the complete initialisation program for the whole design so far (the 1 kHz PWM on PA0 and the servo signal) as one C code block (`#include \"stm32g4xx.h\"`, then a `main()` that configures everything and finally loops forever with `while (1)`), followed by a short explanation."
  expected:
    chip: stm32g474
    initial: "sysclk_170mhz_pll_hsi16_apb_div1"
    spec:
