      - {turn: 2, find: (4U << I2C_TIMINGR_PRESC_Pos), replace: (15U << I2C_TIMINGR_PRESC_Pos)}
      expect:
      - wrong_scl
    - name: brr_computed_for_hsi16
      grader: final_state
