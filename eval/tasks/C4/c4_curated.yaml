        Here is the complete program: the clock tree (HSE 24 MHz / 2, x 28, / 2 = 168 MHz, with boost mode and 4 wait states) followed by USART1 on PA9/PA10 at 115200 baud (BRR = 1458 for PCLK2 = 168 MHz).

        ```c
        #include "stm32g4xx.h"

        int main(void)
        {
            RCC->APB1ENR1 |= RCC_APB1ENR1_PWREN;
