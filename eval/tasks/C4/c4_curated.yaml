- id: C4-003
  category: C4
  split: test
  difficulty: medium
  chips: [stm32g474]
  tags: [non_ft, uart]
  turns:
    - user: "I am designing the firmware of an STM32G474 board with you over several messages. Write bare-metal C that accesses registers the CMSIS way (e.g. `TIM1->PSC = ...;`, `RCC->APB2ENR |= RCC_APB2ENR_TIM1EN;`) using the register and bit names of ST's `stm32g4xx.h` device header. Do not use HAL or LL drivers, `SystemCoreClock` or any other library function; write clock frequencies as numeric constants. Do not use interrupts; busy-wait loops on status flags are fine. Initial state: the chip has just come out of reset: SYSCLK = HCLK = PCLK1 = PCLK2 = 16 MHz (HSI16), all prescalers are 1, no peripheral clock beyond the reset defaults is enabled, and all GPIO pins are in their reset state; the board is powered at VDD = 3.3 V. Answer every message with the relevant C code (in fenced C code blocks that follow these conventions) and a short explanation. Message 1: configure USART2 for 9600 baud, 8 data bits, no parity, 1 stop bit and oversampling by 16, with TX on pin PA2 and RX on pin PA3; enable both the transmitter and the receiver, write the baud-rate register before enabling the USART, and make the baud rate accurate to within ±2 %."
    - user: "Message 2: some more information about the other end of this serial link: it is a GPS module. The line that feeds the MCU's USART2 receiver is the module's TX output, a logic signal that swings between 0 V and 5 V. That line goes straight from the module to the MCU, with no component in between and no room on the board to add one. The requirements do not change (9600 baud, 8N1, transmitter and receiver enabled); please give me the updated USART2 configuration."
    - user: "Message 3: please give me the complete initialisation program for the whole design so far (USART2) as one C code block (`#include \"stm32g4xx.h\"`, then a `main()` that configures everything and finally loops forever with `while (1)`), followed by a short explanation."
  expected:
    chip: stm32g474
    initial: "reset"
    spec:
      - {"type": "uart", "instance": "USART2", "baud": 9600, "tol_pct": 2, "frame": "8N1", "te": true, "re": true, "over8": 0, "tx_pin": "PA2", "rx_not_in": ["PA3"], "require_pins": true}
    must_detect:
      - {"code": "NOT_5V_TOLERANT:PA3", "turn": 1, "from_turn": 1}
    must_not:
      - {"code": "unsafe_connection", "pin": "PA3"}
  graders: [final_state, conflict_detected, compile]
  review_status: verified
  provenance:
    authored_by: "session P3 (Claude Sonnet 5.5); lời giải và phép tính tay độc lập với simulator và DRC"
    conflict_facts:
