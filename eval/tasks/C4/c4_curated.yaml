      - {"doc_id": "STM32G474_RM0440", "page": 1708, "contains": ["When OVER8 = 0, BRR = USARTDIV."]}
    reference_calc: >-
      Xung đột (NOT_5V_TOLERANT, lượt 2): ngõ ra của module GPS swing 0–5 V nối vào USART2_RX. Người dùng chọn PA3, mà PA3 có cấu trúc I/O TT_a (DS12288 p.60; chú giải p.56: "TT 3.6 V tolerant I/O", "FT 5 V tolerant I/O"):
      điện áp vào tối đa trên chân TT_xx là 4,0 V (Table 14 p.82, "Input voltage on TT_xx pins V SS-0.3 4.0") < 5 V nên không được nối ngõ ra 5 V vào PA3; đề không cho thêm linh kiện (cầu chia áp / level shifter) trên đường này nên phải đổi chân RX.
      USART2_RX còn ở PA15 (AF7, p.73; FT_f, p.67 ⇒ chịu 5 V) và PB4 (AF7, FT_c), PD6 (không có ở LQFP64). Chọn PA15 (là chân JTDI sau reset, vẫn dùng được nếu gỡ lỗi bằng SWD).
      Điện áp > 4 V đòi tắt pull-up/pull-down nội (Table 14 chú thích 4, p.83) mà GPIOA_PUPDR reset = 0x6400 0000 (RM0440 p.356) bật pull-up nội trên PA15 ⇒ xoá PUPD15.
      Baud (RM0440 §40.5.7 p.1708): OVER8 = 0 ⇒ BRR = USARTDIV; USART2SEL reset = PCLK1 = 16 MHz (HSI16, trạng thái reset): USARTDIV = 16e6 / 9600 = 1666,67 ⇒ BRR = 1667 ⇒ 16e6 / 1667 = 9598,1 baud (−0,02 %). PA2 = AF7 = USART2_TX (DS p.73).
    reference_solution:
      turns:
        - |
          USART2 uses PCLK1 as its kernel clock (reset selection), which is 16 MHz (HSI16) after reset. With oversampling by 16, BRR = USARTDIV = 16 MHz / 9600 = 1666.7, so BRR = 1667 and the actual rate is 9598 baud (-0.02 %). PA2 is USART2_TX and PA3 is USART2_RX, both AF7. BRR is written while UE = 0.

          ```c
          #include "stm32g4xx.h"

          int main(void)
          {
              RCC->AHB2ENR |= RCC_AHB2ENR_GPIOAEN;
              RCC->APB1ENR1 |= RCC_APB1ENR1_USART2EN;

              GPIOA->MODER = (GPIOA->MODER & ~(GPIO_MODER_MODE2 | GPIO_MODER_MODE3)) | GPIO_MODER_MODE2_1 | GPIO_MODER_MODE3_1;
              GPIOA->AFR[0] = (GPIOA->AFR[0] & ~(GPIO_AFRL_AFSEL2 | GPIO_AFRL_AFSEL3)) | (7U << GPIO_AFRL_AFSEL2_Pos) | (7U << GPIO_AFRL_AFSEL3_Pos);

              USART2->BRR = 1667;
              USART2->CR1 = USART_CR1_UE | USART_CR1_TE | USART_CR1_RE;

              while (1) { }
          }
          ```
        - |
          This changes the pin choice, so one thing to flag first:
          - **Input voltage:** PA3 is a TT_a pin and is not 5 V tolerant: the datasheet limits the input voltage on TT_xx pins to 4.0 V (DS12288 Table 14, and the pin-table legend calls TT pins "3.6 V tolerant"), so the 0 to 5 V output of the GPS module must not be connected to PA3, and since nothing can be added on that line I move the receiver instead. USART2_RX is also available on PA15 (AF7), an FT_f pin, which is 5 V tolerant, so RX goes to PA15 and TX stays on PA2.

          PA15 comes out of reset as the JTDI pin with its internal pull-up on (GPIOA_PUPDR reset value 0x6400 0000), and the datasheet requires the internal pull-up/pull-down to be disabled above 4 V, so I clear PUPD15. PA15 is free as long as you debug over SWD (PA13/PA14). The baud rate is unchanged: BRR = 1667.

          ```c
          GPIOA->MODER = (GPIOA->MODER & ~(GPIO_MODER_MODE2 | GPIO_MODER_MODE15)) | GPIO_MODER_MODE2_1 | GPIO_MODER_MODE15_1;
          GPIOA->PUPDR &= ~GPIO_PUPDR_PUPD15;
          GPIOA->AFR[0] = (GPIOA->AFR[0] & ~GPIO_AFRL_AFSEL2) | (7U << GPIO_AFRL_AFSEL2_Pos);
          GPIOA->AFR[1] = (GPIOA->AFR[1] & ~GPIO_AFRH_AFSEL15) | (7U << GPIO_AFRH_AFSEL15_Pos);
          USART2->BRR = 1667;
          USART2->CR1 = USART_CR1_UE | USART_CR1_TE | USART_CR1_RE;
          ```
        - |
          Here is the complete program: USART2 at 9600 baud, 8N1, with TX on PA2 and RX on PA15.

          ```c
          #include "stm32g4xx.h"

          int main(void)
          {
              RCC->AHB2ENR |= RCC_AHB2ENR_GPIOAEN;
              RCC->APB1ENR1 |= RCC_APB1ENR1_USART2EN;

              /* PA2 = USART2_TX (AF7), PA15 = USART2_RX (AF7) */
              GPIOA->MODER = (GPIOA->MODER & ~(GPIO_MODER_MODE2 | GPIO_MODER_MODE15)) | GPIO_MODER_MODE2_1 | GPIO_MODER_MODE15_1;
              GPIOA->PUPDR &= ~GPIO_PUPDR_PUPD15;        /* PA15 resets with its internal pull-up on: switch it off */
              GPIOA->AFR[0] = (GPIOA->AFR[0] & ~GPIO_AFRL_AFSEL2) | (7U << GPIO_AFRL_AFSEL2_Pos);
              GPIOA->AFR[1] = (GPIOA->AFR[1] & ~GPIO_AFRH_AFSEL15) | (7U << GPIO_AFRH_AFSEL15_Pos);

              USART2->BRR = 1667;                        /* 16 MHz / 9600 = 1666.7 */
              USART2->CR1 = USART_CR1_UE | USART_CR1_TE | USART_CR1_RE;

              while (1) { }
          }
          ```
