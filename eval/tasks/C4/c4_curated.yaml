- id: C4-002
  category: C4
  split: test
  difficulty: hard
  chips: [stm32g474]
  tags: [no_such_af, i2c, uart, pin_conflict]
  turns:
    - user: "I am designing the firmware of an STM32G474 board with you over several messages. Write bare-metal C that accesses registers the CMSIS way (e.g. `TIM1->PSC = ...;`, `RCC->APB2ENR |= RCC_APB2ENR_TIM1EN;`) using the register and bit names of ST's `stm32g4xx.h` device header. Do not use HAL or LL drivers, `SystemCoreClock` or any other library function; write clock frequencies as numeric constants. Do not use interrupts; busy-wait loops on status flags are fine. Initial state: SYSCLK = HCLK = PCLK1 = PCLK2 = 170 MHz (PLL fed by HSI16, AHB/APB1/APB2 prescalers = 1, voltage Range 1 boost mode, Flash wait states already set); the board is powered at VDD = 3.3 V. Every peripheral clock that is off at reset is still off, and all GPIO pins are in their reset state. Answer every message with the relevant C code (in fenced C code blocks that follow these conventions) and a short explanation. Message 1: configure USART2 for 115200 baud, 8 data bits, no parity, 1 stop bit and oversampling by 16, with TX on pin PA2 and RX on pin PA3; enable both the transmitter and the receiver and write the baud-rate register before enabling the USART."
    - user: "Message 2: now add I2C1 as a controller in fast mode (400 kHz) to talk to an external sensor board. On the board SDA is already routed to pin PB7 and I planned to put SCL on pin PB6 (both are open-drain alternate-function pins). Leave the I2C1 kernel clock selection in RCC_CCIPR at its reset value, program I2C_TIMINGR while the peripheral is still disabled so that the target fSCL is reachable, where fSCL = 1 / tSCL with tSCL = tSYNC1 + tSYNC2 + [(SCLH+1) + (SCLL+1)] x (PRESC+1) x tI2CCLK (RM0440 §39.4.9) and tSYNC1 + tSYNC2 anywhere between its minimum 4 x tI2CCLK and 1000 ns: the target must lie within ±5 % of the frequency range this gives. The bus timing must also meet the fast-mode (Fm) minimums of RM0440 Table 358 (tLOW >= 1.3 us and tHIGH >= 0.6 us), estimating tLOW as tSCLL + tSYNC1 and tHIGH as tSCLH + tSYNC2 with tSYNC1 = tSYNC2 = 2 x tI2CCLK. Then enable the peripheral; no interrupts or DMA."
    - user: "Message 3: add a debug UART on USART1 at 921600 baud (8 data bits, no parity, 1 stop bit, oversampling by 16, transmitter and receiver both enabled, baud-rate register written before enabling the USART) with TX on pin PB6 and RX on pin PB7. The baud rate must be accurate to within ±2 %."
    - user: "Message 4: please give me the complete initialisation program for the whole design so far (USART2, I2C1 and USART1) as one C code block (`#include \"stm32g4xx.h\"`, then a `main()` that configures everything and finally loops forever with `while (1)`), followed by a short explanation."
  expected:
    chip: stm32g474
    initial: "sysclk_170mhz_pll_hsi16_apb_div1"
    spec:
      - {"type": "uart", "instance": "USART2", "baud": 115200, "tol_pct": 2, "tx_pin": "PA2", "rx_pin": "PA3", "frame": "8N1", "te": true, "re": true, "over8": 0, "require_pins": true}
      - {"type": "i2c", "instance": "I2C1", "scl_hz": 400000, "tol_pct": 5, "mode": "Fm", "open_drain": true, "scl_not_in": ["PB6"], "sda_pin": "PB7", "require_pins": true}
      - {"type": "uart", "instance": "USART1", "baud": 921600, "tol_pct": 2, "frame": "8N1", "te": true, "re": true, "over8": 0, "require_pins": true}
    must_detect:
      - {"code": "NO_SUCH_AF:PB6", "turn": 1, "from_turn": 1}
      - {"code": "PIN_CONFLICT:PB7", "turn": 2, "from_turn": 2}
  graders: [final_state, conflict_detected, compile]
  review_status: verified
  provenance:
    authored_by: "session P3 (Claude Sonnet 5.5); lời giải và phép tính tay độc lập với simulator và DRC"
    conflict_facts:
      - {"type": "no_af", "pin": "PB6", "signal": "I2C1_SCL"}
      - {"type": "af", "pin": "PB6", "signal": "USART1_TX", "af": 7}
      - {"type": "af", "pin": "PB8", "signal": "I2C1_SCL", "af": 4}
      - {"type": "af", "pin": "PA15", "signal": "I2C1_SCL", "af": 4}
      - {"type": "af", "pin": "PB7", "signal": "I2C1_SDA", "af": 4}
