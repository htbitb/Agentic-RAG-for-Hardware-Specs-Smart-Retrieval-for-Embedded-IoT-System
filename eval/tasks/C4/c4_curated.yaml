    reference_solution:
      turns:
      - |
        One thing to flag before the code:
        - **PLL input limit:** with PLLM = 1 the PLL input clock would be the full 24 MHz of the crystal, which exceeds the 16 MHz maximum allowed for the PLL input (DS12288 Table 46: 2.66 to 16 MHz), so PLLM = 1 cannot be used. I divide the crystal by PLLM = 2 (PLLM field = 1), which gives a 12 MHz PLL input, and I double PLLN to 28 so that the VCO stays at 12 MHz x 28 = 336 MHz (inside the 96 to 344 MHz range); PLLR = 2 (field = 0) then gives 168 MHz as you want.

        The rest of the sequence: the Range 1 boost mode is selected first (clear PWR_CR5.R1MODE after enabling the PWR clock) because 168 MHz is a boost-mode frequency, Flash gets 4 wait states, HSE is started and waited for, the PLL is configured and started, and the switch to the PLL goes through AHB /2 for a moment before returning to /1.

        ```c
        #include "stm32g4xx.h"

        int main(void)
        {
            RCC->APB1ENR1 |= RCC_APB1ENR1_PWREN;
            (void)RCC->APB1ENR1;                                               /* dummy read: delay before the first PWR access */
            PWR->CR5 &= ~PWR_CR5_R1MODE;                                       /* Range 1 boost mode */
            FLASH->ACR = (FLASH->ACR & ~FLASH_ACR_LATENCY) | FLASH_ACR_LATENCY_4WS;

            RCC->CR |= RCC_CR_HSEON;
            while (!(RCC->CR & RCC_CR_HSERDY)) { }

            /* HSE 24 MHz / 2 = 12 MHz, x 28 = 336 MHz VCO, / 2 = 168 MHz */
            RCC->PLLCFGR = RCC_PLLCFGR_PLLSRC_HSE | (1U << RCC_PLLCFGR_PLLM_Pos) | (28U << RCC_PLLCFGR_PLLN_Pos) | RCC_PLLCFGR_PLLREN;
            RCC->CR |= RCC_CR_PLLON;
            while (!(RCC->CR & RCC_CR_PLLRDY)) { }

            RCC->CFGR = (RCC->CFGR & ~RCC_CFGR_HPRE) | RCC_CFGR_HPRE_DIV2;    /* AHB / 2 during the switch */
            RCC->CFGR = (RCC->CFGR & ~RCC_CFGR_SW) | RCC_CFGR_SW_PLL;
            while ((RCC->CFGR & RCC_CFGR_SWS) != RCC_CFGR_SWS_PLL) { }
            for (volatile int i = 0; i < 100; i++) { }                         /* wait >= 1 us */
            RCC->CFGR = (RCC->CFGR & ~RCC_CFGR_HPRE) | RCC_CFGR_HPRE_DIV1;    /* back to HCLK = SYSCLK */

            while (1) { }
        }
        ```
      - |
        USART1 is on APB2 (prescaler 1) and keeps its reset kernel-clock selection (RCC_CCIPR.USART1SEL = 00, PCLK2), so its kernel clock is PCLK2 = 168 MHz. USARTDIV = 168 MHz / 115200 = 1458.3 with oversampling by 16, so BRR = 1458 (real baud rate 115226, +0.02 %). PA9 and PA10 are USART1_TX and USART1_RX in AF7.

        ```c
        RCC->AHB2ENR |= RCC_AHB2ENR_GPIOAEN;
        RCC->APB2ENR |= RCC_APB2ENR_USART1EN;

        /* USART1: TX = PA9 (AF7), RX = PA10 (AF7), 115200 baud, 8N1 */
        GPIOA->MODER = (GPIOA->MODER & ~(GPIO_MODER_MODE9 | GPIO_MODER_MODE10)) | GPIO_MODER_MODE9_1 | GPIO_MODER_MODE10_1;
        GPIOA->AFR[1] = (GPIOA->AFR[1] & ~(GPIO_AFRH_AFSEL9 | GPIO_AFRH_AFSEL10)) | (7U << GPIO_AFRH_AFSEL9_Pos) | (7U << GPIO_AFRH_AFSEL10_Pos);
        USART1->BRR = 1458;                                                /* written while UE = 0 */
        USART1->CR1 = USART_CR1_UE | USART_CR1_TE | USART_CR1_RE;
        ```
