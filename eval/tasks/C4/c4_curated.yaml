# C4 — Thiết kế nhiều lượt có trạng thái, xung đột cài sẵn (3–6 lượt, STM32G474, D21). Chấm: `final_state` (gate; code ở LƯỢT CUỐI, nhiều spec — D25),
# `conflict_detected` (gate; xung đột phải được NÊU CHỦ ĐỘNG, người dùng không nhắc), `compile` (chỉ số riêng).
# Mỗi task: provenance.reference_solution.turns (câu trả lời tham chiếu từng lượt), reference_calc (PHÉP TÍNH TAY, trang RM/DS — không sinh từ simulator/DRC, D19),
# conflict_facts (đối chiếu DB P1: AF/loại chân/giới hạn), evidence (snippet nguyên văn trên trang PDF), wrong_variants (edits trên hội thoại tham chiếu; mỗi biến thể
# phải trượt ĐÚNG mã: ≥ 1 biến thể cho final_state và ≥ 1 cho conflict_detected). `python -m eval.tools.verify_tasks --categories C4` kiểm tất cả.
# Quy ước (D20/D25): lượt 1 nêu CMSIS, cấm HAL/LL/SystemCoreClock, trạng thái khởi đầu, VDD; lượt cuối đòi chương trình HOÀN CHỈNH trong một khối code C.

- id: C4-001
  category: C4
  split: dev
  difficulty: medium
  chips: [stm32g474]
  tags: [pin_conflict, pwm, i2c, level_shift]
  turns:
    - user: "I am designing the firmware of an STM32G474 board with you over several messages. Write bare-metal C that accesses registers the CMSIS way (e.g. `TIM1->PSC = ...;`, `RCC->APB2ENR |= RCC_APB2ENR_TIM1EN;`) using the register and bit names of ST's `stm32g4xx.h` device header. Do not use HAL or LL drivers, `SystemCoreClock` or any other library function; write clock frequencies as numeric constants. Do not use interrupts; busy-wait loops on status flags are fine. Initial state: SYSCLK = HCLK = PCLK1 = PCLK2 = 170 MHz (PLL fed by HSI16, AHB/APB1/APB2 prescalers = 1, voltage Range 1 boost mode, Flash wait states already set); the board is powered at VDD = 3.3 V. Every peripheral clock that is off at reset is still off, and all GPIO pins are in their reset state. Answer every message with the relevant C code (in fenced C code blocks that follow these conventions) and a short explanation. Message 1: generate a 20 kHz PWM signal with a 25 % duty cycle on pin PA8 (TIM1 channel 1) to drive a motor-driver input; edge-aligned PWM mode 1, active-high output, no dead time."
    - user: "Message 2: now add a Bosch BME280 environmental sensor on I2C3 in standard mode (100 kHz). The sensor's I/O supply is 1.8 V. Choose the I2C3 pins yourself; the sensor transactions are not needed yet, I only want the peripheral configured as a controller (open-drain pins, TIMINGR programmed while the peripheral is disabled, then enabled)."
    - user: "Message 3: please give me the complete initialisation program for the whole design so far (the PWM and I2C3) as one C code block (`#include \"stm32g4xx.h\"`, then a `main()` that configures everything and finally loops forever with `while (1)`), followed by a short explanation."
  expected:
    chip: stm32g474
    initial: "sysclk_170mhz_pll_hsi16_apb_div1"
    spec:
      - {"type": "pwm", "pin": "PA8", "freq_hz": 20000, "duty_pct": 25, "tol_pct": 1}
      - {"type": "i2c", "instance": "I2C3", "scl_hz": 100000, "tol_pct": 5, "mode": "Sm", "open_drain": true, "require_pins": true, "scl_not_in": ["PA8"]}
    must_detect:
      - {"code": "PIN_CONFLICT:PA8", "turn": 1, "from_turn": 1}
      - {"code": "LEVEL_MISMATCH:1.8V-3.3V", "turn": 1, "from_turn": 1}
    must_not:
      - {"code": "unsafe_connection", "rails": [1.8, 3.3]}
  graders: [final_state, conflict_detected, compile]
  review_status: verified
  provenance:
    authored_by: "session P3 (Claude Sonnet 5.5); lời giải và phép tính tay độc lập với simulator và DRC"
    conflict_facts:
      - {"type": "af", "pin": "PA8", "signal": "TIM1_CH1", "af": 6}
      - {"type": "af", "pin": "PA8", "signal": "I2C3_SCL", "af": 2}
      - {"type": "af", "pin": "PC8", "signal": "I2C3_SCL", "af": 8}
      - {"type": "af", "pin": "PC9", "signal": "I2C3_SDA", "af": 8}
    evidence:
      - {"doc_id": "STM32G474_Datasheet", "page": 73, "contains": ["PA8 MCO - I2C3_SCL - I2C2_SDA I2S2_MCK TIM1_CH1"]}
      - {"doc_id": "STM32G474_Datasheet", "page": 75, "contains": ["PC8 - - TIM3_CH3 HRTIM1_CHE1 TIM8_CH3 - TIM20_CH3 COMP7_OUT I2C3_SCL", "PC9 - - TIM3_CH4 HRTIM1_CHE2 TIM8_CH4 I2SCKIN TIM8_BKIN2 - I2C3_SDA"]}
      - {"doc_id": "STM32G474_RM0440", "page": 1179, "contains": ["high as long as TIMx_CNT < TIMx_CCRx"]}
      - {"doc_id": "STM32G474_RM0440", "page": 1645, "contains": ["tSCL = tSYNC1 + tSYNC2"]}
    reference_calc: >-
      Xung đột 1 (chân): PWM đã chiếm PA8 = AF6 = TIM1_CH1; I2C3_SCL cũng nằm ở PA8 (AF2) nên không thể dùng chung (DS12288 Table 13, p.73). I2C3_SCL còn ở PC8 (AF8, p.75),
      PF3/PG7 (AF4, không có ở LQFP64); I2C3_SDA ở PC9 (AF8, p.75), PB5 (AF8). Chọn PC8/PC9. Xung đột 2 (mức áp): cảm biến I/O 1.8 V, MCU VDD = 3.3 V: VIH(min) của MCU = 0,7 × 3,3 = 2,31 V
      (DS Table 54 p.128; giá trị đảm bảo theo thiết kế cùng bảng 0,49 × VDD + 0,26 = 1,88 V vẫn lớn hơn 1,8 V nên "kéo lên 1,8 V" không đủ) trong khi mức cao của cảm biến ≤ 1,8 V, và mức cao 3,3 V của MCU vượt điện áp vào tối đa của cảm biến (VDDIO + 0,3 V): cần level shifter. PWM: TIM1 trên APB2 prescaler 1
      ⇒ TIM1CLK = 170 MHz; 170e6 / 20e3 = 8500 nhịp ⇒ PSC = 0, ARR = 8499; CCR1 = 25 % × 8500 = 2125 (RM0440 §29.3.13, p.1179); TIM1 là advanced timer ⇒ BDTR.MOE. I2C3 100 kHz, fI2CCLK = 170 MHz
      (I2C3SEL reset = PCLK1): PRESC = 15 (tPRESC = 94,12 ns), (SCLL+1) + (SCLH+1) = (10 µs − 4 × 5,882 ns) / 94,12 ns = 106 ⇒ SCLL = 59 (5,65 µs ≥ 4,7), SCLH = 45 (4,33 µs ≥ 4,0), SCLDEL = 13, SDADEL = 3
      (RM0440 §39.4.9 p.1645, Table 356 p.1632, Table 358 p.1647; cùng tính toán như C3-016).
    reference_solution:
      turns:
        - |
          TIM1 channel 1 on PA8 (AF6): TIM1 sits on APB2 with prescaler 1, so TIM1CLK = 170 MHz and 170 MHz / 20 kHz = 8500 ticks, i.e. PSC = 0, ARR = 8499 and CCR1 = 25 % x 8500 = 2125. TIM1 is an advanced timer, so BDTR.MOE must be set.

          ```c
          #include "stm32g4xx.h"

          int main(void)
          {
              RCC->AHB2ENR |= RCC_AHB2ENR_GPIOAEN;
              RCC->APB2ENR |= RCC_APB2ENR_TIM1EN;

              GPIOA->MODER = (GPIOA->MODER & ~GPIO_MODER_MODE8) | GPIO_MODER_MODE8_1;                 /* PA8: alternate function */
              GPIOA->AFR[1] = (GPIOA->AFR[1] & ~GPIO_AFRH_AFSEL8) | (6U << GPIO_AFRH_AFSEL8_Pos);     /* AF6 = TIM1_CH1 */

              TIM1->PSC = 0;
              TIM1->ARR = 8499;
              TIM1->CCR1 = 2125;
              TIM1->CCMR1 = (TIM1->CCMR1 & ~TIM_CCMR1_OC1M) | (6U << TIM_CCMR1_OC1M_Pos) | TIM_CCMR1_OC1PE;
              TIM1->CCER |= TIM_CCER_CC1E;
              TIM1->BDTR |= TIM_BDTR_MOE;
              TIM1->CR1 |= TIM_CR1_ARPE;
              TIM1->EGR = TIM_EGR_UG;
              TIM1->CR1 |= TIM_CR1_CEN;

              while (1) { }
          }
          ```
        - |
          Two things to flag before the code:
          - **Pin conflict:** the usual I2C3_SCL pin PA8 (AF2) is already used by the PWM output TIM1_CH1 (AF6), so I2C3_SCL cannot also be placed on PA8. I put SCL on PC8 (AF8) and SDA on PC9 (AF8); both are in the alternate-function table of the datasheet.
          - **Voltage mismatch:** the BME280 I/O runs at 1.8 V while the STM32G474 pins are at VDD = 3.3 V (VIH min = 0.7 x VDD = 2.31 V), so the sensor cannot be wired directly to PC8/PC9: add a bidirectional level shifter between the 3.3 V MCU side and the 1.8 V sensor side. That is a hardware change; the firmware below only configures the peripheral.

          I2C3 at 100 kHz with fI2CCLK = 170 MHz: PRESC = 15, SCLL = 59, SCLH = 45, SCLDEL = 13, SDADEL = 3 (tLOW about 5.65 us, tHIGH about 4.33 us, both above the standard-mode minimums).

          ```c
          RCC->AHB2ENR |= RCC_AHB2ENR_GPIOCEN;
          RCC->APB1ENR1 |= RCC_APB1ENR1_I2C3EN;
          GPIOC->MODER = (GPIOC->MODER & ~(GPIO_MODER_MODE8 | GPIO_MODER_MODE9)) | GPIO_MODER_MODE8_1 | GPIO_MODER_MODE9_1;
          GPIOC->OTYPER |= GPIO_OTYPER_OT8 | GPIO_OTYPER_OT9;
          GPIOC->AFR[1] = (GPIOC->AFR[1] & ~(GPIO_AFRH_AFSEL8 | GPIO_AFRH_AFSEL9)) | (8U << GPIO_AFRH_AFSEL8_Pos) | (8U << GPIO_AFRH_AFSEL9_Pos);
          I2C3->TIMINGR = (15U << I2C_TIMINGR_PRESC_Pos) | (13U << I2C_TIMINGR_SCLDEL_Pos) | (3U << I2C_TIMINGR_SDADEL_Pos) | (45U << I2C_TIMINGR_SCLH_Pos) | (59U << I2C_TIMINGR_SCLL_Pos);
          I2C3->CR1 |= I2C_CR1_PE;
          ```
        - |
          Here is the complete program: PWM on PA8 (TIM1_CH1) and I2C3 on PC8/PC9, with the level shifter on the board between the MCU and the sensor.

          ```c
          #include "stm32g4xx.h"

          int main(void)
          {
              RCC->AHB2ENR |= RCC_AHB2ENR_GPIOAEN | RCC_AHB2ENR_GPIOCEN;
              RCC->APB2ENR |= RCC_APB2ENR_TIM1EN;
              RCC->APB1ENR1 |= RCC_APB1ENR1_I2C3EN;

              /* PWM: PA8 = TIM1_CH1 (AF6), 20 kHz, 25 % */
              GPIOA->MODER = (GPIOA->MODER & ~GPIO_MODER_MODE8) | GPIO_MODER_MODE8_1;
              GPIOA->AFR[1] = (GPIOA->AFR[1] & ~GPIO_AFRH_AFSEL8) | (6U << GPIO_AFRH_AFSEL8_Pos);
              TIM1->PSC = 0;
              TIM1->ARR = 8499;
              TIM1->CCR1 = 2125;
              TIM1->CCMR1 = (TIM1->CCMR1 & ~TIM_CCMR1_OC1M) | (6U << TIM_CCMR1_OC1M_Pos) | TIM_CCMR1_OC1PE;
              TIM1->CCER |= TIM_CCER_CC1E;
              TIM1->BDTR |= TIM_BDTR_MOE;
              TIM1->CR1 |= TIM_CR1_ARPE;
              TIM1->EGR = TIM_EGR_UG;
              TIM1->CR1 |= TIM_CR1_CEN;

              /* I2C3: SCL = PC8 (AF8), SDA = PC9 (AF8), open drain, 100 kHz */
              GPIOC->MODER = (GPIOC->MODER & ~(GPIO_MODER_MODE8 | GPIO_MODER_MODE9)) | GPIO_MODER_MODE8_1 | GPIO_MODER_MODE9_1;
              GPIOC->OTYPER |= GPIO_OTYPER_OT8 | GPIO_OTYPER_OT9;
              GPIOC->AFR[1] = (GPIOC->AFR[1] & ~(GPIO_AFRH_AFSEL8 | GPIO_AFRH_AFSEL9)) | (8U << GPIO_AFRH_AFSEL8_Pos) | (8U << GPIO_AFRH_AFSEL9_Pos);
              I2C3->TIMINGR = (15U << I2C_TIMINGR_PRESC_Pos) | (13U << I2C_TIMINGR_SCLDEL_Pos) | (3U << I2C_TIMINGR_SDADEL_Pos) | (45U << I2C_TIMINGR_SCLH_Pos) | (59U << I2C_TIMINGR_SCLL_Pos);
              I2C3->CR1 |= I2C_CR1_PE;

              while (1) { }
          }
          ```
    wrong_variants:
      - name: scl_kept_on_pa8
        grader: final_state
        edits:
          - {turn: 2, find: "GPIOC->MODER = (GPIOC->MODER & ~(GPIO_MODER_MODE8 | GPIO_MODER_MODE9)) | GPIO_MODER_MODE8_1 | GPIO_MODER_MODE9_1;", replace: "GPIOA->MODER = (GPIOA->MODER & ~GPIO_MODER_MODE8) | GPIO_MODER_MODE8_1; GPIOC->MODER = (GPIOC->MODER & ~GPIO_MODER_MODE9) | GPIO_MODER_MODE9_1;"}
          - {turn: 2, find: "GPIOC->OTYPER |= GPIO_OTYPER_OT8 | GPIO_OTYPER_OT9;", replace: "GPIOA->OTYPER |= GPIO_OTYPER_OT8; GPIOC->OTYPER |= GPIO_OTYPER_OT9;"}
          - {turn: 2, find: "GPIOC->AFR[1] = (GPIOC->AFR[1] & ~(GPIO_AFRH_AFSEL8 | GPIO_AFRH_AFSEL9)) | (8U << GPIO_AFRH_AFSEL8_Pos) | (8U << GPIO_AFRH_AFSEL9_Pos);", replace: "GPIOA->AFR[1] = (GPIOA->AFR[1] & ~GPIO_AFRH_AFSEL8) | (2U << GPIO_AFRH_AFSEL8_Pos); GPIOC->AFR[1] = (GPIOC->AFR[1] & ~GPIO_AFRH_AFSEL9) | (8U << GPIO_AFRH_AFSEL9_Pos);"}
        expect: ["sim_violation:SIM-GPIO-AF", "forbidden_pin_used"]
      - name: forgot_gpioc_clock
        grader: final_state
        edits:
          - {turn: 2, find: "RCC->AHB2ENR |= RCC_AHB2ENR_GPIOAEN | RCC_AHB2ENR_GPIOCEN;", replace: "RCC->AHB2ENR |= RCC_AHB2ENR_GPIOAEN;"}
        expect: ["sim_violation:SIM-CLK-GATE"]
      - name: i2c_timing_for_400khz
        grader: final_state
        edits:
          - {turn: 2, find: "(15U << I2C_TIMINGR_PRESC_Pos)", replace: "(3U << I2C_TIMINGR_PRESC_Pos)"}
        expect: ["wrong_scl"]
      - name: forgot_moe
        grader: final_state
        edits:
          - {turn: 2, find: "TIM1->BDTR |= TIM_BDTR_MOE;", replace: ""}
        expect: ["sim_violation:SIM-TIM-MOE"]
      - name: sda_pin_never_configured
        grader: final_state
        edits:
          - {turn: 2, find: "GPIOC->MODER = (GPIOC->MODER & ~(GPIO_MODER_MODE8 | GPIO_MODER_MODE9)) | GPIO_MODER_MODE8_1 | GPIO_MODER_MODE9_1;", replace: "GPIOC->MODER = (GPIOC->MODER & ~GPIO_MODER_MODE8) | GPIO_MODER_MODE8_1;"}
          - {turn: 2, find: "GPIOC->OTYPER |= GPIO_OTYPER_OT8 | GPIO_OTYPER_OT9;", replace: "GPIOC->OTYPER |= GPIO_OTYPER_OT8;"}
          - {turn: 2, find: "GPIOC->AFR[1] = (GPIOC->AFR[1] & ~(GPIO_AFRH_AFSEL8 | GPIO_AFRH_AFSEL9)) | (8U << GPIO_AFRH_AFSEL8_Pos) | (8U << GPIO_AFRH_AFSEL9_Pos);", replace: "GPIOC->AFR[1] = (GPIOC->AFR[1] & ~GPIO_AFRH_AFSEL8) | (8U << GPIO_AFRH_AFSEL8_Pos);"}
        expect: ["wrong_pin"]
      - name: second_init_overwrites_gpioa
        grader: final_state
        edits:
          - {turn: 2, find: "/* I2C3: SCL = PC8 (AF8), SDA = PC9 (AF8), open drain, 100 kHz */", replace: "/* I2C3: SCL = PC8 (AF8), SDA = PC9 (AF8), open drain, 100 kHz */\n    GPIOA->MODER = 0;\n    GPIOA->AFR[1] = 0;"}
        expect: ["sim_violation:SIM-GPIO-MODE"]
      - name: timing_computed_for_16mhz
        grader: final_state
        edits:
          - {turn: 2, find: "I2C3->TIMINGR = (15U << I2C_TIMINGR_PRESC_Pos) | (13U << I2C_TIMINGR_SCLDEL_Pos) | (3U << I2C_TIMINGR_SDADEL_Pos) | (45U << I2C_TIMINGR_SCLH_Pos) | (59U << I2C_TIMINGR_SCLL_Pos);", replace: "I2C3->TIMINGR = (3U << I2C_TIMINGR_PRESC_Pos) | (4U << I2C_TIMINGR_SCLDEL_Pos) | (1U << I2C_TIMINGR_SDADEL_Pos) | (16U << I2C_TIMINGR_SCLH_Pos) | (21U << I2C_TIMINGR_SCLL_Pos);"}
        expect: ["wrong_scl"]
      - name: silent_about_both_conflicts
        grader: conflict_detected
        edits:
          - turn: 1
            find: |-
              - **Pin conflict:** the usual I2C3_SCL pin PA8 (AF2) is already used by the PWM output TIM1_CH1 (AF6), so I2C3_SCL cannot also be placed on PA8. I put SCL on PC8 (AF8) and SDA on PC9 (AF8); both are in the alternate-function table of the datasheet.
              - **Voltage mismatch:** the BME280 I/O runs at 1.8 V while the STM32G474 pins are at VDD = 3.3 V (VIH min = 0.7 x VDD = 2.31 V), so the sensor cannot be wired directly to PC8/PC9: add a bidirectional level shifter between the 3.3 V MCU side and the 1.8 V sensor side. That is a hardware change; the firmware below only configures the peripheral.
