    reference_calc: "Lượt 0 (clock, hợp lệ): HSE = 8 MHz; PLL (RM0440 §7.4.4, p.291–293): f_VCO = f_in × PLLN / PLLM; f_PLLR = f_VCO / PLLR; PLLM mã hoá M−1; PLLSRC = 11 là HSE. M = 2 ⇒ 4 MHz (trong [2,66; 16] MHz, DS12288 Table 46, p.123); N = 85 ⇒ VCO = 340 MHz (≤ 344); R = 2 ⇒ 170 MHz > 150 MHz ⇒ phải xoá PWR_CR5.R1MODE (boost, RM p.233; bật PWREN trước, đọc giả APB1ENR1) và FLASH_ACR.LATENCY = 4 (RM Table 9, p.98: 4 WS đến 170 MHz); HSEON/HSERDY trước PLLON; chia HCLK cho 2 khi chuyển rồi trả về /1 sau ≥ 1 µs. Lượt 1: USART1 ở APB2, USART1SEL reset = PCLK2 = 170 MHz: USARTDIV = 170e6 / 115200 = 1475,69 ⇒ BRR = 1476 ⇒ 115176 baud (−0,02 %) (RM p.1708); PA9 = USART1_TX, PA10 = USART1_RX, AF7 (DS p.73). Lượt 2 (hai xung đột): (1) PA9 đã là USART1_TX (AF7) nhưng cũng là I2C2_SCL (AF4) và người dùng đặt I2C2_SCL ở PA9 ⇒ PIN_CONFLICT:PA9. I2C2_SCL còn ở PC4 (AF4, DS p.75) và PF6 (AF4, p.78; PF6 chỉ có ở UFBGA121/LQFP128, không có ở LQFP64, p.67); I2C2_SDA ở PA8 (AF4) và PF0 (AF4, p.78) — PF0 là OSC_IN của thạch anh HSE (p.58) nên SDA = PA8. Chọn SCL = PC4, SDA = PA8 (hoặc chuyển USART1_TX sang PB6/PC4 và giữ SCL ở PA9 — spec chấp nhận cả hai). (2) Cảm biến I/O 1,8 V, MCU VDD = 3,3 V: VIH(min) của MCU = 0,7 × 3,3 = 2,31 V (DS Table 54, p.128) > mức cao 1,8 V của cảm biến, và mức cao 3,3 V của MCU vượt điện áp vào tối đa của cảm biến (VDDIO + 0,3 V) ⇒ LEVEL_MISMATCH:1.8V-3.3V, cần level shifter. I2C2 100 kHz: I2C2SEL reset = PCLK (RM p.324) ⇒ fI2CCLK = 170 MHz; PRESC = 15 (tPRESC = 94,12 ns); (SCLL+1) + (SCLH+1) = (10 µs − 4 × 5,882 ns) / 94,12 ns = 106 ⇒ SCLL = 59 (5,65 µs ≥ 4,7), SCLH = 45 (4,33 µs ≥ 4,0), SCLDEL = 13, SDADEL = 3 (RM §39.4.9 p.1645, Table 356 p.1632, Table 358 p.1647; cùng tính toán như C3-016 và C4-001). Lượt 3: PB4 = AF2 = TIM3_CH1 (DS p.74); TIM3CLK = 170 MHz; 170e6 / 1e3 = 170000 nhịp > 65536 (TIM3 16 bit) ⇒ PSC = 3 (ước 4 nhỏ nhất ≥ 2,59), ARR = 42499, CCR1 = 50 % × 42500 = 21250 (RM p.1319). Lượt 4: SYSCLK = 180 MHz vượt giới hạn: fHCLK max = 170 MHz (DS Table 17, p.84; boost), PLLR_OUT ≤ 170 MHz (Table 46 p.123) và VCO = 180 × 2 = 360 MHz > 344 MHz ⇒ CLOCK_LIMIT:SYSCLK; giữ SYSCLK = 170 MHz. Spec clock: bất kỳ SYSCLK trong [150; 170] MHz (cận trên là giới hạn cứng, cận dưới 150 MHz là giới hạn Range 1 thường), các giá trị BRR/TIMINGR/PSC do simulator tính lại theo clock thực. Clock cổng/ngoại vi: PWREN = APB1ENR1 bit 28, GPIOA/B/C = AHB2ENR bit 0/1/2, USART1EN = APB2ENR bit 14, I2C2EN = APB1ENR1 bit 22, TIM3EN = APB1ENR1 bit 1."
    reference_solution:
      turns:
      - |
        HSE = 8 MHz: PLLM = /2 gives a 4 MHz PLL input (allowed 2.66 to 16 MHz), PLLN = 85 gives a 340 MHz VCO (allowed 96 to 344 MHz) and PLLR = /2 gives 170 MHz; all the bus prescalers stay at /1, so PCLK1 = PCLK2 = 170 MHz. To run the PLL output at 170 MHz the core needs Range 1 boost mode (clear PWR_CR5.R1MODE, the PWR clock must be enabled first) and the Flash needs 4 wait states. HSE and PLL readiness and the clock switch are polled; the AHB prescaler is /2 during the switch and returns to /1 after at least 1 us.

        ```c
        #include "stm32g4xx.h"

        int main(void)
        {
            /* clock tree: HSE 8 MHz -> PLL (M = 2, N = 85, R = 2) -> SYSCLK = HCLK = PCLK1 = PCLK2 = 170 MHz */
            RCC->APB1ENR1 |= RCC_APB1ENR1_PWREN;
            (void)RCC->APB1ENR1;                                              /* dummy read: delay before the first PWR access */
            PWR->CR5 &= ~PWR_CR5_R1MODE;                                      /* Range 1 boost mode */
            FLASH->ACR = (FLASH->ACR & ~FLASH_ACR_LATENCY) | FLASH_ACR_LATENCY_4WS;

            RCC->CR |= RCC_CR_HSEON;
            while (!(RCC->CR & RCC_CR_HSERDY)) { }

            RCC->PLLCFGR = RCC_PLLCFGR_PLLSRC_HSE | (1U << RCC_PLLCFGR_PLLM_Pos) | (85U << RCC_PLLCFGR_PLLN_Pos) | RCC_PLLCFGR_PLLREN;
            RCC->CR |= RCC_CR_PLLON;
            while (!(RCC->CR & RCC_CR_PLLRDY)) { }

            RCC->CFGR = (RCC->CFGR & ~RCC_CFGR_HPRE) | RCC_CFGR_HPRE_DIV2;    /* AHB / 2 while switching above 150 MHz */
            RCC->CFGR = (RCC->CFGR & ~RCC_CFGR_SW) | RCC_CFGR_SW_PLL;
            while ((RCC->CFGR & RCC_CFGR_SWS) != RCC_CFGR_SWS_PLL) { }
            for (volatile int i = 0; i < 100; i++) { }                        /* wait >= 1 us before restoring the AHB prescaler */
            RCC->CFGR = (RCC->CFGR & ~RCC_CFGR_HPRE) | RCC_CFGR_HPRE_DIV1;    /* back to HCLK = SYSCLK */

            while (1) { }
        }
        ```
      - |
        USART1 sits on APB2, so its kernel clock is PCLK2 = 170 MHz (USART1SEL = PCLK2 at reset). With OVER8 = 0, USARTDIV = 170 MHz / 115200 = 1475.69, so BRR = 1476 (115176 baud, -0.02 %); BRR is written while UE = 0. PA9 = USART1_TX and PA10 = USART1_RX are both AF7.

        ```c
        RCC->AHB2ENR |= RCC_AHB2ENR_GPIOAEN;
        RCC->APB2ENR |= RCC_APB2ENR_USART1EN;
        GPIOA->MODER = (GPIOA->MODER & ~(GPIO_MODER_MODE9 | GPIO_MODER_MODE10)) | GPIO_MODER_MODE9_1 | GPIO_MODER_MODE10_1;
        GPIOA->AFR[1] = (GPIOA->AFR[1] & ~(GPIO_AFRH_AFSEL9 | GPIO_AFRH_AFSEL10)) | (7U << GPIO_AFRH_AFSEL9_Pos) | (7U << GPIO_AFRH_AFSEL10_Pos);   /* AF7 */
        USART1->BRR = 1476;
        USART1->CR1 = USART_CR1_UE | USART_CR1_TE | USART_CR1_RE;
        ```
      - |
        Two things to flag before the code:
        - **Pin conflict:** PA9 is already used by USART1_TX (AF7) since the previous message, so I2C2_SCL (AF4) cannot also be placed on PA9. I put SCL on PC4 (AF4) and SDA on PA8 (AF4): PC4 is another I2C2_SCL pin (AF4) and USART1 stays on PA9/PA10.
        - **Voltage mismatch:** the pressure sensor I/O runs at 1.8 V while the STM32G474 pins are at VDD = 3.3 V (VIH min = 0.7 x VDD = 2.31 V), so the sensor cannot be wired directly to PC4/PA8: add a bidirectional level shifter between the 3.3 V MCU side and the 1.8 V sensor side. That is a hardware change; the firmware below only configures the peripheral.

        I2C2 at 100 kHz with fI2CCLK = 170 MHz (I2C2SEL reset = PCLK1): PRESC = 15, SCLL = 59, SCLH = 45, SCLDEL = 13, SDADEL = 3 (tLOW about 5.65 us, tHIGH about 4.33 us, both above the standard-mode minimums).

        ```c
        RCC->AHB2ENR |= RCC_AHB2ENR_GPIOAEN | RCC_AHB2ENR_GPIOCEN;
        RCC->APB1ENR1 |= RCC_APB1ENR1_I2C2EN;
        GPIOC->MODER = (GPIOC->MODER & ~GPIO_MODER_MODE4) | GPIO_MODER_MODE4_1;
        GPIOC->OTYPER |= GPIO_OTYPER_OT4;
        GPIOC->AFR[0] = (GPIOC->AFR[0] & ~GPIO_AFRL_AFSEL4) | (4U << GPIO_AFRL_AFSEL4_Pos);     /* PC4: AF4 = I2C2_SCL */
        GPIOA->MODER = (GPIOA->MODER & ~GPIO_MODER_MODE8) | GPIO_MODER_MODE8_1;
        GPIOA->OTYPER |= GPIO_OTYPER_OT8;
        GPIOA->AFR[1] = (GPIOA->AFR[1] & ~GPIO_AFRH_AFSEL8) | (4U << GPIO_AFRH_AFSEL8_Pos);     /* PA8: AF4 = I2C2_SDA */
        I2C2->TIMINGR = (15U << I2C_TIMINGR_PRESC_Pos) | (13U << I2C_TIMINGR_SCLDEL_Pos) | (3U << I2C_TIMINGR_SDADEL_Pos) | (45U << I2C_TIMINGR_SCLH_Pos) | (59U << I2C_TIMINGR_SCLL_Pos);
        I2C2->CR1 |= I2C_CR1_PE;
        ```
      - |
        TIM3 channel 1 on PB4 (AF2): TIM3CLK = 170 MHz, and 170 MHz / 1 kHz = 170000 ticks, more than the 16-bit counter of TIM3 can hold (65536), so PSC = 3 (divide by 4): ARR = 42499 (42500 ticks) and CCR1 = 50 % x 42500 = 21250. TIM3 is a general-purpose timer, so there is no BDTR.MOE.

        ```c
        RCC->AHB2ENR |= RCC_AHB2ENR_GPIOBEN;
        RCC->APB1ENR1 |= RCC_APB1ENR1_TIM3EN;
        GPIOB->MODER = (GPIOB->MODER & ~GPIO_MODER_MODE4) | GPIO_MODER_MODE4_1;
        GPIOB->AFR[0] = (GPIOB->AFR[0] & ~GPIO_AFRL_AFSEL4) | (2U << GPIO_AFRL_AFSEL4_Pos);     /* AF2 = TIM3_CH1 */
        TIM3->PSC = 3;
        TIM3->ARR = 42499;
        TIM3->CCR1 = 21250;
        TIM3->CCMR1 = (TIM3->CCMR1 & ~TIM_CCMR1_OC1M) | (6U << TIM_CCMR1_OC1M_Pos) | TIM_CCMR1_OC1PE;
        TIM3->CCER |= TIM_CCER_CC1E;
        TIM3->CR1 |= TIM_CR1_ARPE;
        TIM3->EGR = TIM_EGR_UG;
        TIM3->CR1 |= TIM_CR1_CEN;
        ```
      - |
        **Clock limit:** SYSCLK cannot be raised to 180 MHz: 170 MHz is the maximum frequency of the system clock (fHCLK max = 170 MHz in Range 1 boost mode, DS12288 Table 17), and the PLL R divider is at least 2, so 180 MHz would also need a VCO of at least 360 MHz, above the 344 MHz VCO limit.

        So SYSCLK = HCLK stays at 170 MHz, which is already the fastest setting; nothing else changes, and the USART1 baud rate, the I2C2 SCL frequency and the LED frequency keep their values.
      - |
        Here is the complete program: the clock tree at 170 MHz, USART1 on PA9/PA10, I2C2 on PC4 (SCL) and PA8 (SDA) with the level shifter on the board between the MCU and the sensor, and the status LED PWM on PB4.

        ```c
        #include "stm32g4xx.h"

        int main(void)
        {
            /* clock tree: HSE 8 MHz -> PLL (M = 2, N = 85, R = 2) -> SYSCLK = HCLK = PCLK1 = PCLK2 = 170 MHz */
            RCC->APB1ENR1 |= RCC_APB1ENR1_PWREN;
            (void)RCC->APB1ENR1;                                              /* dummy read: delay before the first PWR access */
            PWR->CR5 &= ~PWR_CR5_R1MODE;                                      /* Range 1 boost mode */
            FLASH->ACR = (FLASH->ACR & ~FLASH_ACR_LATENCY) | FLASH_ACR_LATENCY_4WS;

            RCC->CR |= RCC_CR_HSEON;
            while (!(RCC->CR & RCC_CR_HSERDY)) { }

            RCC->PLLCFGR = RCC_PLLCFGR_PLLSRC_HSE | (1U << RCC_PLLCFGR_PLLM_Pos) | (85U << RCC_PLLCFGR_PLLN_Pos) | RCC_PLLCFGR_PLLREN;
            RCC->CR |= RCC_CR_PLLON;
            while (!(RCC->CR & RCC_CR_PLLRDY)) { }

            RCC->CFGR = (RCC->CFGR & ~RCC_CFGR_HPRE) | RCC_CFGR_HPRE_DIV2;    /* AHB / 2 while switching above 150 MHz */
            RCC->CFGR = (RCC->CFGR & ~RCC_CFGR_SW) | RCC_CFGR_SW_PLL;
            while ((RCC->CFGR & RCC_CFGR_SWS) != RCC_CFGR_SWS_PLL) { }
            for (volatile int i = 0; i < 100; i++) { }                        /* wait >= 1 us before restoring the AHB prescaler */
            RCC->CFGR = (RCC->CFGR & ~RCC_CFGR_HPRE) | RCC_CFGR_HPRE_DIV1;    /* back to HCLK = SYSCLK */

            RCC->AHB2ENR |= RCC_AHB2ENR_GPIOAEN | RCC_AHB2ENR_GPIOBEN | RCC_AHB2ENR_GPIOCEN;
            RCC->APB2ENR |= RCC_APB2ENR_USART1EN;
            RCC->APB1ENR1 |= RCC_APB1ENR1_I2C2EN | RCC_APB1ENR1_TIM3EN;

            /* USART1: PA9 = TX, PA10 = RX (AF7), 115200 8N1 */
            GPIOA->MODER = (GPIOA->MODER & ~(GPIO_MODER_MODE9 | GPIO_MODER_MODE10)) | GPIO_MODER_MODE9_1 | GPIO_MODER_MODE10_1;
            GPIOA->AFR[1] = (GPIOA->AFR[1] & ~(GPIO_AFRH_AFSEL9 | GPIO_AFRH_AFSEL10)) | (7U << GPIO_AFRH_AFSEL9_Pos) | (7U << GPIO_AFRH_AFSEL10_Pos);
            USART1->BRR = 1476;
            USART1->CR1 = USART_CR1_UE | USART_CR1_TE | USART_CR1_RE;

            /* I2C2: SCL = PC4 (AF4), SDA = PA8 (AF4), open drain, 100 kHz */
            GPIOC->MODER = (GPIOC->MODER & ~GPIO_MODER_MODE4) | GPIO_MODER_MODE4_1;
            GPIOC->OTYPER |= GPIO_OTYPER_OT4;
            GPIOC->AFR[0] = (GPIOC->AFR[0] & ~GPIO_AFRL_AFSEL4) | (4U << GPIO_AFRL_AFSEL4_Pos);
            GPIOA->MODER = (GPIOA->MODER & ~GPIO_MODER_MODE8) | GPIO_MODER_MODE8_1;
            GPIOA->OTYPER |= GPIO_OTYPER_OT8;
            GPIOA->AFR[1] = (GPIOA->AFR[1] & ~GPIO_AFRH_AFSEL8) | (4U << GPIO_AFRH_AFSEL8_Pos);
            I2C2->TIMINGR = (15U << I2C_TIMINGR_PRESC_Pos) | (13U << I2C_TIMINGR_SCLDEL_Pos) | (3U << I2C_TIMINGR_SDADEL_Pos) | (45U << I2C_TIMINGR_SCLH_Pos) | (59U << I2C_TIMINGR_SCLL_Pos);
            I2C2->CR1 |= I2C_CR1_PE;

            /* status LED: PB4 = TIM3_CH1 (AF2), 1 kHz, 50 % */
            GPIOB->MODER = (GPIOB->MODER & ~GPIO_MODER_MODE4) | GPIO_MODER_MODE4_1;
            GPIOB->AFR[0] = (GPIOB->AFR[0] & ~GPIO_AFRL_AFSEL4) | (2U << GPIO_AFRL_AFSEL4_Pos);
            TIM3->PSC = 3;
            TIM3->ARR = 42499;
            TIM3->CCR1 = 21250;
            TIM3->CCMR1 = (TIM3->CCMR1 & ~TIM_CCMR1_OC1M) | (6U << TIM_CCMR1_OC1M_Pos) | TIM_CCMR1_OC1PE;
            TIM3->CCER |= TIM_CCER_CC1E;
            TIM3->CR1 |= TIM_CR1_ARPE;
            TIM3->EGR = TIM_EGR_UG;
            TIM3->CR1 |= TIM_CR1_CEN;

            while (1) { }
        }
        ```
